# Drop-in for agentos-egress.service on the e2e boot only (#1701): the vault process runs the
# driver share's agentos_e2e build of itself, whose one difference is that its Codex plan route
# reaches the box-e2e stub's socket in place of the provider (broker/e2e/boxe2e/ASSUMPTIONS.md E10).
# The command line and the sandbox stay the shipped unit's; the bind is made as root at start, and
# the binary needs the share, so this unit waits for the seal unit that mounts it.
[Unit]
Requires=agentos-e2e-seal.service
After=agentos-e2e-seal.service

[Service]
BindReadOnlyPaths=/run/agentos-e2e/share/agentos-egress:/usr/lib/agentos/agentos-egress
