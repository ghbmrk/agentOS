# Drop-in for agentos-modem.service on the e2e boot only: the bridge looks for its modem under the
# driver's fake sysfs, whose ttyUSB node links to the simulated modem's pseudo-terminal.
[Service]
ExecStart=
ExecStart=/usr/lib/agentos/agentos-modem -owner-sock /run/agentos/owner.sock -roles /var/lib/agentos/modem/roles.json -sys-root /run/agentos-e2e-sysroot
DeviceAllow=char-pts rw
