# /usr slot A: this release, read-only erofs under dm-verity. Fixed size, so either slot fits a
# later release. Label enforcer_VERSION: the enforcer's slots never carry the core's agentos_ names.
[Partition]
Type=usr
Label=enforcer_%A
Format=erofs
CopyFiles=/usr:/
Verity=data
VerityMatchKey=usr
SplitName=usr
SizeMinBytes=3G
SizeMaxBytes=3G
