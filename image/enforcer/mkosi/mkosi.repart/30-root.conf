# The writable state partition: root, ext4, last on the disk so it grows to fill the drive on first
# boot (/usr/lib/repart.d/50-root.conf). Everything the enforcer writes lives here, never on /usr;
# the boot entry mounts it noexec. Not sealed to the TPM yet (ASSUMPTIONS.md ENF-m-4).
# /efi and /boot stay empty mount points, as in the core image.
[Partition]
Type=root
Format=ext4
CopyFiles=/
ExcludeFiles=/usr
ExcludeFiles=/efi/
ExcludeFiles=/boot/
SizeMinBytes=1G
GrowFileSystem=yes
