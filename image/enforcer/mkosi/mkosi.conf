# The enforcer's image (ENF-m, NET-2 Hardening; D-229): the core's pipeline (../../mkosi, image/README.md)
# with the enforcer's own names, key and feed. Debian 13 packages, /usr on dm-verity in A/B slots,
# Microsoft-signed shim -> Debian-signed systemd-boot -> Debian-signed kernel, boot counting with
# fallback. Build with ../build.sh; CI builds and boots it: .github/workflows/enforcer-image.yml.
[Config]
# The core's initrd settings (reproducible initrd, no LVM assembly), used as they are.
InitrdInclude=../../mkosi/initrd/

[Distribution]
Distribution=debian
Release=trixie
# The core's pinned snapshot; mkosi.pkgmngr's sources name it and live security.debian.org.
Mirror=https://snapshot.debian.org/archive/debian/20261001T000000Z/
Repositories=main

[Output]
Format=disk
ImageId=enforcer
SplitArtifacts=yes
RepartDirectories=mkosi.repart
ManifestFormat=json
# Fixed seed, not the core's: partition UUIDs and file-system IDs derive from it.
Seed=9d2e9a15-30ad-4c27-b7f1-f21496487db8

[Content]
Bootable=yes
Bootloader=systemd-boot
BiosBootloader=none
ShimBootloader=signed
UnifiedKernelImages=no
# The core's command line (../../mkosi/mkosi.conf says why each word is there) less prjquota (the
# enforcer runs no agent machines), plus usbcore.authorized_default=0: no USB device is authorised
# unless a udev rule names it by ID (NET-2 Hardening: unused USB ports off; briefs/ENF.md decision 11).
# Root hubs stay authorised, as the kernel always does. The two credentials run the enforcer's
# fallback from emergency and rescue mode, as the core's do. Decoded:
#   [Service]
#   ExecStartPre=-bash -c 'if [ -x /usr/lib/agentos-enforcer/fallback ]; then exec /usr/lib/agentos-enforcer/fallback; else exec systemctl reboot; fi'
KernelCommandLine=console=tty0 console=ttyS0 rw quiet panic=10 systemd.swap=0 rootflags=noexec usbcore.authorized_default=0
                  systemd.set_credential_binary=systemd.unit-dropin.emergency.service:W1NlcnZpY2VdCkV4ZWNTdGFydFByZT0tYmFzaCAtYyAnaWYgWyAteCAvdXNyL2xpYi9hZ2VudG9zLWVuZm9yY2VyL2ZhbGxiYWNrIF07IHRoZW4gZXhlYyAvdXNyL2xpYi9hZ2VudG9zLWVuZm9yY2VyL2ZhbGxiYWNrOyBlbHNlIGV4ZWMgc3lzdGVtY3RsIHJlYm9vdDsgZmknCg==
                  systemd.set_credential_binary=systemd.unit-dropin.rescue.service:W1NlcnZpY2VdCkV4ZWNTdGFydFByZT0tYmFzaCAtYyAnaWYgWyAteCAvdXNyL2xpYi9hZ2VudG9zLWVuZm9yY2VyL2ZhbGxiYWNrIF07IHRoZW4gZXhlYyAvdXNyL2xpYi9hZ2VudG9zLWVuZm9yY2VyL2ZhbGxiYWNrOyBlbHNlIGV4ZWMgc3lzdGVtY3RsIHJlYm9vdDsgZmknCg==
Hostname=enforcer
WithDocs=no
# No Wi-Fi or Bluetooth in the initrd (NET-2 Hardening; the core's finish check refuses Bluetooth
# there, #1475): the stacks and drivers are dropped, so their firmware goes too. The main system
# blocks Wi-Fi in modprobe.d; Bluetooth there is ENF-t's (its BLE dongle).
KernelModulesInitrdExclude=
        bluetooth
        /bt(usb|mtk)\.ko
        /net/wireless/
        /net/mac80211/
        /drivers/net/wireless/
# Nor in the image: what modprobe.d blocks is not installed at all (#4810). With a network card
# present, cfg80211 loaded on the enforcer despite its block (enforcer-image run 42499337177), so the
# Wi-Fi stacks and drivers, the modules outside them that need cfg80211 (staging Wi-Fi, batman-adv)
# and USB storage are dropped. mkosi keeps any module a kept one needs; mkosi.finalize refuses the
# tree if a blocked module is still there.
KernelModulesExclude=
        /net/wireless/
        /net/mac80211/
        /drivers/net/wireless/
        /drivers/staging/(rtl8192e|rtl8723bs|vt6656)/
        /net/batman-adv/
        /drivers/usb/storage/
# As the core: no kernel package files or random seed on the ESP (HW-1), no Debian .network files,
# no sysv generators.
RemoveFiles=
        /boot/vmlinuz-*
        /boot/config-*
        /boot/System.map-*
        /efi/loader/random-seed
        /usr/lib/systemd/network/80-*.network
        /var/spool/mail
        /usr/lib/systemd/system-generators/systemd-sysv-generator
        /usr/lib/systemd/system-generators/systemd-rc-local-generator
# No Wi-Fi client, access point or radio firmware: wpasupplicant, hostapd, iw, wireless-regdb and
# firmware-* are absent and mkosi.finalize refuses them. nftables is the firewall the daemon loads
# (briefs/ENF.md decision 4); the radios and dnsmasq come with their slices (ENF-m-b, ENF-t).
Packages=
        linux-image-amd64
        shim-signed
        systemd-boot
        systemd-boot-efi-amd64-signed
        systemd
        systemd-sysv
        systemd-repart
        udev
        kmod
        cryptsetup-bin
        util-linux
        nftables
        iproute2

Locale=C.UTF-8
Keymap=us
Timezone=UTC
RootPassword=hashed:!
