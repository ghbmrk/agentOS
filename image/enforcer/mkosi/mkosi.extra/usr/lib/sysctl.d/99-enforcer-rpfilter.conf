# #4810 (NET-2 Fails safe): the kernel's reverse-path filter is off on every interface. The ruleset's
# rpf chain replaces it (broker/enforcer/nft ENF-e-11); on, strict or loose, the kernel drops the WAN's
# DHCP answers before any rule sees them, so the uplink never leases. systemd's 50-default.conf sets
# default and every interface but "all" to 2; a later file's same key replaces it, the glob reaches
# each interface as it appears, and the kernel uses the larger of "all" and the interface's value.
# mkosi.finalize refuses any rp_filter key left non-zero; agentos-enforcer/health reads /proc/sys.
net.ipv4.conf.all.rp_filter=0
net.ipv4.conf.default.rp_filter=0
net.ipv4.conf.*.rp_filter=0
