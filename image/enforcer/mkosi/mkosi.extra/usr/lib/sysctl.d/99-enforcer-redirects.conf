# #5164 R3 (NET-2 Segments, Fails safe): the kernel takes no ICMP redirect, IPv4 or IPv6, on any
# interface, from boot and while agentos-enforcer is down; the daemon's own writes (ASSUMPTIONS
# ENF-l-21) then only repeat it. A redirect would let any host on a segment move a route. IPv4 takes
# one when "all" or the interface's own value is on (when both are, with forwarding on), so "all",
# "default" and every interface are 0; IPv6 reads the interface's own value, which "default" starts. The glob
# reaches each interface as udev adds it, and those up before systemd-sysctl runs. mkosi.finalize
# refuses any accept_redirects key left non-zero.
net.ipv4.conf.all.accept_redirects=0
net.ipv4.conf.default.accept_redirects=0
net.ipv4.conf.*.accept_redirects=0
net.ipv6.conf.all.accept_redirects=0
net.ipv6.conf.default.accept_redirects=0
net.ipv6.conf.*.accept_redirects=0
