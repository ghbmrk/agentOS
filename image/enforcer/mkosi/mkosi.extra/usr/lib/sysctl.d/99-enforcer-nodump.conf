# #4459 (NET-2 Confined radio stacks): a core dump goes to a helper that discards it, so a crashed
# radio stack never writes its memory (Thread's network keys) to a file, whatever its RLIMIT_CORE,
# and setuid and capability-changed processes never dump. The kernel's default pattern, "core", is
# relative and would write into the stack's run directory, which its adapter sees. Sorted last so a
# package's file cannot override it; mkosi.finalize and agentos-enforcer/health check both values.
kernel.core_pattern=|/usr/bin/false
fs.suid_dumpable=0
