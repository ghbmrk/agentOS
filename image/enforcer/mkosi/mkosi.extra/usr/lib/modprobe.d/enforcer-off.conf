# NET-2 Hardening: the Wi-Fi radio and USB storage are off. Every Wi-Fi driver needs cfg80211 (and
# most mac80211), so blocking the stacks blocks every radio, whatever card the box has; usb-storage
# and uas are the two USB mass-storage drivers. mkosi.finalize refuses a tree without these lines and
# agentos-enforcer/health fails a boot where any of them is loaded.
install cfg80211 /bin/false
install mac80211 /bin/false
install usb-storage /bin/false
install uas /bin/false
