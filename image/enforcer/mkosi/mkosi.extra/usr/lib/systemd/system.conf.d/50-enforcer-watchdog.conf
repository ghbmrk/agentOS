# NET-2 Hardening: a hardware watchdog restarts a stuck enforcer. PID 1 pets the first watchdog
# device every half period; if PID 1 hangs, the hardware resets the box after 30 s. A reboot that
# hangs is cut off after 10 minutes. The V1410's watchdog is the chipset's (iTCO_wdt, ASSUMPTIONS.md
# ENF-m-3); CI's QEMU gives it an i6300esb. agentos-enforcer/health fails a boot with none armed.
[Manager]
RuntimeWatchdogSec=30s
RebootWatchdogSec=10min
