# Broker state lives on the root partition and is created at boot, never shipped (HW-1).
d /var/lib/agentos 0700 root root -
# LOOP-7's state belongs to the fuzz children's user (sysusers.d/agentos-fuzz.conf), which reaches it
# through the broker's state directory by search only: it can list nothing there (agentosd L7-6).
a+ /var/lib/agentos - - - - u:agentos-fuzz:--x
d /var/lib/agentos/loop7 0700 agentos-fuzz agentos-fuzz -
