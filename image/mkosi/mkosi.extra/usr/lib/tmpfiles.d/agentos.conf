# Broker state lives on the root partition and is created at boot, never shipped (HW-1).
d /var/lib/agentos 0700 root root -
# The keeper's state (D-154, #2981): made at every boot, before any main-side unit, whose mask names
# each path. Enrollment fills the first two; setup leaves the Owner Card's factors in the third.
d /var/lib/agentos-store 0700 root root -
d /var/lib/agentos-kernel 0700 agentos-kernel agentos-kernel -
d /run/agentos-setup 0700 root root -
