# Broker state lives on the root partition and is created at boot, never shipped (HW-1).
d /var/lib/agentos 0700 root root -
# LOOP-7's state, /var/lib/agentos-fuzz, is a tree of its own beside the broker's, owned by the fuzz children's
# user (sysusers.d/agentos-fuzz.conf). agentosd creates it, puts it under its own disk quota and gives it to that
# user (agentosd L7-6); no line here creates it, since tmpfiles also runs at image build and the image must not
# ship it (mkosi.finalize). The user reaches nothing in the broker's state: the named-user entry with no
# permissions also replaces the search-only entry an earlier image gave it here.
a+ /var/lib/agentos - - - - u:agentos-fuzz:---
# The fuzz user writes only in its own tree, which its quota bounds: the shared world-writable directories are
# closed to it alone (a named-user entry overrides the other bits of a 1777 directory for that user only). Its
# temporary files go to TMPDIR, its run's scratch directory (agentosd L7-2).
a+ /tmp - - - - u:agentos-fuzz:---
a+ /var/tmp - - - - u:agentos-fuzz:---
a+ /dev/shm - - - - u:agentos-fuzz:---
