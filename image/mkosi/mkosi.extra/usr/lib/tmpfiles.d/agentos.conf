# Broker state lives on the root partition and is created at boot, never shipped (HW-1).
d /var/lib/agentos 0700 root root -
# LOOP-7's state, /var/lib/agentos/loop7, belongs to the fuzz children's user (sysusers.d/agentos-fuzz.conf),
# which reaches it through the broker's state directory by search only: it can list nothing there. agentosd
# creates loop7 and gives it to that user (agentosd L7-6); no line here creates it, since tmpfiles also runs
# at image build and the image's /var/lib/agentos must stay empty (mkosi.finalize).
a+ /var/lib/agentos - - - - u:agentos-fuzz:--x
