# The controller's RZ616 (MT7922) is a Wi-Fi and Bluetooth combo (#1415); the image ships neither
# half's firmware (D-178). Nothing in agentOS uses Bluetooth, so its modules never
# load: blacklist stops udev's autoload, install stops every other modprobe. mkosi.finalize checks
# the install lines are the ones kmod uses.
blacklist btusb
blacklist btmtk
install btusb /bin/false
install btmtk /bin/false
