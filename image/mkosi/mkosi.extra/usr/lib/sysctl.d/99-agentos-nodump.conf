# IMG-nodump (HW-1): a core dump goes to a helper that discards it, so no process (even one with
# RLIMIT_CORE raised) writes its memory to a file; setuid and capability-changed processes never
# dump. Sorted last so a package's file (systemd's 50-coredump.conf) cannot override it.
kernel.core_pattern=|/usr/bin/false
fs.suid_dumpable=0
