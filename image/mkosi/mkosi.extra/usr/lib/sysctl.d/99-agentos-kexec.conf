# MOR-kexec-class-fu (#6345, HW-8): no process loads a kernel to kexec into. The core's kernel has
# CONFIG_KEXEC=y and CONFIG_KEXEC_FILE=y, and a loaded kernel boots on memory the firmware never wiped
# while MOR is set. Once 1, this refuses kexec_load and kexec_file_load to every process, root included,
# and cannot be set back to 0 until the next boot. Sorted last so a package's file cannot override it.
kernel.kexec_load_disabled=1
