# NetworkManager manages one device: the station r4b creates (wlsta0). mkosi.finalize refuses any
# other key or value (networkmanager_violations); ASSUMPTIONS I21 and NM-1 give the reasons.
[main]
plugins=keyfile
# No connection for the wired port: networkd keeps it (I19).
no-auto-default=*
dns=systemd-resolved
auth-polkit=true

[keyfile]
# wlan0, every Ethernet port, veth, bridge and tun stay unmanaged whatever their names.
unmanaged-devices=*,except:interface-name:wlsta0
# A guard, not a feature (section 6.1, STO-2): no connection profile can reach the drive. (Its own
# state in /var/lib/NetworkManager can; r4b moves that off the drive.)
path=/run/NetworkManager/system-connections

[connectivity]
enabled=false
