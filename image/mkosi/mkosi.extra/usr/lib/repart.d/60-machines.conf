# First boot: the agent machines' volume (SR2-3i, RES-4), created after root on the drive itself.
# XFS so the broker can hold every machine to a project quota (agentosd -disk-quota on), and on its
# own partition so machine layers and snapshots cannot fill the disk the journal and owner state
# are on. Our own partition type: agentos-machines finds it by type on the boot drive only, never
# by label or file-system type (security M1). Encryption follows root's (P2-4; security M3).
[Partition]
Type=dbd1b055-3c71-434c-a687-eeefd49cc21b
Label=agentos-machines
Format=xfs
SizeMinBytes=2G
Weight=4000
