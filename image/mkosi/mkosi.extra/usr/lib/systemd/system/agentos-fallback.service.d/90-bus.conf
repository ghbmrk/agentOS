# This unit's `systemctl reboot` asks logind over the system bus (#5818): --check-inhibitors=yes lists
# logind's inhibitors, and a plain reboot goes through logind first. So it lifts the main side's mask
# of /run/dbus (agentos-.service.d/50-main-side.conf, read before this file) and keeps the rest of it.
# mkosi.finalize's BUS_UNITS rule holds this.
[Service]
InaccessiblePaths=
InaccessiblePaths=/var/lib/agentos-store /var/lib/agentos-kernel /run/agentos-setup /var/lib/agentos-mail /run/agentos-link-capture /var/lib/agentos-camera /var/lib/agentos-homekit
