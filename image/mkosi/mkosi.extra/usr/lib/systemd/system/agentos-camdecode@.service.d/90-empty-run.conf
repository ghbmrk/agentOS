# The main side's mask (agentos-.service.d/50-main-side.conf, read before this file) names keeper paths
# under /run, which this unit's empty /run lacks, and systemd fails a unit whose InaccessiblePaths= entry
# is missing (226/NAMESPACE). The empty /run already leaves none of them in view; the rest stay masked
# (#4392).
[Service]
InaccessiblePaths=
InaccessiblePaths=/var/lib/agentos-store /var/lib/agentos-kernel /var/lib/agentos-mail /var/lib/agentos-camera /var/lib/agentos-homekit
