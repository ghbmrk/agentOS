# The keeper boundary (D-154, #2905): every agentos-* unit is main side unless it is one of the
# keeper's, and none of them can see the keeper's state, which holds the sealed store, the log and
# its anchor. The only path from the main side to the keeper is the kernel's sockets in
# /run/agentos-kernel (0711, sockets only). "-": a box not yet enrolled has neither directory.
[Service]
InaccessiblePaths=-/var/lib/agentos-store -/var/lib/agentos-kernel
