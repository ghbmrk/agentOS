# The keeper boundary (D-154, #2905): every agentos-* unit is main side unless it is one of the
# keeper's, and none of them can see the keeper's state, which holds the sealed store, the log and
# its anchor, the Owner Card's factors before enrollment, the mail clerk's sealed Secrets, the
# first edge's capture, the camera clerk's sealed store and capture, and the HomeKit clerk's sealed
# store and devices file. The
# only paths from the main side to the keeper are the kernel's sockets in /run/agentos-kernel (0711,
# sockets and an empty "up" file only) and the clerks' in /run/agentos-mail, /run/agentos-camera and /run/agentos-homekit, each for one uid. tmpfiles.d makes each path at boot, before any unit here starts, so the mask holds on the
# setup boot too (#2981): a "-" path missing at a unit's start would give it no mask.
[Unit]
After=systemd-tmpfiles-setup.service

[Service]
InaccessiblePaths=/var/lib/agentos-store /var/lib/agentos-kernel /run/agentos-setup /var/lib/agentos-mail /run/agentos-link-capture /var/lib/agentos-camera /var/lib/agentos-homekit
