# This unit starts before sockets.target, so before dbus.socket makes /run/dbus, and systemd fails a unit
# whose InaccessiblePaths= entry is missing (226/NAMESPACE). The main side's mask
# (agentos-.service.d/50-main-side.conf, read before this file) is kept, with "-" on the system bus's
# directory only: the unit is a oneshot whose one command runs before the directory exists (#5818).
# mkosi.finalize's BUS_EARLY rule holds this.
[Service]
InaccessiblePaths=
InaccessiblePaths=/var/lib/agentos-store /var/lib/agentos-kernel /run/agentos-setup /var/lib/agentos-mail /run/agentos-link-capture /var/lib/agentos-camera /var/lib/agentos-homekit -/run/dbus
