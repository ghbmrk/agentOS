# Replaces agentos-.service.d/50-main-side.conf for this unit (same name, more specific directory),
# for two reasons (L3 fix-list on #5009):
# - That drop-in orders every agentos unit after systemd-tmpfiles-setup.service, which is after
#   local-fs.target and so after tmp.mount. This unit is before tmp.mount, so its stop runs after
#   /tmp is unmounted, and the two made an ordering cycle that systemd broke by dropping either this
#   unit (MOR never cleared, HW-8) or tmp.mount (/tmp not mounted, UPD-10).
# - Its mask hides /run/agentos-setup and /run/agentos-link-capture behind an empty directory, so
#   agentos-mor's held() would read them as empty and clear MOR while they hold a secret. The clear
#   lists those two (holdDirs) and never reads a file in them.
# The keeper's other state stays masked. A "-" path missing when a command starts gets no mask, so
# ExecStart (status, at early boot, before tmpfiles makes the paths) may run unmasked; ExecStop
# (clear, at shutdown) gets a namespace of its own, when every path exists.
# mkosi.finalize's MOR_UNIT rule holds this.
[Service]
InaccessiblePaths=-/var/lib/agentos-store -/var/lib/agentos-kernel -/var/lib/agentos-mail -/var/lib/agentos-camera -/var/lib/agentos-homekit
