# An unplugged box is healthy (I19, #1457 u1a): wait a few seconds for any one link, not 120 s for
# every link, and never leave a failed unit behind when none comes up. Nothing on the box needs to
# be online at boot (agentos-egress and the boot report wait for the network themselves).
[Service]
ExecStart=
ExecStart=-/usr/lib/systemd/systemd-networkd-wait-online --any --timeout=5
