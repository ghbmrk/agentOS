# The keeper's units (agentos-keeper.slice): in the keeper's slice, and with the main side's mask
# (agentos-.service.d/50-main-side.conf, read before this file) lifted, since this is their state.
# None makes a bus call, so the system bus stays masked (#5818).
[Service]
Slice=agentos-keeper.slice
InaccessiblePaths=
InaccessiblePaths=/run/dbus
