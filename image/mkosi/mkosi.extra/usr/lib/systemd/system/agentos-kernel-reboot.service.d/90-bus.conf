# agentos-kernel-reboot is the transient unit that agentos-keeper-kernel.service's ExecStopPost= starts
# with systemd-run (#2998). It runs `systemctl reboot`, which goes through logind on the system bus
# first (#5818), so it lifts the main side's mask of /run/dbus (agentos-.service.d/50-main-side.conf,
# read before this file) and keeps the rest of it. mkosi.finalize's BUS_UNITS lists it.
[Service]
InaccessiblePaths=
InaccessiblePaths=/var/lib/agentos-store /var/lib/agentos-kernel /run/agentos-setup /var/lib/agentos-mail /run/agentos-link-capture /var/lib/agentos-camera /var/lib/agentos-homekit
