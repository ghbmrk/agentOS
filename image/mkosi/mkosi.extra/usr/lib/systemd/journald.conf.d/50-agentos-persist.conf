# MOR-wipe-journal (#6078): agentos-keeper-wipe.service's error goes to the journal only (#6042) and
# is written at shutdown, so only an on-disk journal keeps it for the next boot (journalctl -b -1).
# Storage=auto would keep it only while Debian's postinst has made /var/log/journal; persistent makes
# the directory itself. mkosi.finalize fails the build if a later file turns this off.
[Journal]
Storage=persistent
