# The setup services' own users (#1249, #1270). agentosd runs as root and passes their uids to the
# vault process and its sockets; with-uids looks them up at each start, so no uid is fixed here.
u agentos-egress - "agentOS vault process"
u agentos-localui - "agentOS Wi-Fi page"
# The modem bridge's user: agentosd's -modem-uid must name a user even before the bridge ships (#1269).
u agentos-modem - "agentOS modem bridge"
# The home Wi-Fi helper's user (#1388); polkit grants it NetworkManager's Wi-Fi calls only.
u agentos-netjoin - "agentOS home Wi-Fi helper"
# hostapd's user (#1426): agentos-ap starts hostapd as it, with NET_ADMIN and NET_RAW only, so
# hostapd is not root to egress's uid-0 broker check. agentos-ap shares its group to hand it hostapd.conf.
u agentos-hostapd - "agentOS access point radio"
