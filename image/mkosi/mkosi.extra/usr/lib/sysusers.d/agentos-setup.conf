# The setup services' own users (#1249, #1270). agentosd runs as root and passes their uids to the
# vault process and its sockets; with-uids looks them up at each start, so no uid is fixed here.
u agentos-egress - "agentOS vault process"
u agentos-localui - "agentOS Wi-Fi page"
# The modem bridge's user: agentosd's -modem-uid must name a user even before the bridge ships (#1269).
u agentos-modem - "agentOS modem bridge"
# The keeper's (STO-2c, D-154): the kernel's own user, which the unlock step drops to and which owns
# /var/lib/agentos-kernel, and the kernel's two socket peers, the owner side and the model clerk
# (agentos-kernel -owner-uid, -meter-uid). None is in tss or the TPM's group (mkosi.finalize).
u agentos-kernel - "agentOS kernel"
u agentos-owner - "agentOS owner side"
u agentos-model - "agentOS model clerk"
# The mail clerk's own user (MAIL-unit), which owns /var/lib/agentos-mail, and the planner's, the only
# peer on the mail clerk's planner socket: no process runs as it yet, so that socket admits nobody.
u agentos-mail - "agentOS mail clerk"
u agentos-planner - "agentOS planner"
# The IMAP connection process's (#3015): each session's parser runs as it, never as the clerk, and it
# owns nothing on the box.
u agentos-imapconn - "agentOS IMAP connection process"
# The camera clerk's own user (CAM-clerk-image), which owns /var/lib/agentos-camera; its decoder
# sandboxes run under runsc as it too, rootless (CAM-host-11).
u agentos-camera - "agentOS camera clerk"
# The HomeKit clerk's own user (DEV-homekit-b2c), which owns /var/lib/agentos-homekit: the controller
# key's sealed slot and the devices file.
u agentos-homekit - "agentOS HomeKit clerk"
# The local inference service's (INFER-SVC INF-1): agentosd starts agentos-infer as this user in the
# inference leaf (-infer-uid); it owns nothing on the box, and the model is root's, read-only to it.
u agentos-infer - "agentOS local inference"
# The edge link's (EDGE-link-core c2c): agentos-link runs served as its own user, the kernel's link
# socket admits only it, and the capture's hello reader runs as it; and the one peer on its consumer
# socket, which no process runs as yet, so that socket admits nobody.
u agentos-link - "agentOS edge link"
u agentos-link-items - "agentOS edge link consumer"
