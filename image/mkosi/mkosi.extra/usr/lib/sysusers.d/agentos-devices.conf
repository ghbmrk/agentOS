# The device-driver host's user (DEVSLOT-drivers b2b, #3473). Its uid is fixed, unlike the setup
# services' (agentos-setup.conf): the driver template's Environment= names it for each driver's
# peer check (devslot/proc HostUIDEnv), and a unit cannot look a user up there. agentos-devices
# refuses to start under any other uid.
u agentos-devices 900 "agentOS device-driver host" - -
