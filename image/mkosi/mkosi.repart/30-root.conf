# Writable root, last on the disk so it can grow to fill the drive on first boot
# (/usr/lib/repart.d/50-root.conf). It holds no per-install state (mkosi.finalize, HW-1).
# /efi and /boot stay as empty mount points: gpt-auto mounts the ESP at /boot (systemd v257 takes
# /boot when it is empty and there is no XBOOTLDR; /efi stays an empty directory) (systemd-bless-boot).
[Partition]
Type=root
Format=ext4
CopyFiles=/
ExcludeFiles=/usr
ExcludeFiles=/efi/
ExcludeFiles=/boot/
SizeMinBytes=1G
GrowFileSystem=yes
