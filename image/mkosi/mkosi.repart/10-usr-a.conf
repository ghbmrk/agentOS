# /usr slot A: this release, read-only erofs under dm-verity. Fixed size, so either slot fits a
# later release (UPD-1). Label agentos_VERSION: gpt-auto and sysupdate pick slots by it.
[Partition]
Type=usr
Label=agentos_%A
Format=erofs
CopyFiles=/usr:/
Verity=data
VerityMatchKey=usr
SplitName=usr
SizeMinBytes=4G
SizeMaxBytes=4G
