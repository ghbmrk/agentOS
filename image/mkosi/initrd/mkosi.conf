# mkosi's default initrd for the agentOS image (IMG-2): mkosi.conf's InitrdInclude= adds this to
# the mkosi-initrd configuration, and nothing here reaches the host image. Two builds of one commit
# must give the same initrd bytes, as they give the same /usr (image.yml's reproduce job fails
# otherwise). The kernel-modules initrd already did; the default one differed because it keeps
# /etc and /var, which the image's /usr hash does not cover:
#   dpkg and update-alternatives log each step with the wall-clock time (/var/log/*.log), and
#   ldconfig's aux-cache records each library's inode and change time.
# Nothing in the initrd reads them. mkosi.finalize beside this pins /etc/shadow's last-change day.
[Content]
RemoveFiles=
        /var/log/*.log
        /var/cache/ldconfig/aux-cache
# mkosi-initrd installs lvm2, whose rules and tools would activate LVM on any disk, a host PC's
# included; the image has no LVM, and the host-disk rules are not in the initrd (HOST-1a, hostdisk
# H11). Its commands, rules and units are removed here, not with RemovePackages=: mkosi-initrd's own
# Debian settings carry an empty RemovePackages=, which clears ours (CI build (a) of #3306 still
# held lvm2). mkosi.finalize beside this refuses any assembly tool or rule still present.
        /usr/sbin/lv*
        /usr/sbin/pv*
        /usr/sbin/vg*
        /usr/sbin/fsadm
        /usr/lib/udev/rules.d/*lvm*
        /usr/lib/systemd/system/lvm2-*
        /usr/lib/systemd/system/blk-availability.service
        /usr/lib/systemd/system-generators/lvm2-*
        /etc/lvm
