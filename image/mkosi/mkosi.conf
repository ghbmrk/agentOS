# AgentOS device image (PLAN P2-1), the S7 stack: Debian 13 packages, /usr on dm-verity in A/B
# slots, booted Microsoft-signed shim -> Debian-signed systemd-boot -> Debian-signed kernel, with
# boot counting. Build with ../build.sh; CI builds and boots it: .github/workflows/image.yml.
[Config]
# The default initrd's own settings: drop the build's logs and caches and pin /etc/shadow's date,
# so two builds of one commit give the same initrd (IMG-2; initrd/mkosi.conf says what and why).
InitrdInclude=initrd/

[Distribution]
Distribution=debian
Release=trixie
# Pinned snapshot of the main archive, so a rebuild sees the same packages (README: reproducibility).
# Apt reads it, and live security.debian.org, through mkosi.pkgmngr/etc/apt/sources.list.d/mkosi.sources;
# the package manifest records what came from security.
Mirror=https://snapshot.debian.org/archive/debian/20261001T000000Z/
Repositories=main

[Output]
Format=disk
ImageId=agentos
SplitArtifacts=yes
RepartDirectories=mkosi.repart
ManifestFormat=json
# Fixed seed: partition UUIDs and file-system IDs derive from it, not from randomness.
Seed=6f0c2f52-6a3e-4b8e-9d1c-5a7e0b2c4d19

[Content]
Bootable=yes
Bootloader=systemd-boot
BiosBootloader=none
ShimBootloader=signed
# Non-UKI: a UKI would need our own Secure Boot key (HW-5); the initrd and command line rest on TPM
# measured boot instead (HW-5a).
UnifiedKernelImages=no
# No root=: systemd-boot sets LoaderDevicePartUUID, so gpt-auto finds root on the boot disk only (S7).
# mkosi adds usrhash=, which names the /usr release to mount (UPD-1a).
# A try that never reaches the health check must still end in a reboot, so systemd-boot counts it
# and falls back (UPD-1; L3 blocker on #41): panic= reboots after a kernel panic, and the two
# credentials add the same drop-in to emergency.service and rescue.service, in the initrd and the
# host (systemd-debug-generator; the default initrd has no mkosi.extra). Decoded:
#   [Service]
#   ExecStartPre=-bash -c 'if [ -x /usr/lib/agentos/fallback ]; then exec /usr/lib/agentos/fallback; else exec systemctl reboot; fi'
# The host runs the tries-aware fallback; the initrd, which lacks it, reboots. tests/test_image.py
# decodes and runs it.
# systemd.swap=0: gpt-auto and fstab make no swap units, so a swap partition added to the drive
# later is never used (IMG-nodump; finish_image.py checks it is in the built entry).
# rootflags=prjquota: agentosd caps each machine's disk with project quotas (RES-4), so root is
# mounted with them on (gpt-auto honours rootflags=; finish_image.py checks it and the features).
# noexec: nothing on the writable root runs (UPD-10); everything the box runs is on the read-only
# /usr, a separate mount. finish_image.py checks the built entry's last rootflags= ends noexec.
KernelCommandLine=console=tty0 console=ttyS0 rw quiet panic=10 systemd.swap=0 rootflags=prjquota,noexec
                  systemd.set_credential_binary=systemd.unit-dropin.emergency.service:W1NlcnZpY2VdCkV4ZWNTdGFydFByZT0tYmFzaCAtYyAnaWYgWyAteCAvdXNyL2xpYi9hZ2VudG9zL2ZhbGxiYWNrIF07IHRoZW4gZXhlYyAvdXNyL2xpYi9hZ2VudG9zL2ZhbGxiYWNrOyBlbHNlIGV4ZWMgc3lzdGVtY3RsIHJlYm9vdDsgZmknCg==
                  systemd.set_credential_binary=systemd.unit-dropin.rescue.service:W1NlcnZpY2VdCkV4ZWNTdGFydFByZT0tYmFzaCAtYyAnaWYgWyAteCAvdXNyL2xpYi9hZ2VudG9zL2ZhbGxiYWNrIF07IHRoZW4gZXhlYyAvdXNyL2xpYi9hZ2VudG9zL2ZhbGxiYWNrOyBlbHNlIGV4ZWMgc3lzdGVtY3RsIHJlYm9vdDsgZmknCg==
Hostname=agentos
# The root ext4's quota and project features (RES-4), for rootflags=prjquota above. mkosi passes
# its environment to systemd-repart, which adds these to mkfs.ext4 (only root is ext4). One word:
# mkosi splits Environment= on whitespace, so "-O quota,project" reaches mkfs as a bare -O.
Environment=SYSTEMD_REPART_MKFS_OPTIONS_EXT4=-Oquota,project
WithDocs=no
# The kernel-modules initrd mkosi builds holds every module and the firmware they name, Bluetooth
# included (4230 modules, BT_RAM_CODE among them, CI build of #1509), and it has none of the image's
# modprobe.d block: drop the Bluetooth stack and drivers (mkosi matches each regex against
# lib/modules/<kver>/kernel/...), so their firmware goes too. mkosi still adds back whatever a kept
# module depends on: Redpine's rsi_91x Wi-Fi driver needs btrsi and so bluetooth (CI build of #1509),
# so it goes too (the initrd needs no Wi-Fi). finish_image.py fails the build if any Bluetooth
# module, firmware or service is still in an initrd (#1475).
KernelModulesInitrdExclude=
        bluetooth
        /bt(usb|mtk)\.ko
        /wireless/rsi/
# The ESP is built from /efi and /boot (00-esp.conf). Drop what would otherwise land on it outside
# finish_image.py's allowlist (HW-1): Debian's kernel package files in /boot (mkosi has already
# copied vmlinuz to /usr/lib/modules, and installs the entry's kernel after this step) and the
# random seed bootctl install writes, which every drive would share. Also Debian's own 80-*.network
# files (container, VM, ad-hoc Wi-Fi): three masquerade, which turns forwarding on, and the
# inbound drop has no forward hook (#1478); mkosi.finalize refuses any other live .network file.
# And Debian's var/spool/mail link: it points into 2775 root:mail var/mail, which mkosi.finalize
# refuses as a step a non-root group can write (#1829); the box runs no mail.
# And NetworkManager's own configuration, connections and dispatcher scripts: the image ships
# usr/lib/NetworkManager/conf.d/50-agentos.conf and nothing else (mkosi.finalize,
# networkmanager_violations; I21, NM-1). That drops Debian's no-mac-addr-change.conf (it only
# turns off Wi-Fi MAC randomisation for two old drivers); the image sets none of those keys. And two
# of its udev rules (drivers, Thunderbolt), which do nothing for wlsta0: less root-run code to pin.
# And systemd-sysv's two generators, which turn /etc/init.d, /etc/rc?.d and /etc/rc.local into boot
# units the exec allowlist cannot see; every service the image runs has a native unit (#2176).
RemoveFiles=
        /boot/vmlinuz-*
        /boot/config-*
        /boot/System.map-*
        /efi/loader/random-seed
        /usr/lib/systemd/network/80-*.network
        /var/spool/mail
        /usr/lib/systemd/system-generators/systemd-sysv-generator
        /usr/lib/systemd/system-generators/systemd-rc-local-generator
        /etc/NetworkManager/NetworkManager.conf
        /etc/NetworkManager/system-connections
        /etc/NetworkManager/dispatcher.d
        /usr/lib/NetworkManager/dispatcher.d
        /usr/lib/NetworkManager/system-connections
        /usr/lib/NetworkManager/conf.d/no-mac-addr-change.conf
        /usr/lib/udev/rules.d/84-nm-drivers.rules
        /usr/lib/udev/rules.d/90-nm-thunderbolt.rules
# No access point, Wi-Fi join or radio firmware (D-178): the core and the edge never turn Wi-Fi on,
# so hostapd, dnsmasq, wireless-regdb and firmware-mediatek are gone and mkosi.finalize refuses them.
Packages=
        linux-image-amd64
        shim-signed
        systemd-boot
        systemd-boot-efi-amd64-signed
        systemd
        systemd-sysv
        systemd-resolved
        systemd-repart
        udev
        dbus
        kmod
        cryptsetup-bin
        util-linux
        fdisk
        ca-certificates
        nftables
        iproute2
        network-manager
        polkitd
        wpasupplicant

# Preset first-boot answers so nothing waits for a keyboard. Root is locked: there is no login.
Locale=C.UTF-8
Keymap=us
Timezone=UTC
RootPassword=hashed:!
