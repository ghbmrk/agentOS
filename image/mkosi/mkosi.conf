# AgentOS device image (PLAN P2-1), the S7 stack: Debian 13 packages, /usr on dm-verity in A/B
# slots, booted Microsoft-signed shim -> Debian-signed systemd-boot -> Debian-signed kernel, with
# boot counting. Build with ../build.sh; CI builds and boots it: .github/workflows/image.yml.
[Distribution]
Distribution=debian
Release=trixie
# Pinned snapshot of the main archive, so a rebuild sees the same packages (README: reproducibility).
# Apt reads it, and live security.debian.org, through mkosi.pkgmngr/etc/apt/sources.list.d/mkosi.sources;
# the package manifest records what came from security.
Mirror=https://snapshot.debian.org/archive/debian/20261001T000000Z/
Repositories=main

[Output]
Format=disk
ImageId=agentos
SplitArtifacts=yes
RepartDirectories=mkosi.repart
ManifestFormat=json
# Fixed seed: partition UUIDs and file-system IDs derive from it, not from randomness.
Seed=6f0c2f52-6a3e-4b8e-9d1c-5a7e0b2c4d19

[Content]
Bootable=yes
Bootloader=systemd-boot
BiosBootloader=none
ShimBootloader=signed
# Non-UKI: a UKI would need our own Secure Boot key (HW-5); the initrd and command line rest on TPM
# measured boot instead (HW-5a).
UnifiedKernelImages=no
# No root=: systemd-boot sets LoaderDevicePartUUID, so gpt-auto finds root on the boot disk only (S7).
# mkosi adds usrhash=, which names the /usr release to mount (UPD-1a).
# A try that never reaches the health check must still end in a reboot, so systemd-boot counts it
# and falls back (UPD-1; L3 blocker on #41): panic= reboots after a kernel panic, and the two
# credentials add the same drop-in to emergency.service and rescue.service, in the initrd and the
# host (systemd-debug-generator; the default initrd has no mkosi.extra). Decoded:
#   [Service]
#   ExecStartPre=-bash -c 'if [ -x /usr/lib/agentos/fallback ]; then exec /usr/lib/agentos/fallback; else exec systemctl reboot; fi'
# The host runs the tries-aware fallback; the initrd, which lacks it, reboots. tests/test_image.py
# decodes and runs it.
KernelCommandLine=console=tty0 console=ttyS0 rw quiet panic=10
                  systemd.set_credential_binary=systemd.unit-dropin.emergency.service:W1NlcnZpY2VdCkV4ZWNTdGFydFByZT0tYmFzaCAtYyAnaWYgWyAteCAvdXNyL2xpYi9hZ2VudG9zL2ZhbGxiYWNrIF07IHRoZW4gZXhlYyAvdXNyL2xpYi9hZ2VudG9zL2ZhbGxiYWNrOyBlbHNlIGV4ZWMgc3lzdGVtY3RsIHJlYm9vdDsgZmknCg==
                  systemd.set_credential_binary=systemd.unit-dropin.rescue.service:W1NlcnZpY2VdCkV4ZWNTdGFydFByZT0tYmFzaCAtYyAnaWYgWyAteCAvdXNyL2xpYi9hZ2VudG9zL2ZhbGxiYWNrIF07IHRoZW4gZXhlYyAvdXNyL2xpYi9hZ2VudG9zL2ZhbGxiYWNrOyBlbHNlIGV4ZWMgc3lzdGVtY3RsIHJlYm9vdDsgZmknCg==
Hostname=agentos
WithDocs=no
# The ESP is built from /efi and /boot (00-esp.conf). Drop what would otherwise land on it outside
# finish_image.py's allowlist (HW-1): Debian's kernel package files in /boot (mkosi has already
# copied vmlinuz to /usr/lib/modules, and installs the entry's kernel after this step) and the
# random seed bootctl install writes, which every drive would share.
RemoveFiles=
        /boot/vmlinuz-*
        /boot/config-*
        /boot/System.map-*
        /efi/loader/random-seed
Packages=
        linux-image-amd64
        shim-signed
        systemd-boot
        systemd-boot-efi-amd64-signed
        systemd
        systemd-sysv
        systemd-resolved
        systemd-repart
        udev
        dbus
        kmod
        cryptsetup-bin
        util-linux
        fdisk
        ca-certificates

# Preset first-boot answers so nothing waits for a keyboard. Root is locked: there is no login.
Locale=C.UTF-8
Keymap=us
Timezone=UTC
RootPassword=hashed:!
