# Additions to mkosi's default initrd (mkosi.conf: InitrdInclude=). The initrd checks that the drive
# it booted from is the only one carrying its IDs, and gives a fresh drive IDs of its own
# (usr/lib/agentos/drive-ids). It assembles no LVM or MD-RAID: the HOST-1a udev rule that keeps the
# host's disks hidden does not run here, and assembling a host's array could write its disks (an MD
# resync; HW-8). The AgentOS drive itself uses neither.
[Content]
Packages=
        fdisk
        dosfstools
RemovePackages=
        lvm2
        mdadm
# RemovePackages alone left lvm2's tools in the built initrd (first image CI run of the
# initrd check): its files go by path too.
RemoveFiles=
        /etc/lvm
        /usr/sbin/lvm
        /usr/sbin/lv*
        /usr/sbin/pv*
        /usr/sbin/vg*
        /usr/sbin/mdadm
        /usr/sbin/mdmon
        /usr/lib/udev/rules.d/*lvm*.rules
        /usr/lib/udev/rules.d/*md-raid*.rules
        /usr/lib/udev/rules.d/*mdadm*.rules
