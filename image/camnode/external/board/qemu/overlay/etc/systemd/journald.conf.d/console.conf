# QEMU board only: the journal goes to a console of its own (virtio, hvc0), where the end-to-end
# test reads the node's log; the serial console keeps the kernel's messages alone, so a journal
# write never holds it when the kernel prints its restart line. The CM4 image has no console
# (ASSUMPTIONS CAM-image-5).
[Journal]
ForwardToConsole=yes
TTYPath=/dev/hvc0
MaxLevelConsole=info
