# CM4 board: the camera (libcamera through unicam, the ISP and the encoder; the video group)
# and the IR illuminator. No thermal core is fitted on this build (ASSUMPTIONS CAM-image-7).
[Service]
Environment="CAMNODE_BOARD_FLAGS=-ir /sys/class/leds/ir/brightness"
SupplementaryGroups=video
DeviceAllow=char-video4linux rw
DeviceAllow=char-media rw
DeviceAllow=char-dma_heap rw
ReadWritePaths=-/sys/class/leds/ir/brightness
