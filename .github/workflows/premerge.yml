name: premerge
# PREMERGE-wire (#1860, #1834): posts the `premerge` commit status on a PR's head. It is
# `success` only when `tools/premerge.py --check` prints `same`: the newest trusted L3 verdict
# comment is an accept and the diff it reviewed (its `Record:` head) equals the head's, so a
# push after the accept, a later fix-list, a deleted accept or a PR never reviewed all fail;
# the lens screen the tier owes and, on a gate-file or tier-A PR, the Security accept must match too.
# Then each workflow the ruleset does not require (premerge.py HELD; #5366) must have passed on the head:
# GitHub merges an armed PR past a cancelled one, so the gate reads the head's runs, and reruns as each completes.
# The generated-file bot PRs (bot/trace, bot/metrics, bot/board from this repository, not a
# fork) carry no verdict and pass through `--bot` when they change only their own output and it
# is the bot's (MAIN-PROT-3, #757): the head commit's `Bot-Run:` trailer names the writer run, and
# the file must equal that run's artifact while the run is main's own workflow on a main commit.
# Main must require the `premerge` status (a ruleset change Mark makes).
# It reruns on every PR push and on every PR comment created, edited or deleted. Both events
# run the BASE branch's workflow file and tools/premerge.py: the PR head is fetched as git
# objects for `git merge-tree` and `git diff`; it is never checked out, imported or executed.
# Fail closed: anything but a clean `same` or `bot` posts `failure`.
# PREMERGE-stale (#1946): the job's own result is not the gate, the status is. A `failure`
# verdict leaves the job green: comment-time runs attach to main's head, so a red run there
# reads as main breaking, and the push-time red run would sit on the PR head after the accept.
# The job's colour plays no part in arming: `premerge` is a required status on main (#1994),
# so a head whose status is missing or `failure` cannot merge yet and can be armed, and the
# rerun's `success` releases it. The job goes red only when the
# script errors; once the head is known, an error exit still posts `failure` (the EXIT trap),
# so a rerun that dies cannot leave an earlier `success` standing on the head.
# PREMERGE-source (#1943): any pusher can post a GitHub Actions status (a branch workflow with
# `statuses: write`), so the status is posted with a token of the premerge GitHub App, whose key
# lives in the `premerge` environment that only main may deploy to, and the ruleset pins
# `premerge` to that App. A `pull_request_target` or comment run has ref main and gets the key; a
# branch workflow, or the base copy of a PR into another branch, does not. Until the App is set
# (vars.PREMERGE_APP_CLIENT_ID unset) the status falls back to github.token; once the ruleset pins
# the App, such a status counts for nothing, so a missing or broken App fails closed.
# ARM-on-accept (#3103): when the status it posts is `success` from `--check` (`same`), the
# `merge` job merges the PR once every check on the head is green, so whichever of the last
# accept and the last CI run lands last, the PR merges with no session acting after its
# verdict. Main's ruleset requires only some checks, so auto-merge would not wait for the rest
# (#3123 review); the job reads them all instead. The gate therefore also reruns when a PR's
# CI workflow completes. It merges an open, non-draft, unarmed PR only, pinned to the head the
# gate read (`sha`), so a push since then is refused, and runs no repository code. A check
# still running, or a refused merge, only warns: the next completion reruns it. It uses
# BOT_PR_TOKEN (the `bot` environment, main only, D-123), not GITHUB_TOKEN, whose merges
# start no push workflows on main; without that token it only warns, and a session arms by
# hand (OPERATING section 7).
# PREMERGE-inherited (#3532): a head branched from a red main stays red on that check after main
# is fixed (vulncheck on #3503, #3509, #3520, #3523), so a failed check or workflow run is
# excused when the same name failed in main's own first-attempt push or scheduled run of the
# PR's merge base. Any other conclusion, a failure the base lacked and any status still hold it.
# PREMERGE-merge-bind (#5384): the merge job waits only on this PR's runs (head repository and branch, from the
# gate's own read of the PR) and on every check run outside the other runs' suites, so a fork PR opened on the same
# commit cannot stall the bot merge with its own red or pending run.
# PREMERGE-fork-rerun (#5383): GitHub names no PR in a fork PR's workflow_run (`pull_requests` is
# empty), so the gate job skipped and a held check's completion left `premerge` at its last value.
# The `fork-pr` job finds the one open PR into main whose head is the run's owner:branch and
# dispatches this workflow on main with that number. It does not run the gate itself: the
# dispatched run joins the PR's own concurrency group (`premerge-<number>`), so it never runs
# beside the PR's comment or push runs, where a slower run that read an older verdict could post
# its status last. Dispatching takes `actions: write`; that job reads the run's head only as
# env strings, checks nothing out and runs no repository code. A dispatch from any other branch
# runs that branch's copy, which the `premerge` environment refuses its key, as for any branch
# workflow (PREMERGE-source); anyone who may dispatch may already comment, which reruns the gate.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
  issue_comment:
    types: [created, edited, deleted]
  workflow_run:
    workflows: [ci, assurance, vulncheck, word-budget, lane-gate, trusted-base, formal, keycheck, image, testkit-image, mutgate, infer-real, vision-real, enforcer-image, camnode-image, drone-sitl]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: the PR to rerun the gate for (premerge's fork-pr job)
        required: true
        type: number
permissions:
  contents: read
concurrency:
  group: premerge-${{ github.event.pull_request.number || github.event.issue.number || github.event.workflow_run.pull_requests[0].number || inputs.pr || github.run_id }}
  cancel-in-progress: false
jobs:
  premerge-gate:
    name: premerge-gate
    if: github.event_name == 'pull_request_target' || github.event.issue.pull_request || github.event.workflow_run.pull_requests[0] || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: premerge # deployment branches: main only; holds PREMERGE_APP_KEY
    outputs:
      merge-head: ${{ steps.gate.outputs.merge-head }}
      merge-repo: ${{ steps.gate.outputs.merge-repo }}
      merge-ref: ${{ steps.gate.outputs.merge-ref }}
    permissions:
      contents: read
      issues: read
      pull-requests: read
      actions: read # a bot PR's writer run and its artifact
      statuses: write # the `premerge` status on the PR head, nothing else
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0 # the merge base with the PR head
          persist-credentials: false
      - name: premerge App token
        id: app
        if: vars.PREMERGE_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ vars.PREMERGE_APP_CLIENT_ID }}
          private-key: ${{ secrets.PREMERGE_APP_KEY }}
          permission-statuses: write
      - name: Premerge (base copy of tools/premerge.py)
        shell: bash # -eo pipefail: GitHub's default `bash -e` lets a failed read piped into jq pass
        id: gate
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number || github.event.workflow_run.pull_requests[0].number || inputs.pr }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          STATUS_TOKEN: ${{ steps.app.outputs.token || github.token }}
        run: |
          # The head, branch and base come from the API, not the event: a comment event has no PR payload.
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]{0,9}$ ]] || { echo "not a PR number: $PR_NUMBER"; exit 1; }
          gh api "repos/$REPO/pulls/$PR_NUMBER" > "$RUNNER_TEMP/pr.json"
          HEAD_SHA=$(jq -r .head.sha "$RUNNER_TEMP/pr.json")
          echo "$HEAD_SHA" | grep -Eqx '[0-9a-f]{40}'
          posted=no
          post() {
            GH_TOKEN="$STATUS_TOKEN" gh api -X POST "repos/$REPO/statuses/$HEAD_SHA" -f state="$1" -f context=premerge \
              -f description="$2" -f target_url="$GITHUB_SERVER_URL/$REPO/actions/runs/$GITHUB_RUN_ID" > /dev/null
            posted=yes
          }
          trap '[ "$posted" = yes ] || post failure error' EXIT
          HEAD_REF=$(jq -r .head.ref "$RUNNER_TEMP/pr.json")
          HEAD_REPO=$(jq -r '.head.repo.full_name // ""' "$RUNNER_TEMP/pr.json")
          BASE_REF=$(jq -r .base.ref "$RUNNER_TEMP/pr.json")
          state=failure
          # errexit does not apply inside a substitution that is part of `&&`, so each step exits on its own failure.
          out=$(
            # The ruleset guards main only: a run for a PR into another branch must not mark its head.
            [ "$BASE_REF" = main ] || { echo "base-not-main"; exit 1; }
            git fetch --no-tags origin "+refs/pull/$PR_NUMBER/head:refs/remotes/pr/head" \
              "+refs/heads/$BASE_REF:refs/remotes/pr/base" || exit 1
            git cat-file -e "$HEAD_SHA^{commit}" || exit 1
            if [ "$HEAD_REPO" = "$REPO" ] && [ "${HEAD_REF#bot/}" != "$HEAD_REF" ]; then
              # The trailer only points; --bot proves the run is main's and the file its artifact's.
              run_id=$(git log -1 --format='%(trailers:key=Bot-Run,valueonly)' "$HEAD_SHA") || exit 1
              [[ "$run_id" =~ ^[0-9]+$ ]] || { echo "bot-unproven no-run"; exit 1; }
              gh api "repos/$REPO/actions/runs/$run_id" > "$RUNNER_TEMP/run.json" || exit 1
              art=$(gh api --paginate "repos/$REPO/actions/runs/$run_id/artifacts?per_page=100" \
                | jq -r --arg name "${HEAD_REF#bot/}" '.artifacts[] | select(.name == $name and (.expired | not)) | .id' \
                | sort -n | tail -n 1) || exit 1
              [[ "$art" =~ ^[0-9]+$ ]] || { echo "bot-unproven no-output"; exit 1; }
              gh api "repos/$REPO/actions/artifacts/$art/zip" > "$RUNNER_TEMP/output.zip" || exit 1
              exec python3 -I tools/premerge.py --bot "$HEAD_REF" --run "$RUNNER_TEMP/run.json" \
                --output "$RUNNER_TEMP/output.zip" --base refs/remotes/pr/base "$HEAD_SHA"
            fi
            gh api --paginate "repos/$REPO/issues/$PR_NUMBER/comments" \
              --jq '.[] | {author_association, created_at, updated_at, body}' > "$RUNNER_TEMP/comments.jsonl" || exit 1
            jq -s . "$RUNNER_TEMP/comments.jsonl" > "$RUNNER_TEMP/comments.json" || exit 1
            # PREMERGE-cancelled-checks (#5366): the head's runs and the merge base's main runs, each failed one with its
            # jobs (the head's latest attempt, the base's first), so --check holds the checks the ruleset does not require.
            onto=$(git merge-base refs/remotes/pr/base "$HEAD_SHA") || exit 1
            runs() { # $1: the runs query, $2: the jobs route under a failed run
              gh api --paginate "repos/$REPO/actions/runs?$1&per_page=100" --jq '.workflow_runs[]' | jq -s . > "$RUNNER_TEMP/r.json" || return 1
              jq -r '.[] | select(.conclusion == "failure") | .id' "$RUNNER_TEMP/r.json" | while read -r id; do
                gh api --paginate "repos/$REPO/actions/runs/$id/$2?per_page=100" --jq '.jobs[]' || exit 1
              done | jq -s --slurpfile r "$RUNNER_TEMP/r.json" '. as $j | $r[0] | map(.id as $id | . + {jobs: [$j[] | select(.run_id == $id)]})'
            }
            runs "head_sha=$HEAD_SHA" jobs > "$RUNNER_TEMP/head-runs.json" || exit 1
            runs "head_sha=$onto&event=push" attempts/1/jobs > "$RUNNER_TEMP/push-runs.json" || exit 1
            runs "head_sha=$onto&event=schedule" attempts/1/jobs > "$RUNNER_TEMP/schedule-runs.json" || exit 1
            # The PR's number, head repository and branch bind each head run to this PR (another PR can share the commit).
            jq -n --slurpfile h "$RUNNER_TEMP/head-runs.json" --slurpfile p "$RUNNER_TEMP/push-runs.json" \
              --slurpfile s "$RUNNER_TEMP/schedule-runs.json" --slurpfile pr "$RUNNER_TEMP/pr.json" --arg repo "$REPO" \
              '{repo: $repo, pr: {number: $pr[0].number, repo: $pr[0].head.repo.full_name, branch: $pr[0].head.ref},
                head: $h[0], base: ($p[0] + $s[0])}' > "$RUNNER_TEMP/runs.json" || exit 1
            exec python3 -I tools/premerge.py --check "$RUNNER_TEMP/comments.json" "$PR_NUMBER" --runs "$RUNNER_TEMP/runs.json" \
              --base refs/remotes/pr/base "$HEAD_SHA"
          ) && state=success
          out=$(printf '%s' "${out:-error}" | tail -n 1 | tr -cd '\40-\176' | cut -c 1-120)
          echo "premerge $HEAD_SHA: $state ($out)"
          post "$state" "$out"
          if [ "$state" = success ] && [ "$out" = same ] && \
            jq -e '.state == "open" and .draft == false and .auto_merge == null' "$RUNNER_TEMP/pr.json" > /dev/null; then
            printf 'merge-head=%s\nmerge-repo=%s\nmerge-ref=%s\n' "$HEAD_SHA" "$HEAD_REPO" "$HEAD_REF" >> "$GITHUB_OUTPUT"
          fi
  merge:
    name: merge
    needs: premerge-gate
    if: needs.premerge-gate.outputs.merge-head != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: bot # deployment branches: main only; holds BOT_PR_TOKEN
    permissions: {}
    steps:
      - name: Merge the accepted head once every check on it is green
        shell: bash # -eo pipefail: GitHub's default `bash -e` lets a failed read piped into jq pass
        env:
          GH_TOKEN: ${{ secrets.BOT_PR_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number || github.event.workflow_run.pull_requests[0].number || inputs.pr }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ needs.premerge-gate.outputs.merge-head }}
          HEAD_REPO: ${{ needs.premerge-gate.outputs.merge-repo }}
          HEAD_REF: ${{ needs.premerge-gate.outputs.merge-ref }}
        run: |
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]{0,9}$ ]] || { echo "not a PR number: $PR_NUMBER"; exit 1; }
          [ -n "$GH_TOKEN" ] || { echo "::warning::BOT_PR_TOKEN unset: arm #$PR_NUMBER by hand (OPERATING section 7)"; exit 0; }
          echo "$HEAD_SHA" | grep -Eqx '[0-9a-f]{40}'
          [ -n "$HEAD_REPO" ] && [ -n "$HEAD_REF" ] || { echo "::warning::#$PR_NUMBER head repository unknown: arm by hand"; exit 0; }
          # Every check run but this workflow's own jobs must have passed or failed on the merge base too; every status must have passed.
          # Each read stops the run on its own failure: a failed read must never look like no checks.
          # A job has no check run until GitHub creates it (`needs: scope`), so the head's workflow
          # runs must all have finished too (#3123 review). This workflow's own runs and this run's
          # check suite are left out by path and id, not by a name another workflow could reuse.
          suite=$(gh api "repos/$REPO/actions/runs/$GITHUB_RUN_ID" --jq .check_suite_id) && echo "$suite" | grep -Eqx '[0-9]+' \
            || { echo "::warning::#$PR_NUMBER own check suite unreadable; the next run retries"; exit 0; }
          # The names that already failed on the merge base excuse the same failure on the head; any failed read excuses none.
          # Only main's own first-attempt push or scheduled runs count, and only their jobs: a pusher can rerun or cancel
          # a base run, and a branch workflow can post a check run on any sha, even into an Actions suite of main's
          # (#3533 Security and delta L3 reviews), so the jobs come from each run's attempt-1 jobs list, not the sha's check runs.
          bwfs='[]' bruns='[]'
          if base=$(gh api "repos/$REPO/compare/main...$HEAD_SHA" --jq .merge_base_commit.sha) && echo "$base" | grep -Eqx '[0-9a-f]{40}'; then
            bw=$(gh api --paginate "repos/$REPO/actions/runs?head_sha=$base&per_page=100" --jq '.workflow_runs[]' \
              | jq -cs 'map(select(.head_branch == "main" and (.event | IN("push", "schedule")))) | group_by(.workflow_id)
                        | map(max_by(.id) | select(.run_attempt == 1 and .conclusion == "failure"))') || bw='[]'
            bwfs=$(printf '%s' "$bw" | jq -c 'map(.name)') || bwfs='[]'
            bruns=$(printf '%s' "$bw" | jq -r '.[].id' | while read -r id; do
                      echo "$id" | grep -Eqx '[0-9]+' && gh api --paginate "repos/$REPO/actions/runs/$id/attempts/1/jobs?per_page=100" --jq '.jobs[]' || exit 1
                    done | jq -cs 'map(select(.conclusion == "failure") | .name) | unique') || bruns='[]'
          fi
          echo "excused as failed on the merge base: $bwfs $bruns"
          # PREMERGE-merge-bind (#5384): another PR (a fork's, or one into another base) can carry this head commit, and
          # its runs and their check runs sit on the same sha. A run is this PR's when its head repository and branch are
          # the PR's; only the other runs' suites are left out of the check runs, so a check run no run claims still holds.
          hr=$(gh api --paginate "repos/$REPO/actions/runs?head_sha=$HEAD_SHA&per_page=100" --jq '.workflow_runs[]' \
            | jq -cs --arg repo "$HEAD_REPO" --arg ref "$HEAD_REF" \
                'map({ours: (.head_repository.full_name == $repo and .head_branch == $ref), check_suite_id, path, workflow_id, id, status, conclusion, name})') \
            || { echo "::warning::#$PR_NUMBER workflow runs unreadable; the next run retries"; exit 0; }
          foreign=$(printf '%s' "$hr" | jq -c 'map(select(.ours | not) | .check_suite_id)')
          wfs=$(printf '%s' "$hr" \
            | jq -r --argjson base "$bwfs" 'map(select(.ours and (.path | startswith(".github/workflows/premerge.yml") | not))) | group_by(.workflow_id)[] | max_by(.id)
                      | select(.status != "completed" or (.conclusion | IN("success", "skipped", "neutral") | not))
                      | select(.conclusion != "failure" or (.name | IN($base[]) | not)) | .name') \
            || { echo "::warning::#$PR_NUMBER workflow runs unreadable; the next run retries"; exit 0; }
          runs=$(gh api --paginate "repos/$REPO/commits/$HEAD_SHA/check-runs?per_page=100" --jq '.check_runs[]' \
            | jq -r --argjson suite "$suite" --argjson foreign "$foreign" --argjson base "$bruns" 'select(.check_suite.id != $suite)
                  | select(.check_suite.id | IN($foreign[]) | not)
                  | select(.status != "completed" or (.conclusion | IN("success", "skipped", "neutral") | not))
                  | select(.conclusion != "failure" or (.name | IN($base[]) | not)) | .name') \
            || { echo "::warning::#$PR_NUMBER check runs unreadable; the next run retries"; exit 0; }
          stats=$(gh api "repos/$REPO/commits/$HEAD_SHA/status?per_page=100" --jq '.statuses[] | select(.state != "success") | .context') \
            || { echo "::warning::#$PR_NUMBER statuses unreadable; the next run retries"; exit 0; }
          if [ -n "$wfs$runs$stats" ]; then echo "::notice::#$PR_NUMBER not merged yet, waiting on:" $wfs $runs $stats; exit 0; fi
          if ! gh api -X PUT "repos/$REPO/pulls/$PR_NUMBER/merge" -f merge_method=merge -f sha="$HEAD_SHA" > /dev/null; then
            echo "::warning::#$PR_NUMBER merge refused at $HEAD_SHA; the next run retries, or arm by hand"; exit 0
          fi
          echo "merged #$PR_NUMBER at $HEAD_SHA"
  fork-pr:
    name: fork-pr
    if: github.event_name == 'workflow_run' && !github.event.workflow_run.pull_requests[0] && startsWith(github.event.workflow_run.event, 'pull_request')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: read
      actions: write # dispatch premerge.yml on main for the run's PR, nothing else
    steps:
      - name: Rerun the gate for the run's one open PR into main
        shell: bash # -eo pipefail: a failed read must stop the step, never read as no PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_OWNER: ${{ github.event.workflow_run.head_repository.owner.login }}
          HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          # The run's head comes from a fork, so it is read only as these env strings, never as code.
          [[ "$HEAD_OWNER" =~ ^[A-Za-z0-9-]+$ ]] && [ "$HEAD_REPO" != "${HEAD_REPO#"$HEAD_OWNER"/}" ] && [ -n "$HEAD_BRANCH" ] \
            || { echo "::warning::the run names no head repository and branch; no gate rerun"; exit 0; }
          # GitHub's head filter is owner:branch; the PR must also name the run's repository and branch exactly, into main.
          gh api -X GET "repos/$REPO/pulls" -f state=open -f base=main -f head="$HEAD_OWNER:$HEAD_BRANCH" -f per_page=100 \
            > "$RUNNER_TEMP/prs.json"
          prs=$(jq -c --arg repo "$HEAD_REPO" --arg ref "$HEAD_BRANCH" \
            '[.[] | select(.head.repo.full_name == $repo and .head.ref == $ref and .base.ref == "main") | .number]' "$RUNNER_TEMP/prs.json")
          if [ "$(jq length <<< "$prs")" != 1 ]; then
            echo "::warning::$HEAD_REPO:$HEAD_BRANCH has open PRs into main $prs, not one; no gate rerun"; exit 0
          fi
          pr=$(jq '.[0]' <<< "$prs")
          [[ "$pr" =~ ^[1-9][0-9]{0,9}$ ]]
          gh api -X POST "repos/$REPO/actions/workflows/premerge.yml/dispatches" -f ref=main -f "inputs[pr]=$pr" > /dev/null
          echo "reran the gate for #$pr"
