name: trusted-base
# KRN-2m (#2849): measures the trusted base on every PR (own lines, dependency lines, parsers;
# SPEC KRN-2) and shows the table in this check's job summary; it fails a PR that adds a parser
# without a `<key> #<PR> -- <reason>` line added to tools/trusted_base_reasons.txt (a body line
# waives nothing, #6395: it can change after the reviews at the same head), or grows the trusted core
# (tools/trusted_core.txt) without a `Trusted-core:` line. It runs on
# pull_request_target, so the workflow and tools/trusted_base.py are the base branch's copies:
# a PR cannot loosen the check it is measured by. The base side is base.sha; the head side is
# the PR head merged onto it with `git merge-tree`, so the measure is what lands and a branch
# cannot keep an older, larger budget (KRN-2cap-harden, #2945); a merge that conflicts fails
# the step. Both trees are checked out as worktrees and only listed by `go list` (vendored,
# offline, GOTOOLCHAIN=local); no PR code is built or run. CI-trusted-base-records (#6404): no step
# reads the PR body, and there is no `edited` trigger: every waiver, the core's and the ceilings'
# decision lines included, is a line of tools/trusted_base_reasons.txt in the head the reviews name,
# so a body edit can neither rerun nor change this check. CI-ceiling-fall (#5174): the base is the base branch's tip when the job runs, not the
# event's base.sha, so when trusted-base-rerun.yml reruns this run after main grows, the PR is
# measured against the new main and a PR that no longer fits under a ceiling turns red. One more step (REV-PROOF-claims, #4909) holds text a tool computes to the tool: a
# trusted-core growth decision the PR adds must carry `trusted_base.py measure --sentence` output
# for the PR it names (fetched by number, listed by `go list` the same way). The closing-keyword
# check of the body (tools/claims.py) runs in lane-gate.yml, which reruns on `edited`.
# tests/test_trusted_base.py pins every line below.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
# CI-cancel-superseded (#5345, #5348): a PR's first-attempt run cancels that PR's older first
# attempts, so a superseded head never holds the queue. A rerun (attempt 2 or later) and every push,
# merge-queue, schedule or dispatch run is a group of its own (run id), so it never cancels or
# replaces the current head's run.
concurrency:
  group: ${{ github.workflow }}-${{ startsWith(github.event_name, 'pull_request') && github.run_attempt == 1 && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ startsWith(github.event_name, 'pull_request') && github.run_attempt == 1 }}
permissions:
  contents: read
jobs:
  trusted-base:
    name: trusted-base
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.ref }} # the live tip, also on a rerun
          fetch-depth: 0 # history for the merge with the PR head
          persist-credentials: false
      - name: Go version (the base's broker/go.mod toolchain line)
        id: go
        run: |
          v=$(awk '$1 == "toolchain" {print $2}' broker/go.mod)
          echo "$v" | grep -Eqx 'go1\.[0-9]+(\.[0-9]+)?'
          echo "version=${v#go}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version: ${{ steps.go.outputs.version }}
          cache: false
      - name: Trusted base (base copy of tools/trusted_base.py)
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git fetch --no-tags origin "+refs/pull/$PR_NUMBER/head:refs/remotes/pr/head"
          git cat-file -e "$HEAD_SHA^{commit}"
          # Exit 1 on a conflict, which ends the step (bash -e): no merge, no pass.
          MERGED=$(git merge-tree --write-tree --no-messages HEAD "$HEAD_SHA")
          MERGE=$(git -c user.name=trusted-base -c user.email=trusted-base@invalid commit-tree -p HEAD -p "$HEAD_SHA" -m merge "$MERGED")
          git -c core.hooksPath=/dev/null worktree add --detach "$RUNNER_TEMP/base" HEAD
          git -c core.hooksPath=/dev/null worktree add --detach "$RUNNER_TEMP/head" "$MERGE"
          python3 -I tools/trusted_base.py check --base-tree "$RUNNER_TEMP/base" --head-tree "$RUNNER_TEMP/head" --pr "$PR_NUMBER" --markdown "$GITHUB_STEP_SUMMARY"
      - name: Measure sentences of added trusted-core growth decisions (base copy, D-159)
        if: ${{ !cancelled() }}
        run: python3 -I tools/trusted_base.py claims --base-tree "$RUNNER_TEMP/base" --head-tree "$RUNNER_TEMP/head" --repo . --fetch origin --markdown "$GITHUB_STEP_SUMMARY"
