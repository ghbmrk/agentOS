name: trusted-base
# KRN-2m (#2849): measures the trusted base on every PR (own lines, dependency lines, parsers;
# SPEC KRN-2) against the PR's merge base, shows the table in this check's job summary, and
# fails a PR that grows any of them without a `Trusted-base: <key> -- <reason>` line in its
# body. It runs on pull_request_target, so the workflow and tools/trusted_base.py are the
# base branch's copies: a PR cannot loosen the check it is measured by. The head and the
# merge base are checked out as worktrees and only listed by `go list` (vendored, offline,
# GOTOOLCHAIN=local); no PR code is built or run. `edited` reruns it when the body changes.
# tests/test_trusted_base.py pins every line below.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
permissions:
  contents: read
jobs:
  trusted-base:
    name: trusted-base
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0 # the merge base with the PR head
          persist-credentials: false
      - name: Go version (the base's broker/go.mod toolchain line)
        id: go
        run: |
          v=$(awk '$1 == "toolchain" {print $2}' broker/go.mod)
          echo "$v" | grep -Eqx 'go1\.[0-9]+(\.[0-9]+)?'
          echo "version=${v#go}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version: ${{ steps.go.outputs.version }}
          cache: false
      - name: Trusted base (base copy of tools/trusted_base.py)
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          git fetch --no-tags origin "+refs/pull/$PR_NUMBER/head:refs/remotes/pr/head"
          git cat-file -e "$HEAD_SHA^{commit}"
          MERGE_BASE=$(git merge-base HEAD "$HEAD_SHA")
          git -c core.hooksPath=/dev/null worktree add --detach "$RUNNER_TEMP/base" "$MERGE_BASE"
          git -c core.hooksPath=/dev/null worktree add --detach "$RUNNER_TEMP/head" "$HEAD_SHA"
          printf '%s\n' "$PR_BODY" > "$RUNNER_TEMP/body.txt"
          python3 -I tools/trusted_base.py check --base-tree "$RUNNER_TEMP/base" --head-tree "$RUNNER_TEMP/head" --body "$RUNNER_TEMP/body.txt" --markdown "$GITHUB_STEP_SUMMARY"
