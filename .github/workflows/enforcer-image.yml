name: enforcer-image
# The enforcer's image (image/enforcer/, ENF-m, NET-2 Hardening): finish_image.py's key separation
# on throwaway TUF feeds made with agentos-release, then a build with a throwaway enforcer root, and
# a QEMU boot under Secure Boot (image/enforcer/ci_boot.sh). On changes to the profile, the core
# image steps it imports (image/finish_image.py, image/mkosi/initrd/), the release tool, this file,
# on main, and nightly. The keys are throwaway: nothing this builds is a release.
on:
  workflow_dispatch:
  schedule:
    - cron: "53 4 * * *"
  pull_request:
    paths:
      - "image/enforcer/**"
      - "image/finish_image.py"
      - "image/slot_a_scan.allow"
      - "image/mkosi/initrd/**"
      - "broker/cmd/agentos-release/**"
      - "broker/update/**"
      - ".github/workflows/enforcer-image.yml"
  push:
    branches: [main]
    paths:
      - "image/enforcer/**"
      - "image/finish_image.py"
      - "image/slot_a_scan.allow"
      - "image/mkosi/initrd/**"
      - "broker/cmd/agentos-release/**"
      - "broker/update/**"
      - ".github/workflows/enforcer-image.yml"
env:
  GOWORK: "off"
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5.6.0
        with:
          go-version-file: broker/go.mod
          cache: false
      - name: Key separation unit tests
        run: python3 image/enforcer/test_finish_image.py -v
      - name: Tree check unit tests
        run: python3 image/enforcer/test_finalize.py -v
      - name: WAN router-advertisement check unit tests
        run: python3 image/enforcer/test_ci_wan.py -v
      - name: Throwaway feeds, and the key separation on them
        run: image/enforcer/throwaway_feeds.sh "$RUNNER_TEMP/feeds"
      - name: Install build and boot tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends debian-archive-keyring systemd-boot systemd-boot-efi \
            systemd-container erofs-utils dosfstools mtools e2fsprogs cpio zstd kmod bubblewrap cryptsetup-bin \
            qemu-system-x86 ovmf swtpm swtpm-tools
          # Ubuntu 24.04 confines user namespaces via AppArmor, which breaks mkosi's bubblewrap sandbox.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo git clone -q https://github.com/systemd/mkosi /opt/mkosi
          sudo git -C /opt/mkosi -c advice.detachedHead=false checkout -q 26673f65e17ae099bb0cf65928fe70c93b8a6a37  # v24.3
      - name: Build image
        shell: bash  # with pipefail, so tee keeps the build's exit status
        run: |
          set -o pipefail
          sudo env "PATH=$PATH" HOME=/root MKOSI=/opt/mkosi/bin/mkosi \
            ENFORCER_RELEASE_ROOT="$RUNNER_TEMP/feeds/enforcer/repo/metadata/1.root.json" \
            AGENTOS_RELEASE_KEYS="$RUNNER_TEMP/feeds/core/root.json" \
            image/enforcer/build.sh "$RUNNER_TEMP/out" 2>&1 | tee "$RUNNER_TEMP/build.log" | tail -n 80
      - name: Boot test (Secure Boot on, Wi-Fi and USB storage off, watchdog, rollback)
        run: |
          sudo modprobe kvm 2>/dev/null || true
          sudo image/enforcer/ci_boot.sh "$RUNNER_TEMP/out/enforcer_$(jq -r .version "$RUNNER_TEMP"/out/enforcer_*.release.json).raw" "$RUNNER_TEMP/boot"
      - name: Keep the logs
        if: always()
        run: sudo tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/logs.tar.gz" --ignore-failed-read build.log boot out/SHA256SUMS || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: enforcer-image-logs
          path: ${{ runner.temp }}/logs.tar.gz
          if-no-files-found: ignore
