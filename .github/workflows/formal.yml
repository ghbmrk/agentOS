name: formal
# FRM-key (#2936): model-checks KeyVerdict.tla and HoldRule.tla in broker/kernel/formal/ with
# TLC, fails on any invariant or property violation, fails when the committed vectors differ
# from a fresh run, and replays every model state (not just the committed sample) through
# broker/kernel/key and the kernel. tla2tools.jar is the v1.7.4 release; vectors.py refuses
# any other build.
on:
  pull_request:
    paths:
      - 'broker/kernel/formal/**'
      - 'broker/kernel/**'
      - 'broker/clerk/**'
      - '.github/workflows/formal.yml'
  push:
    branches: [main]
    paths:
      - 'broker/kernel/formal/**'
      - 'broker/kernel/**'
      - 'broker/clerk/**'
      - '.github/workflows/formal.yml'
# CI-cancel-superseded (#5345, #5348): a PR's first-attempt run cancels that PR's older first
# attempts, so a superseded head never holds the queue. A rerun (attempt 2 or later) and every push,
# merge-queue, schedule or dispatch run is a group of its own (run id), so it never cancels or
# replaces the current head's run.
concurrency:
  group: ${{ github.workflow }}-${{ startsWith(github.event_name, 'pull_request') && github.run_attempt == 1 && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ startsWith(github.event_name, 'pull_request') && github.run_attempt == 1 }}
permissions:
  contents: read
env:
  GOWORK: "off" # = ci.yml: a go.work cannot change what a Go command here loads
jobs:
  formal:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version: "1.26.11" # = broker/go.mod's toolchain line
          cache: false
      - name: TLC (tla2tools v1.7.4)
        run: |
          java -version
          curl -sSfL -o "$RUNNER_TEMP/tla2tools.jar" https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
      - name: Model-check, and compare the committed vectors
        run: python3 broker/kernel/formal/vectors.py --jar "$RUNNER_TEMP/tla2tools.jar" --check --full "$RUNNER_TEMP/formal"
      - name: Replay every model state through the key library and the kernel
        working-directory: broker
        env:
          FORMAL_VECTORS: ${{ runner.temp }}/formal
        run: go test -count=1 -run 'Formal' -v ./kernel/key ./kernel
