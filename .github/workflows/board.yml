name: board
# SIM-repo-2: BOARD.md carries board.GENERATED (SIM-repo-2b), so only this workflow writes its
# rows, rendered from the work-item issues (tools/board.py render --repo).
# Same split as trace.yml: rendering runs with a read-only token; only the commit job can
# write, it runs no repository code, and it changes only BOARD.md. The commit job pushes the
# bot/board branch, opens (or updates) its PR and dispatches ci.yml there, where board.py check
# --repo compares the file with the live issues. The PR asks for auto-merge; that waits for
# green checks only once main's ruleset requires them (stage 2), and without the repo's
# 'Allow auto-merge' setting the PR is merged by hand.
on:
  issues:
    types: [opened, edited, deleted, transferred, closed, reopened, labeled, unlabeled]
  push:
    branches: [main]
    paths: [BOARD.md]
  workflow_dispatch:
permissions:
  contents: read
# Each run renders the latest issues, so a newer run supersedes an older one.
concurrency:
  group: board
  cancel-in-progress: true
jobs:
  render:
    # Only a collaborator's issue can be a work item (board.COLLABORATORS); an outsider's issue
    # starts no run.
    if: >-
      github.ref == 'refs/heads/main' && (github.event_name != 'issues'
      || contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      pull-requests: read # board.py's PR cross-check notes (D21)
    outputs:
      board: ${{ steps.gen.outputs.board }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0 # main before the push, for the generated-line guard
          persist-credentials: false
      - name: Render BOARD.md from the work-item issues
        id: gen
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
        run: |
          if ! grep -qF '<!-- Generated by tools/board.py' BOARD.md; then
            # Generated-ness comes from main before the push: a push that drops the line fails
            # here instead of silently ending the generated board (ci.yml blocks such PRs).
            if [ "$GITHUB_EVENT_NAME" = push ] && git show "$BEFORE:BOARD.md" 2>/dev/null \
                | grep -qF '<!-- Generated by tools/board.py'; then
              echo "::error::this push drops board.GENERATED from BOARD.md; restore it or retire board.yml"
              exit 1
            fi
            echo "BOARD.md is not generated yet (SIM-repo-2b adds board.GENERATED); nothing to do"
            exit 0
          fi
          python3 tools/board.py render --repo "$GITHUB_REPOSITORY" > rendered.md
          mv rendered.md BOARD.md
          echo "board=$(base64 -w0 BOARD.md)" >> "$GITHUB_OUTPUT"
  commit:
    needs: render
    if: needs.render.outputs.board != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # push the bot/board branch (never main)
      pull-requests: write # open, auto-merge or close its PR
      actions: write # dispatch ci.yml on the branch
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: bot/board
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: main
      - name: Open or update the BOARD.md PR if changed
        env:
          BOARD_B64: ${{ needs.render.outputs.board }}
        run: |
          printf '%s' "$BOARD_B64" | base64 -d > BOARD.md
          if git diff --quiet -- BOARD.md; then
            echo "BOARD.md unchanged"
            # main already matches: an open PR from an earlier run is obsolete.
            gh pr close "$BRANCH" --delete-branch 2>/dev/null || true
            exit 0
          fi
          test -z "$(git status --porcelain | grep -v ' BOARD.md$')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -qC "$BRANCH"
          git commit -qm "board: render BOARD.md from the work-item issues" -- BOARD.md
          # Rebuilt from main each run, so the PR stays up to date with main.
          git push -qf origin "HEAD:refs/heads/$BRANCH"
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create --base main --head "$BRANCH" --title "board: render BOARD.md from the work-item issues" \
              --body "Rendered by .github/workflows/board.yml; changes only BOARD.md. ci.yml is dispatched on this branch for the required checks."
          fi
          # Mark, 2026-10-10 (Decisions): bot PRs merge themselves once required checks pass.
          gh pr merge "$BRANCH" --auto --squash \
            || echo "::warning::auto-merge unavailable (repo setting 'Allow auto-merge'); merge the $BRANCH PR by hand"
          # PR events from GITHUB_TOKEN start no workflows, but workflow_dispatch does, and
          # its check runs land on the branch head, where required checks look for them.
          gh workflow run ci.yml --ref "$BRANCH"
