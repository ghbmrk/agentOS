name: intake
# BOARD-INTAKE-wf (#2668, fix 2 of #1780): a collaborator's work-item issue that cannot
# render on BOARD.md gets one comment naming every problem, edited in place on each event and
# deleted once the issue is well formed (tools/board.py intake runs render's own checks). Main's
# code runs with the issue-scoped token; the issue number is the only event value it reads, so
# no issue text reaches the shell. tests/test_workflows.py pins every line.
on:
  issues:
    types: [opened, edited, labeled, unlabeled]
permissions:
  contents: read
jobs:
  intake:
    # A work item, or one that just lost the label (its comment goes); an outsider's issue is
    # never a work item (board.COLLABORATORS).
    if: >-
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.issue.author_association)
      && (contains(github.event.issue.labels.*.name, 'work-item') || github.event.label.name == 'work-item')
    # CI-issue-runs-coalesce: one sweep at a time across all issues, so two quick edits cannot both
    # post a first comment, and a label burst keeps one running job and the newest pending one
    # (GitHub cancels the older pending). Each run sweeps every issue's final state (--sweep), so a
    # cancelled one loses nothing. Job-level, so a skipped run never enters the group.
    concurrency:
      group: intake
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write # the intake comments
      actions: read # the newest successful intake run, where the sweep's window starts
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - name: Comment on each work item while it cannot render (tools/board.py intake --sweep)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: python3 -I tools/board.py intake --repo "$GITHUB_REPOSITORY" --issue "$ISSUE" --sweep
