name: testkit-image
# Builds the S1/S2 test kit image (spikes/S1S2-testkit) and boots it once under Secure Boot in QEMU.
# Runs here because GitHub's runners can reach deb.debian.org; the cloud agent sessions cannot.
on:
  workflow_dispatch:
  # Block-style paths: premerge.py's pr_paths reads only this form, and reads any other as unfiltered (#5432 L3).
  pull_request:
    paths:
      - "spikes/S1S2-testkit/**"
      - "image/debian-archive-keyring.sh"
      - ".github/workflows/testkit.yml"
      - ".github/actions/disk-budget/**"
  push:
    branches: [main]
    paths:
      - "spikes/S1S2-testkit/**"
      - "image/debian-archive-keyring.sh"
      - ".github/workflows/testkit.yml"
      - ".github/actions/disk-budget/**"
permissions:
  contents: read
# CI-cancel-superseded (#5345, #5348, #5361): a PR's first-attempt run cancels that PR's older first
# attempts, so a superseded head never holds the queue. A first-attempt push to main cancels main's
# older one (CI-main-supersede, #6394), so main's tip always finishes. A rerun (attempt 2 or later) and
# every other run is a group of its own (run id), so it never cancels or replaces the current head's run.
concurrency:
  group: ${{ github.workflow }}-${{ startsWith(github.event_name, 'pull_request') && github.run_attempt == 1 && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'push' && github.ref == 'refs/heads/main' && github.run_attempt == 1 && 'head' || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ (startsWith(github.event_name, 'pull_request') || github.event_name == 'push' && github.ref == 'refs/heads/main') && github.run_attempt == 1 }}
env:
  # Every apt-get call passes $APT_OPTS, so a stalled mirror fails in minutes, not at the job
  # timeout (CI-apt-timeout, #6581; tests/test_workflows.py checks each call).
  APT_OPTS: "-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      DISK_NEED_GB: "6" # IMG-disk (#6357): measured bound 3.1 GB (2.5 sampled + 0.6 rise, AWS); see .github/actions/disk-budget
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - name: Install build and boot tools
        run: |
          sudo apt-get $APT_OPTS update -q
          sudo apt-get $APT_OPTS install -y -q --no-install-recommends debian-archive-keyring systemd-boot systemd-boot-efi \
            systemd-container erofs-utils dosfstools mtools e2fsprogs cpio zstd kmod bubblewrap \
            qemu-system-x86 ovmf swtpm swtpm-tools
          # Ubuntu 24.04 confines user namespaces via AppArmor, which breaks mkosi's bubblewrap sandbox.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo git clone -q https://github.com/systemd/mkosi /opt/mkosi
          sudo git -C /opt/mkosi -c advice.detachedHead=false checkout -q 26673f65e17ae099bb0cf65928fe70c93b8a6a37  # v24.3
      # IMG-disk (#6357): the runner disk budget, against this job's DISK_NEED_GB (.github/actions/disk-budget).
      - name: Disk budget
        uses: ./.github/actions/disk-budget
        with:
          phase: start
      - name: Build image
        run: sudo MKOSI=/opt/mkosi/bin/mkosi spikes/S1S2-testkit/build.sh "$RUNNER_TEMP/out"
      - name: Boot test (Secure Boot on, until the kit powers off)
        run: sudo spikes/S1S2-testkit/ci_boot.sh "$RUNNER_TEMP/out/agentos-tk_1.raw" "$RUNNER_TEMP/boot"
      - name: Keep the console log
        if: always()
        run: sudo cp "$RUNNER_TEMP/boot/console.log" "$RUNNER_TEMP/out/qemu-console.log" || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: agentos-testkit
          path: |
            ${{ runner.temp }}/out/agentos-tk_1.raw
            ${{ runner.temp }}/out/SHA256SUMS
            ${{ runner.temp }}/out/qemu-console.log
          retention-days: 7
          if-no-files-found: warn
      - name: Disk budget held
        if: always()
        uses: ./.github/actions/disk-budget
        with:
          phase: held
