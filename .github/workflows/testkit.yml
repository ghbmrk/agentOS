name: testkit-image
# Builds the S1/S2 test kit image (spikes/S1S2-testkit) and boots it once under Secure Boot in QEMU.
# Runs here because GitHub's runners can reach deb.debian.org; the cloud agent sessions cannot.
on:
  workflow_dispatch:
  # Block-style paths: premerge.py's pr_paths reads only this form, and reads any other as unfiltered (#5432 L3).
  pull_request:
    paths:
      - "spikes/S1S2-testkit/**"
      - ".github/workflows/testkit.yml"
  push:
    branches: [main]
    paths:
      - "spikes/S1S2-testkit/**"
      - ".github/workflows/testkit.yml"
permissions:
  contents: read
# CI-cancel-superseded (#5345, #5348, #5361): a PR's first-attempt run cancels that PR's older first
# attempts, so a superseded head never holds the queue. A rerun (attempt 2 or later) and every push,
# merge-queue, schedule or dispatch run is a group of its own (run id), so it never cancels or
# replaces the current head's run.
concurrency:
  group: ${{ github.workflow }}-${{ startsWith(github.event_name, 'pull_request') && github.run_attempt == 1 && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ startsWith(github.event_name, 'pull_request') && github.run_attempt == 1 }}
jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - name: Install build and boot tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends debian-archive-keyring systemd-boot systemd-boot-efi \
            systemd-container erofs-utils dosfstools mtools e2fsprogs cpio zstd kmod bubblewrap \
            qemu-system-x86 ovmf swtpm swtpm-tools
          # Ubuntu 24.04 confines user namespaces via AppArmor, which breaks mkosi's bubblewrap sandbox.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo git clone -q https://github.com/systemd/mkosi /opt/mkosi
          sudo git -C /opt/mkosi -c advice.detachedHead=false checkout -q 26673f65e17ae099bb0cf65928fe70c93b8a6a37  # v24.3
      - name: Build image
        run: sudo MKOSI=/opt/mkosi/bin/mkosi spikes/S1S2-testkit/build.sh "$RUNNER_TEMP/out"
      - name: Boot test (Secure Boot on, until the kit powers off)
        run: sudo spikes/S1S2-testkit/ci_boot.sh "$RUNNER_TEMP/out/agentos-tk_1.raw" "$RUNNER_TEMP/boot"
      - name: Keep the console log
        if: always()
        run: sudo cp "$RUNNER_TEMP/boot/console.log" "$RUNNER_TEMP/out/qemu-console.log" || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: agentos-testkit
          path: |
            ${{ runner.temp }}/out/agentos-tk_1.raw
            ${{ runner.temp }}/out/SHA256SUMS
            ${{ runner.temp }}/out/qemu-console.log
          retention-days: 7
          if-no-files-found: warn
