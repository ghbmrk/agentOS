name: scope
# CI-docs: is this change records-only? ci.yml and assurance.yml call this, and a job that
# needs it runs full unless `records` is exactly 'true', so a failure here means full CI.
# tools/ci_scope.py holds the one records path set. It runs as the BASE commit has it, so a
# PR cannot widen the set for itself; with no base copy (or no base) the answer is full.
# The changed paths are the same diff CI's other PR steps use: the PR branch against its
# merge base; for a push to main, the pushed range; for a dispatch (trace.yml, metrics.yml
# and board.yml dispatch ci.yml on their bot branches), the branch against main, so a
# dispatch on main itself is an empty change and runs full; for a merge-queue entry, the
# queue commit against the base it was built on (merge_group.base_sha, whose copy of
# tools/ci_scope.py decides). Other events (schedule) run full.
on:
  workflow_call:
    outputs:
      records:
        description: "'true' when the change touches only record documents"
        value: ${{ jobs.scope.outputs.records }}
permissions:
  contents: read
jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      records: ${{ steps.scope.outputs.records }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0 # base commits and origin/main
          persist-credentials: false
      - name: Records-only change? (tools/ci_scope.py, base copy)
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          QUEUE_BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          base=
          case "$EVENT" in
            # HEAD is the PR's test merge (base^1, branch^2), as in ci.yml's checks job.
            pull_request) base=HEAD^1 head=HEAD^2 ;;
            push) base=$BEFORE head=$GITHUB_SHA ;;
            workflow_dispatch) base=origin/main head=$GITHUB_SHA ;;
            merge_group) base=$QUEUE_BASE head=$GITHUB_SHA ;;
          esac
          scope=full
          if [ -n "$base" ] && git show "$base:tools/ci_scope.py" > "$RUNNER_TEMP/ci_scope.py" 2>/dev/null; then
            scope=$(python3 -I "$RUNNER_TEMP/ci_scope.py" --git "$base" "$head") || scope=full
          fi
          echo "### CI scope: $scope" >> "$GITHUB_STEP_SUMMARY"
          echo "CI scope: $scope"
          if [ "$scope" = records ]; then
            echo "records=true" >> "$GITHUB_OUTPUT"
          fi
