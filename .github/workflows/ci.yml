name: ci
on:
  push:
    branches: [main]
  pull_request:
  # The merge queue builds each queued PR on a gh-readonly-queue/ branch and waits for
  # these same checks; without this trigger a queued PR never gets them and stalls.
  # PR-only steps (BOARD, TRACE.md, risk tier) stay skipped: the PR run already did them.
  merge_group:
  # The bot workflows dispatch it on their bot branches when BOT_PR_TOKEN is unset: PRs
  # opened with GITHUB_TOKEN start no pull_request runs, and main requires these checks.
  workflow_dispatch:
permissions:
  contents: read
# A newer push to the same PR cancels the older run; pushes to main
# and scheduled runs always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# Builds never download a Go toolchain: setup-go installs the one go.mod's
# toolchain line names (setup-go's go-version-file reads only the go line),
# each job checks it, and an offline build fails rather than fetch one. GOWORK=off: a
# go.work in the repo cannot override broker/go.mod, go.sum or vendor/ (#4007 Security).
env:
  GOTOOLCHAIN: local
  GOWORK: "off"
# Every job has a 30-minute timeout: a whole run takes about 4 minutes, and a
# hung job would otherwise hold one of the few runners for GitHub's 6h default.
# A records-only change (CI-docs; the set is tools/ci_scope.py's) runs only the document
# checks: checks skips its Go, unit-test and network steps and runs the tests of the
# document tools instead, and each broker-race shard skips every step. The code is main's,
# which main's own run tested. No job waits for another to decide that (CI-par-4, #4336):
# the first step of checks and of each shard runs .github/actions/scope, and their later
# steps run unless it says exactly 'true', so a failed scope step means full CI. broker-checks,
# machines and hostcheck run in full on every change: their root steps may not carry an `if:`
# (tools/root_tests.py), and a whole job can only be skipped by waiting for another job.
# A push to main runs every job and every step whatever scope says (CI-mainguard, #2323):
# main's green run then means main builds, even after a records-only merge that follows a
# skewed code merge. Only pull requests, merge-queue builds and dispatches are scoped.
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: read # board.py check --repo reads the work-item issues
      pull-requests: read # and cross-checks them against PRs (D21)
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0 # base commit for the TRACE.md guard
          persist-credentials: false
      - uses: ./.github/actions/scope
        id: scope
        with:
          push: full # CI-mainguard
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      # The harness tests build the broker.
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        if: steps.scope.outputs.records != 'true'
        with:
          go-version: "1.26.10" # = broker/go.mod's toolchain line; checked below
          cache: false
      - name: Go is the toolchain go.mod names
        if: steps.scope.outputs.records != 'true'
        run: |
          want=$(awk '$1 == "toolchain" {print $2}' "$GITHUB_WORKSPACE/broker/go.mod")
          got=$(go version | awk '{print $3}')
          [ -n "$want" ] && [ "$got" = "$want" ] || { echo "Go is $got; broker/go.mod names $want" >&2; exit 1; }
      - name: Unit tests
        if: steps.scope.outputs.records != 'true'
        # The differential tests (systemd-analyze, systemd-tmpfiles, modprobe) fail rather than skip
        # without them (#1531), and fail on any skip among them (#1543).
        # Each module runs in its own process tree under strace, which logs every file opened in it
        # for tests/records_audit.py (CI-PATHS); tools/unit_tests.py runs one module per core at
        # once (CI-par). -buildvcs=false: go's VCS stamp reads the worktree.
        env:
          AGENTOS_REQUIRE_REFERENCE_TOOLS: "1"
          GOFLAGS: -buildvcs=false
        run: |
          # erofs-utils: the /usr list tests build erofs images (#4470).
          pkgs=$(for t in strace:strace mkfs.erofs:erofs-utils; do command -v "${t%%:*}" >/dev/null || echo "${t#*:}"; done)
          [ -z "$pkgs" ] || { sudo apt-get update -q && sudo apt-get install -y -q $pkgs; }
          python tools/unit_tests.py "$RUNNER_TEMP/reads"
      - name: The records-only step runs every test that reads a record (CI-PATHS)
        if: steps.scope.outputs.records != 'true'
        run: python tests/records_audit.py "$RUNNER_TEMP/reads"
      - name: Document tool tests (records-only change; CI-docs)
        # The tests of the tools the steps below run, and every test that reads a record file;
        # full CI's record-read audit fails when a test that reads one is missing here.
        if: steps.scope.outputs.records == 'true'
        run: python -m unittest tests.test_ci_scope tests.test_board tests.test_doclint tests.test_trace tests.test_metrics tests.test_risk_tier tests.test_product_name tests.test_specslice tests.test_stalequeued tests.test_clk7_consent tests.test_krn2_trusted_base tests.test_workflows -v
      - name: Inbound rules on a stand-in home network (DEV-net-e 2a)
        if: steps.scope.outputs.records != 'true'
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q nftables iproute2
          sudo AGENTOS_REQUIRE_IPV6=1 python3 -m unittest tests.test_inbound_netns -v
      - name: Codex worker tool sandbox on a stub worker (S8-W1, CRED-5)
        if: steps.scope.outputs.records != 'true'
        run: |
          sudo apt-get install -y -q bubblewrap
          sudo AGENTOS_REQUIRE_BWRAP=1 python3 -m unittest tests.test_codex_worker -v
      - name: Codex worker rootfs from the pinned CLI (S8-W1, #807)
        if: steps.scope.outputs.records != 'true'
        # Downloads the pinned @openai/codex tarball, checks npm's integrity hash, builds the
        # rootfs and checks its contents, with codex doctor in a namespace (sudo: the runner may bar
        # unprivileged user namespaces). Nothing runs under runsc here (#809 measures that). The
        # build compiles the patched bwrap statically, so it needs libcap-dev (#1720).
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q libcap-dev
          sudo AGENTOS_CODEX_DOWNLOAD=1 python3 -m unittest tests.test_codex_rootfs -v
      - name: Traceability (markers cite known IDs; checked on a regenerated TRACE.md)
        run: python tools/trace.py && python tools/trace.py --check
      - name: Old core only shrinks (D-139 ratchet; markers, lines and imports against the base)
        if: github.event_name == 'pull_request'
        # HEAD^1 is the base side of the PR's test merge.
        run: python tools/trace.py --ratchet HEAD^1
      - name: Operating documents agree (BOARD states, README table, OPERATING refs, brief size)
        run: python tools/doclint.py
      - name: Brief acceptance baseline only shrinks (FIRST-PASS)
        if: github.event_name == 'pull_request'
        # HEAD^1 is the base side of the PR's test merge.
        run: |
          git show HEAD^1:tools/brief_acceptance_baseline.txt > "$RUNNER_TEMP/base-baseline.txt" 2>/dev/null || : > "$RUNNER_TEMP/base-baseline.txt"
          python tools/doclint.py --base-baseline "$RUNNER_TEMP/base-baseline.txt"
      - name: Every broker dialer is hooked into the home-network address guard (DEV-2)
        if: steps.scope.outputs.records != 'true'
        run: python tools/netguardcheck.py
      - name: Every file a build could compile under broker/ is plain Go (REV-CHK-src, KRN-2)
        if: steps.scope.outputs.records != 'true'
        run: python tools/srclint.py
      - name: BOARD.md round-trips through its work-item issues (SIM-repo-1)
        run: python tools/board.py check
      - name: BOARD.md rows equal the live work-item issues (SIM-repo-2)
        # Once BOARD.md carries board.GENERATED, its rows come only from issues: a PR that
        # changes BOARD.md must match the board rendered from the live issues. Other PRs skip it,
        # so an issue change between board.yml runs turns no unrelated PR red. Before the
        # migration this is the same round trip as the step above. Generated-ness comes from the
        # base (the PR's, or main for bot/board), so deleting the line cannot switch the check off.
        # board.yml's bot/board branch from this repository skips only the live comparison
        # (BOARD-bot-race, #3745): it was rendered from the live issues minutes earlier, so an
        # issue edit since then is a race, not a hand edit. The GENERATED guard still runs.
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/bot/board'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            if git diff --quiet HEAD^1...HEAD^2 -- BOARD.md; then
              echo "BOARD.md unchanged by this PR"; exit 0
            fi
            git show HEAD^1:BOARD.md > "$RUNNER_TEMP/base-BOARD.md"
          else
            git show origin/main:BOARD.md > "$RUNNER_TEMP/base-BOARD.md"
          fi
          if [ "$GITHUB_REF" = refs/heads/bot/board ] \
            || { [ "$HEAD_REF" = bot/board ] && [ "$HEAD_REPO" = "$GITHUB_REPOSITORY" ]; }; then
            python tools/board.py check --base "$RUNNER_TEMP/base-BOARD.md"
          else
            python tools/board.py check --repo "$GITHUB_REPOSITORY" --base "$RUNNER_TEMP/base-BOARD.md"
          fi
      - name: Archived status files stay frozen (SIM-repo-2b, D23)
        # Once the base BOARD.md is generated, no PR edits docs/BOARD-HISTORY.md or
        # docs/LATER-HISTORY.md, or brings back LATER.md or docs/MARK-QUEUE.md.
        if: github.event_name == 'pull_request'
        run: |
          git show HEAD^1:BOARD.md > "$RUNNER_TEMP/base-BOARD.md"
          python tools/board.py archive --base "$RUNNER_TEMP/base-BOARD.md" \
            --changed $(git diff --no-renames --name-only HEAD^1 HEAD)
      - name: PR leaves TRACE.md to trace.yml
        if: github.event_name == 'pull_request'
        # HEAD is the PR's test merge (base^1, branch^2). Three dots compare the branch with
        # its merge base, so TRACE.md updates it pulled in from main don't count.
        # The one exception is trace.yml's own PR: head branch bot/trace in this repository
        # (not a fork) that changes nothing but TRACE.md (D-123). Human PRs still fail.
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          git diff --quiet HEAD^1...HEAD^2 -- TRACE.md && exit 0
          if [ "$HEAD_REF" = bot/trace ] && [ "$HEAD_REPO" = "$GITHUB_REPOSITORY" ] \
            && [ "$(git diff --name-only HEAD^1...HEAD^2)" = TRACE.md ]; then
            echo "bot/trace PR changes only TRACE.md: allowed"; exit 0
          fi
          echo '::error file=TRACE.md::PRs must not change TRACE.md; trace.yml regenerates it on main daily. Restore it with: git checkout $(git merge-base origin/main HEAD) -- TRACE.md'
          exit 1
      - name: Risk tier (docs/OPERATING.md §3)
        # Advisory summary only. The lane limit (docs/LANES.md) is enforced in lane-gate.yml,
        # which runs the base copy on pull_request_target so a PR cannot edit it away.
        if: github.event_name == 'pull_request'
        run: python tools/risk_tier.py --markdown --git HEAD^1 HEAD^2 >> "$GITHUB_STEP_SUMMARY"
  broker:
    # The required check (CI-SHARD, #1868): passes only when every race shard and the checks
    # job passed. On a records-only change it passes with them (CI-par-4).
    needs: [broker-race, broker-checks]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every race shard and the broker checks passed
        env:
          RACE: ${{ needs.broker-race.result }}
          CHECKS: ${{ needs.broker-checks.result }}
        run: |
          echo "broker-race: $RACE; broker-checks: $CHECKS"
          [ "$RACE" = success ] && [ "$CHECKS" = success ]
  broker-race:
    # The broker's race tests, split by package across the shards (tools/ci_split.py). Each
    # shard first checks the split covers `go list ./...` with no gap and no duplicate.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2] # = range of ci_split.py's --shards below
    defaults:
      run:
        working-directory: broker
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0 # base commits, merge base and origin/main for the scope step
          persist-credentials: false
      - uses: ./.github/actions/scope
        id: scope
        with:
          push: full # CI-mainguard
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        if: steps.scope.outputs.records != 'true'
        with:
          go-version: "1.26.10" # = broker/go.mod's toolchain line; checked below
          cache: false
      - name: Go is the toolchain go.mod names
        if: steps.scope.outputs.records != 'true'
        run: |
          want=$(awk '$1 == "toolchain" {print $2}' "$GITHUB_WORKSPACE/broker/go.mod")
          got=$(go version | awk '{print $3}')
          [ -n "$want" ] && [ "$got" = "$want" ] || { echo "Go is $got; broker/go.mod names $want" >&2; exit 1; }
      - name: Go build cache (CI-PATHS)
        if: steps.scope.outputs.records != 'true'
        # One cache per shard; until a shard's own exists, the pre-split broker cache seeds it.
        # Restore only here: the save step at the end of the job runs on a push to main alone (D29).
        uses: actions/cache/restore@d4323d4df104b026a6aa633fdb11d772146be0bf  # v4.2.2
        with:
          path: ~/.cache/go-build
          key: go-build-broker-race-${{ matrix.shard }}-${{ runner.os }}-${{ hashFiles('broker/go.mod', 'broker/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-build-broker-race-${{ matrix.shard }}-${{ runner.os }}-${{ hashFiles('broker/go.mod', 'broker/go.sum') }}-
            go-build-broker-${{ runner.os }}-${{ hashFiles('broker/go.mod', 'broker/go.sum') }}-
      - name: Software TPM for the trusted-host slot (P2-4b)
        if: steps.scope.outputs.records != 'true'
        run: sudo apt-get update -q && sudo apt-get install -yq swtpm
      # The enforcer's resolver tests run the real dnsmasq (briefs/ENF.md slice f);
      # dnsmasq-base is the binary alone, with no service started.
      - name: dnsmasq for the enforcer's resolver tests (ENF-f, #3664)
        if: steps.scope.outputs.records != 'true'
        run: sudo apt-get install -yq dnsmasq-base
      # loops' canary-round test runs tools/canary.py, whose targets run as the
      # runner's first subordinate id in a user namespace (tools/ASSUMPTIONS.md D13).
      - name: Subordinate ids for the canary sandbox
        if: steps.scope.outputs.records != 'true'
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          command -v newuidmap && command -v newgidmap || sudo apt-get install -yq uidmap
          grep -qE "^($(id -un)|$(id -u)):" /etc/subuid || sudo usermod --add-subuids 100000-165535 "$(id -un)"
          grep -qE "^($(id -un)|$(id -u)):" /etc/subgid || sudo usermod --add-subgids 100000-165535 "$(id -un)"
      - name: This shard's packages (CI-SHARD)
        if: steps.scope.outputs.records != 'true'
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          go list ./... > "$RUNNER_TEMP/packages"
          python3 -I ../tools/ci_split.py check --shards 3 < "$RUNNER_TEMP/packages"
          python3 -I ../tools/ci_split.py shard --shards 3 --index "$SHARD" < "$RUNNER_TEMP/packages" > "$RUNNER_TEMP/shard"
          cat "$RUNNER_TEMP/shard"
      - name: Tests (race detector)
        if: steps.scope.outputs.records != 'true'
        # The TPM tests fail rather than skip if swtpm is missing. kernel/sim takes minutes
        # under -race, so go test's default 10-minute timeout flaked a slow runner (#2623);
        # the job's own timeout-minutes still bounds the step.
        env:
          AGENTOS_REQUIRE_SWTPM: "1"
        run: go test -race -count=1 -timeout 25m $(cat "$RUNNER_TEMP/shard")
      - name: The vision service's ONNX Runtime build, its real-runtime tests compiled (VIS-models, #3515)
        if: steps.scope.outputs.records != 'true'
        # Default builds link no runtime; -tags vision_onnx links ONNX Runtime's Go binding,
        # which loads the pinned library only at run time. The real tests need the pinned
        # library, detector and scene set, so vision-real.yml runs them; here they compile,
        # and the tagged build's own tests run without the library.
        env:
          CGO_ENABLED: "1"
        run: |
          go vet -tags vision_onnx,vision_real ./cmd/agentos-vision
          go test -count=1 -tags vision_onnx ./cmd/agentos-vision
      - name: Drop the fuzz corpus before the cache save (main only; CI-PATHS)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: rm -rf "$(go env GOCACHE)/fuzz"
      - name: Go build cache upload (main only; CI-PATHS)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@d4323d4df104b026a6aa633fdb11d772146be0bf  # v4.2.2
        with:
          path: ~/.cache/go-build
          key: go-build-broker-race-${{ matrix.shard }}-${{ runner.os }}-${{ hashFiles('broker/go.mod', 'broker/go.sum') }}-${{ github.sha }}
  broker-checks:
    # Format, vet, the OP-2 model at its full bounds and the decoder fuzz rounds, beside the
    # race shards.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: broker
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version: "1.26.10" # = broker/go.mod's toolchain line; checked below
          cache: false
      - name: Go is the toolchain go.mod names
        run: |
          want=$(awk '$1 == "toolchain" {print $2}' "$GITHUB_WORKSPACE/broker/go.mod")
          got=$(go version | awk '{print $3}')
          [ -n "$want" ] && [ "$got" = "$want" ] || { echo "Go is $got; broker/go.mod names $want" >&2; exit 1; }
      - name: Go build cache (CI-PATHS)
        # Keyed on the vendored module set; a restore-key hit from main seeds a PR run. Restore
        # only here: the save step at the end of the job runs on a push to main alone (D29).
        # Vendored modules need no module cache.
        uses: actions/cache/restore@d4323d4df104b026a6aa633fdb11d772146be0bf  # v4.2.2
        with:
          path: ~/.cache/go-build
          key: go-build-broker-${{ runner.os }}-${{ hashFiles('broker/go.mod', 'broker/go.sum') }}-${{ github.sha }}
          restore-keys: go-build-broker-${{ runner.os }}-${{ hashFiles('broker/go.mod', 'broker/go.sum') }}-
      - name: Format
        # Vendored third-party code keeps its upstream formatting.
        run: f=$(find . -name '*.go' -not -path './vendor/*' -print0 | xargs -0 gofmt -l); test -z "$f" || { echo "$f"; exit 1; }
      - name: Vet
        run: go vet ./...
      - name: The llama.cpp adapter, its real-runtime test compiled, and its fake-server tests (INFER-llama)
        # Default builds link no runtime; the tagged build links the adapter. The real tests need the
        # pinned llama-server and models, so infer-real.yml runs them; here they only compile.
        run: |
          go vet -tags infer_real,infer_llamacpp ./cmd/agentos-infer
          go test -count=1 -tags infer_llamacpp ./cmd/agentos-infer
      - name: Vendored code equals the modules go.sum pins (KRN-2cap-harden, #2945)
        # `go mod vendor` rewrites vendor/ from the checksum-verified modules (and the local
        # replace directories), so an edited, added or deleted vendored file shows as a change.
        run: |
          go mod vendor
          s=$(git status --porcelain --untracked-files=all -- vendor)
          test -z "$s" || { echo "$s"; echo "broker/vendor differs from go mod vendor" >&2; exit 1; }
      - name: OP-2 same-effect model at its full bounds, without -race (journal A19)
        # The search is sequential, so the race detector finds nothing in it and
        # the race step skips it; here it runs at the bounds A19 states. -parallel 2 holds the
        # five configurations to two searches at once: four (GOMAXPROCS) exhausted runner memory
        # and the step was killed with exit 143.
        run: go test -count=1 -timeout 20m -parallel 2 -run '^TestOP2(SameEffectModel|Model.*)$' -v ./journal
      - name: Fuzz the broker decoders and policy targets, 20s per target (LOOP-7, P3-4b-3, FUZZ-broker-ci)
        # Each target already ran its seeds and planted-decoder control in the race shards;
        # this fuzzes past the seeds. The long runs are in soak.yml. tools/fuzzrun.py
        # runs each target for the time budget as count-bound chunks sized from the
        # exec/s it measures (logged per chunk below). It never passes a duration to
        # -fuzztime: a time-bounded run can fail at its deadline with a bare "context
        # deadline exceeded" and no input (P1-4-flake), and a count has no deadline. A
        # chunk that hangs is killed at a cap proportional to its expected time.
        # Each entry is pkg:Target[:calibrate]; tests/test_ci_scope.py checks each names a Fuzz
        # func in that package. FuzzSlots writes sealed files per input (~100 execs/s), so its
        # first chunk is 2000 execs: fuzzrun's default 20000 overran the chunk's cap.
        run: |
          for t in sockets:FuzzRequest sockets:FuzzFrames browser:FuzzParse modemlink:FuzzInbound guest:FuzzMCP grants:FuzzApprovals localsrv:FuzzSessions netguard:FuzzSourcesRead netguard:FuzzGatewayPolicy netguard:FuzzCheck vault:FuzzSlots:2000 clerk/seal:FuzzParse vision:FuzzVisionReply; do
            IFS=: read -r pkg target cal <<< "$t"
            python3 ../tools/fuzzrun.py --pkg "./$pkg" --target "$target" ${cal:+--calibrate "$cal"} --budget 20s || exit 1
          done
      - name: Camera H.264 decoder on the pinned libavcodec, with FuzzH264Feed for 20s (CAM-clerk b2, #3514)
        # go test ./... has no libavcodec, so the decoder's tests run here, against the same pinned
        # H.264-only build image/camdecode.sh links into agentos-camdecode.
        run: |
          sh ../image/libavcodec.sh "$RUNNER_TEMP/libavcodec"
          export CGO_ENABLED=1 GOFLAGS=-tags=libavcodec PKG_CONFIG_SYSROOT_DIR="$RUNNER_TEMP/libavcodec" \
            PKG_CONFIG_PATH="$RUNNER_TEMP/libavcodec/opt/agentos-libavcodec/lib/pkgconfig"
          status=0
          go test -count=1 -json ./cmd/agentos-camdecode/camdecode > "$RUNNER_TEMP/camdecode.json" || status=$?
          p=github.com/ghbmrk/agentos/broker/cmd/agentos-camdecode/camdecode
          python3 -I "$GITHUB_WORKSPACE/tools/require_ran.py" $p.TestRunVideo $p.TestRunVideoRefuses $p.TestRunVideoCropped \
            $p.FuzzH264Feed < "$RUNNER_TEMP/camdecode.json" || exit 1
          [ "$status" -eq 0 ]
          python3 ../tools/fuzzrun.py --pkg ./cmd/agentos-camdecode/camdecode --target FuzzH264Feed --budget 20s
      - name: Drop the fuzz corpus before the cache save (main only; CI-PATHS)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: rm -rf "$(go env GOCACHE)/fuzz"
      - name: Go build cache upload (main only; CI-PATHS)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@d4323d4df104b026a6aa633fdb11d772146be0bf  # v4.2.2
        with:
          path: ~/.cache/go-build
          key: go-build-broker-${{ runner.os }}-${{ hashFiles('broker/go.mod', 'broker/go.sum') }}-${{ github.sha }}

  machines:
    # Agent-machine lifecycle against the real kernel (P1-4): cgroup v2,
    # overlayfs, and gVisor. Needs root, so it runs the root-only tests too.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version: "1.26.10" # = broker/go.mod's toolchain line; checked below
          cache: false
      - name: Go is the toolchain go.mod names
        run: |
          want=$(awk '$1 == "toolchain" {print $2}' "$GITHUB_WORKSPACE/broker/go.mod")
          got=$(go version | awk '{print $3}')
          [ -n "$want" ] && [ "$got" = "$want" ] || { echo "Go is $got; broker/go.mod names $want" >&2; exit 1; }
      - name: Go build cache (CI-PATHS)
        # The root test runs below use GOCACHE=/tmp/gocache. Restore only; saved on main (D29).
        uses: actions/cache/restore@d4323d4df104b026a6aa633fdb11d772146be0bf  # v4.2.2
        with:
          path: /tmp/gocache
          key: go-build-machines-${{ runner.os }}-${{ hashFiles('broker/go.mod', 'broker/go.sum') }}-${{ github.sha }}
          restore-keys: go-build-machines-${{ runner.os }}-${{ hashFiles('broker/go.mod', 'broker/go.sum') }}-
      - name: Install gVisor release-20260928.0 (checksum pinned)
        run: |
          B=https://storage.googleapis.com/gvisor/releases/release/20260928.0/x86_64
          curl -fsSLo /tmp/gvisor.tar.bz2 "$B/gvisor.tar.bz2"
          echo "c8d3a9fd4d4c4f5b8ff213caa4517356be128d18659ec4cde37828fe797f61a9725a602a846c81a8ed19c057a996515d31c081eba343ed4613a89951ba32ed59  /tmp/gvisor.tar.bz2" | sha512sum -c
          mkdir /tmp/gv && tar -xjf /tmp/gvisor.tar.bz2 -C /tmp/gv
          sudo install -m 0755 /tmp/gv/runsc /usr/local/bin/runsc
          sudo mkdir -p /usr/local/bin/gvisor-bin
          sudo install -m 0755 /tmp/gv/gvisor-bin/* /usr/local/bin/gvisor-bin/
          runsc --version
      - name: Project quotas (SR2-3)
        # ext4 project quotas need the quota_v2 format module, which the
        # runner's kernel keeps in linux-modules-extra; XFS has its own.
        # The quota tests run on each that mounts and fail if neither does.
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq xfsprogs acl
          sudo modprobe quota_v2 2>/dev/null || {
            sudo apt-get install -yq "linux-modules-extra-$(uname -r)" && sudo modprobe quota_v2
          } || echo "::warning::no quota_v2 module: ext4 quota tests skip; XFS covers them"
      - name: Machine tests as root
        working-directory: broker
        run: |
          sudo mkdir /sys/fs/cgroup/agentos-ci
          # With no_new_privs, as agentosd.service runs runsc (NoNewPrivileges=yes; L7-6). The
          # step fails unless every root-gated test of these packages passed with no skip in it or its
          # subtests (#3541); other tests may skip by design (a quota file system the host lacks).
          rc=0
          sudo setpriv --no-new-privs env "PATH=$PATH" GOTOOLCHAIN=local GOWORK=off HOME=/root GOCACHE=/tmp/gocache \
            AGENTOS_RUNSC=/usr/local/bin/runsc AGENTOS_CGROUP_PARENT=/sys/fs/cgroup/agentos-ci \
            AGENTOS_REQUIRE_QUOTA=1 \
            go test -count=1 -json ./cgroup ./quota/... ./vm/... ./recovery > /tmp/machine-test.json || rc=$?
          python3 -I ../tools/require_ran.py --named-skips-only --gated ./cgroup ./quota/... ./vm/... ./recovery \
            < /tmp/machine-test.json || exit 1
          [ "$rc" -eq 0 ]
          # The inference and vision services' jail, leaf and OOM (INFER-SVC INF-1,
          # INF-6; VIS-svc RES-2), with no_new_privs as agentosd.service runs them.
          # Their tests skip off root or without the cgroup, so the step fails on
          # any skip and unless the leaf and OOM tests passed (INFER-CI-2).
          rc=0
          sudo setpriv --no-new-privs env "PATH=$PATH" GOTOOLCHAIN=local GOWORK=off HOME=/root GOCACHE=/tmp/gocache \
            AGENTOS_CGROUP_PARENT=/sys/fs/cgroup/agentos-ci \
            go test -count=1 -json ./infer/... ./vision/... > /tmp/infer-test.json || rc=$?
          python3 -I ../tools/require_ran.py --gated ./infer/... ./vision/... < /tmp/infer-test.json \
            github.com/ghbmrk/agentos/broker/infer/supervise.TestServiceRunsInInferenceLeaf \
            github.com/ghbmrk/agentos/broker/infer/supervise.TestServiceOOMStaysInLeaf \
            github.com/ghbmrk/agentos/broker/vision/supervise.TestVisionRunsInInferenceLeaf \
            github.com/ghbmrk/agentos/broker/vision/supervise.TestVisionOOMStaysInLeaf || exit 1
          [ "$rc" -eq 0 ]
          # Per-machine disk quotas on a prjquota file system (RES-4, SR2-3).
          sudo env "PATH=$PATH" GOTOOLCHAIN=local GOWORK=off HOME=/root GOCACHE=/tmp/gocache AGENTOS_REQUIRE_QUOTA=1 \
            go test -count=1 -v -run '^(TestMachinesGetTheStateFileSystemsQuota|TestMachineDiskWithQuotasAddsNoLine)$' ./cmd/agentosd
      - name: Camera decoder sessions in their own unit (CAM-decoder-uid)
        # The image's agentos-camdecode.socket and agentos-camdecode@.service as shipped, with the main side's
        # mask, under this runner's systemd, with only the service's ExecStart= replaced (the session's start,
        # as a test) and its output sent to the journal. The step connects twice at once as the clerk's user:
        # each session is a user of its own, neither root, the clerk's nor the other's, and runs a sandbox
        # under runsc rootless beside its leaf of its unit's group (CAM-host-11). Another user is refused the
        # socket. Debian lets an unprivileged user make a user namespace; Ubuntu's AppArmor does not, so the
        # step lifts that as the box has it. It runs before the root-gated tests: their radio probe's
        # unconfined control stops PID 1 (ptrace attach).
        working-directory: broker
        run: |
          set -eu
          # Put back for the later steps, however this one ends.
          was=$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)
          trap 'sudo sysctl -qw kernel.apparmor_restrict_unprivileged_userns=$was' EXIT
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          L=/usr/local/lib/agentos-ci-camera
          S=../image/mkosi/mkosi.extra/usr/lib/systemd/system
          U=$S/agentos-camdecode@.service
          G="sudo env PATH=$PATH GOTOOLCHAIN=local GOWORK=off HOME=/root GOCACHE=/tmp/gocache"
          sudo mkdir -p $L/root/proc $L/root/dev $L/root/sys
          $G CGO_ENABLED=0 go build -o $L/root/oneshot ./vm/gvisor/testdata/oneshot
          $G go test -c -o $L/camdecode.test ./cmd/agentos-camdecode-host
          # The clerk's user cannot read the runner's checkout.
          sudo install -m 0644 ../tools/camdecode_sessions.py $L/
          sudo chmod -R a+rX $L
          sudo useradd --system --no-create-home --shell /usr/sbin/nologin agentos-camera
          # The clerk's directories as the image makes them, and every path the main side's mask names.
          sudo install -d -m 0700 -o agentos-camera -g agentos-camera /var/lib/agentos-camera
          sudo install -d -m 0755 -o agentos-camera -g agentos-camera /run/agentos-camera
          M=$S/agentos-.service.d/50-main-side.conf
          for p in $(sed -n 's/^InaccessiblePaths=//p' $M); do sudo mkdir -p "$p"; done
          sudo install -m 0644 $U $S/agentos-camdecode.socket /etc/systemd/system/
          sudo install -D -m 0644 $M /etc/systemd/system/agentos-.service.d/50-main-side.conf
          rr=$(grep -o -- '-runsc-root /[^ ]*' $U | cut -d' ' -f2)
          printf '%s\n' '[Service]' 'ExecStart=' "ExecStart=$L/camdecode.test -test.run=TestDecoderStartsInItsUnit -test.v -test.count=1" \
            'StandardOutput=journal' \
            "Environment=AGENTOS_RUNSC=/usr/local/bin/runsc AGENTOS_RUNSC_ROOT=$rr AGENTOS_DECODE_ROOT=$L/root AGENTOS_CLERK_USER=agentos-camera" \
            | sudo install -D -m 0644 /dev/stdin /etc/systemd/system/agentos-camdecode@.service.d/99-ci.conf
          systemctl --version | head -1
          sudo systemctl daemon-reload || { sudo journalctl -b --no-pager -n 150 -o short-precise; exit 1; }
          sudo systemctl start agentos-camdecode.socket
          rc=0
          sudo setpriv --reuid=agentos-camera --regid=agentos-camera --clear-groups python3 -I $L/camdecode_sessions.py \
            /run/agentos-camdecode/conn.sock "$(id -u agentos-camera)" > /tmp/camdecode-sessions.log 2>&1 || rc=$?
          cat /tmp/camdecode-sessions.log
          # Another user is refused the socket (an "if", since set -e ignores a "!" command).
          if sudo setpriv --reuid=nobody --regid=nogroup --clear-groups python3 -I -c \
            'import socket; socket.socket(socket.AF_UNIX).connect("/run/agentos-camdecode/conn.sock")' 2>/dev/null; then
            echo "FAIL: nobody opened a decoder session"; exit 1
          fi
          sudo journalctl -u 'agentos-camdecode@*' -o cat --no-pager > /tmp/camdecode-unit.log || true
          tail -n 80 /tmp/camdecode-unit.log
          [ "$rc" -eq 0 ]
          [ "$(grep -c -- '^--- PASS: TestDecoderStartsInItsUnit' /tmp/camdecode-unit.log)" -eq 2 ]
          ! grep -q -- '--- SKIP\|--- FAIL' /tmp/camdecode-unit.log
      - name: agentosd calls the kernel as the owner side (#2682)
        # As agentosd.service runs: root with no_new_privs. Each call takes the owner side's uid on
        # one thread and gives it back; the tests skip off root, so the step fails unless they ran.
        working-directory: broker
        run: |
          rc=0
          sudo setpriv --no-new-privs env "PATH=$PATH" GOTOOLCHAIN=local GOWORK=off HOME=/root GOCACHE=/tmp/gocache \
            go test -count=1 -json -run '^(TestSpeaksTheKernelsWire|TestOnlyTheKernelsUIDIsCalled|TestNoThreadKeepsTheOwnerSidesUID)$' \
            ./owner/kernelsock > /tmp/kernelsock-test.json || rc=$?
          python3 -I ../tools/require_ran.py < /tmp/kernelsock-test.json \
            github.com/ghbmrk/agentos/broker/owner/kernelsock.TestSpeaksTheKernelsWire \
            github.com/ghbmrk/agentos/broker/owner/kernelsock.TestOnlyTheKernelsUIDIsCalled \
            github.com/ghbmrk/agentos/broker/owner/kernelsock.TestNoThreadKeepsTheOwnerSidesUID || exit 1
          [ "$rc" -eq 0 ]
      - name: the mail clerk's process under its own uid (MAIL-main-a)
        # Root runs the built main as nobody with distinct peers: the owner side is served, every other
        # peer refused, and the process is non-dumpable. The test skips off root, so the step fails unless it ran.
        working-directory: broker
        run: |
          rc=0
          sudo env "PATH=$PATH" GOTOOLCHAIN=local GOWORK=off HOME=/root GOCACHE=/tmp/gocache \
            go test -count=1 -json -run '^TestRealMailClerkAsRoot$' ./cmd/agentos-clerk-mail > /tmp/clerk-mail-test.json || rc=$?
          python3 -I ../tools/require_ran.py < /tmp/clerk-mail-test.json \
            github.com/ghbmrk/agentos/broker/cmd/agentos-clerk-mail.TestRealMailClerkAsRoot || exit 1
          [ "$rc" -eq 0 ]
      - name: OpenThread build cache (ENF-t)
        id: otcache
        uses: actions/cache/restore@d4323d4df104b026a6aa633fdb11d772146be0bf  # v4.2.2
        with:
          path: /tmp/ot-bin
          key: ot-bin-${{ runner.os }}-${{ hashFiles('tools/build-openthread.sh', 'broker/enforcer/radio/thread/openthread.pin') }}
      - name: Build OpenThread from its pin (ENF-t)
        if: steps.otcache.outputs.cache-hit != 'true'
        run: sh tools/build-openthread.sh /tmp/ot-bin --sim
      - name: OpenThread build cache upload (ENF-t)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.otcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@d4323d4df104b026a6aa633fdb11d772146be0bf  # v4.2.2
        with:
          path: /tmp/ot-bin
          key: ot-bin-${{ runner.os }}-${{ hashFiles('tools/build-openthread.sh', 'broker/enforcer/radio/thread/openthread.pin') }}
      - name: The enforcer's Thread stack, confined (ENF-t, #3702)
        # ot-daemon from the pin runs in the Thread profile's user namespace, created by root, on a
        # simulated radio; a simulated node's SRP service must resolve from the Matter profile over
        # mDNS on infra0. As root with no_new_privs, as the enforcer runs; the step fails on a skip.
        working-directory: broker
        run: |
          rc=0
          sudo setpriv --no-new-privs env "PATH=$PATH" GOTOOLCHAIN=local GOWORK=off HOME=/root GOCACHE=/tmp/gocache \
            AGENTOS_OT_BIN=/tmp/ot-bin \
            go test -count=1 -json -run '^(TestSrpReachesController|TestStacksConfined)$' ./enforcer/radio > /tmp/thread-test.json || rc=$?
          python3 -I ../tools/require_ran.py < /tmp/thread-test.json \
            github.com/ghbmrk/agentos/broker/enforcer/radio.TestSrpReachesController \
            github.com/ghbmrk/agentos/broker/enforcer/radio.TestStacksConfined || exit 1
          [ "$rc" -eq 0 ]
      - name: Root-gated Go tests no other step runs (CI-root-go, #3539)
        # A test that skips off root is green in every other job (#3536: a renamed wire tag passed
        # CI). root_tests.py fails unless each root-gated test runs in a root step whose require_ran.py
        # names it, and --plan lists those no step above names; each package runs as root with
        # no_new_privs, as agentosd.service runs (NoNewPrivileges=yes; L7-6, #3542), and fails
        # on any skip or unrun test.
        working-directory: broker
        run: |
          python3 -I ../tools/root_tests.py
          command -v swtpm >/dev/null || sudo apt-get install -yq swtpm
          python3 -I ../tools/root_tests.py --plan > "$RUNNER_TEMP/root-plan"
          fail=0
          while read -r pkg pat names <&3; do
            rc=0
            sudo setpriv --no-new-privs env "PATH=$PATH" GOTOOLCHAIN=local GOWORK=off HOME=/root GOCACHE=/tmp/gocache \
              AGENTOS_REQUIRE_SWTPM=1 \
              go test -count=1 -json -run "$pat" "$pkg" > "$RUNNER_TEMP/root-test.json" || rc=$?
            # shellcheck disable=SC2086 # names is a space-separated list of test names
            python3 -I ../tools/require_ran.py $names < "$RUNNER_TEMP/root-test.json" || fail=1
            [ "$rc" -eq 0 ] || fail=1
          done 3< "$RUNNER_TEMP/root-plan"
          [ "$fail" -eq 0 ]
      - name: OpenClaw guest under gVisor (P1-7)
        # Real OpenClaw, pinned by version and hash, as an agent machine with
        # only its broker socket; a scripted model stands in for a provider.
        run: |
          sh guest/openclaw/build-rootfs.sh /tmp/ocroot
          # With no_new_privs, as agentosd.service runs runsc (L7-6).
          cd broker
          rc=0
          sudo setpriv --no-new-privs env "PATH=$PATH" GOTOOLCHAIN=local GOWORK=off HOME=/root GOCACHE=/tmp/gocache \
            AGENTOS_RUNSC=/usr/local/bin/runsc AGENTOS_OPENCLAW_ROOTFS=/tmp/ocroot \
            go test -count=1 -json -run '^TestIntegrationOpenClawGuest$' ./e2e > /tmp/openclaw-test.json || rc=$?
          python3 -I ../tools/require_ran.py < /tmp/openclaw-test.json \
            github.com/ghbmrk/agentos/broker/e2e.TestIntegrationOpenClawGuest || exit 1
          [ "$rc" -eq 0 ]
      - name: Codex CLI containment under gVisor (S8-W1-contain, #1720)
        # The pinned CLI runs one tool call in a pw- machine from the built image, holding only a
        # synthetic placeholder login; the tool must not reach the forwarder, the route socket or
        # CODEX_HOME's auth.json, and must run under the CLI's bwrap and seccomp (CRED-5, C5).
        # Built as root, as the rootfs test builds it: inside the CLI's user namespace root keeps no override
        # on a workspace owned by an unmapped uid, and bwrap cannot create the .git mount point.
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q libcap-dev
          sudo env "PATH=$PATH" GOTOOLCHAIN=local GOWORK=off HOME=/root GOCACHE=/tmp/gocache \
            sh guest/codex/build-rootfs.sh /tmp/cxroot
          cd broker
          rc=0
          sudo env "PATH=$PATH" GOTOOLCHAIN=local GOWORK=off HOME=/root GOCACHE=/tmp/gocache \
            AGENTOS_RUNSC=/usr/local/bin/runsc AGENTOS_CODEX_ROOTFS=/tmp/cxroot \
            go test -count=1 -json -run '^TestIntegrationCodexContainment$' ./e2e > /tmp/codex-test.json || rc=$?
          python3 -I ../tools/require_ran.py < /tmp/codex-test.json \
            github.com/ghbmrk/agentos/broker/e2e.TestIntegrationCodexContainment || exit 1
          [ "$rc" -eq 0 ]
      - name: Floor box admission and preemption (P2-5)
        # A 7680 MiB group stands in for the 8 GB N95 (HW-4); prints FLOOR-RESULT.
        working-directory: broker
        run: |
          rc=0
          sudo env "PATH=$PATH" GOTOOLCHAIN=local GOWORK=off HOME=/root GOCACHE=/tmp/gocache \
            AGENTOS_RUNSC=/usr/local/bin/runsc AGENTOS_CGROUP_PARENT=/sys/fs/cgroup/agentos-ci \
            go test -count=1 -json -timeout 20m ./floor > /tmp/floor-test.json || rc=$?
          python3 -I ../tools/require_ran.py --gated ./floor < /tmp/floor-test.json || exit 1
          [ "$rc" -eq 0 ]
      - name: Drop the fuzz corpus before the cache save (main only; CI-PATHS)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: sudo rm -rf /tmp/gocache/fuzz
      - name: Go build cache upload (main only; CI-PATHS)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@d4323d4df104b026a6aa633fdb11d772146be0bf  # v4.2.2
        with:
          path: /tmp/gocache
          key: go-build-machines-${{ runner.os }}-${{ hashFiles('broker/go.mod', 'broker/go.sum') }}-${{ github.sha }}

  hostcheck:
    # The host-untouched check (HOST-1e; A1, HW-8) on a QEMU/OVMF/swtpm host
    # with a Windows-like second disk, booting the stand-in guest until P2-1's
    # image boots here. Each QEMU process also has the harness's own timeout.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: QEMU, OVMF, swtpm, tpm2-tools, virt-firmware (all from Ubuntu's archive)
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq qemu-system-x86 qemu-utils ovmf swtpm swtpm-tools tpm2-tools \
            busybox-static ntfs-3g dosfstools cpio fdisk python3-virt-firmware
      - name: KVM for the runner user, if the runner has it
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
            sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          fi
      - name: Stand-in guest kernel (Ubuntu's virtual kernel)
        run: |
          pkg=$(apt-cache depends linux-image-virtual | awk '/Depends: linux-image-[0-9]/{print $2; exit}')
          cd "$RUNNER_TEMP" && apt-get download "$pkg" && dpkg-deb -x "$pkg"_*.deb k
          echo "HOSTCHECK_KERNEL=$(ls "$RUNNER_TEMP"/k/boot/vmlinuz-*)" >> "$GITHUB_ENV"
      - name: Host-untouched check, clean and with planted writes
        env:
          HOSTCHECK_QEMU: "1"
        run: python -m unittest tests.test_hostcheck -v
