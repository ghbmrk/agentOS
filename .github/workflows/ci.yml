name: ci
on:
  push:
    branches: [main]
  pull_request:
  # The merge queue builds each queued PR on a gh-readonly-queue/ branch and waits for
  # these same checks; without this trigger a queued PR never gets them and stalls.
  # PR-only steps (BOARD, TRACE.md, risk tier) stay skipped: the PR run already did them.
  merge_group:
  # The bot workflows dispatch it on their bot branches when BOT_PR_TOKEN is unset: PRs
  # opened with GITHUB_TOKEN start no pull_request runs, and main requires these checks.
  workflow_dispatch:
permissions:
  contents: read
# A newer push to the same PR cancels the older run; pushes to main
# and scheduled runs always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# Builds never download a Go toolchain: setup-go installs the one go.mod's
# toolchain line names (setup-go's go-version-file reads only the go line),
# each job checks it, and an offline build fails rather than fetch one.
env:
  GOTOOLCHAIN: local
# Every job has a 30-minute timeout: a whole run takes about 4 minutes, and a
# hung job would otherwise hold one of the few runners for GitHub's 6h default.
# A records-only change (CI-docs; the set is tools/ci_scope.py's) runs only the document
# checks: checks skips its Go, unit-test and network steps and runs the tests of the
# document tools instead; broker, machines and hostcheck are skipped, which main's
# ruleset counts as passing. The code is main's, which main's own run tested.
# checks always runs (!cancelled()), and the other jobs run unless scope says exactly
# 'true', so a failed scope job means full CI, never a skipped required check.
# A push to main runs every job and every step whatever scope says (CI-mainguard, #2323):
# main's green run then means main builds, even after a records-only merge that follows a
# skewed code merge. Only pull requests, merge-queue builds and dispatches are scoped.
jobs:
  scope:
    uses: ./.github/workflows/scope.yml
  checks:
    needs: scope
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RECORDS: ${{ github.event_name != 'push' && needs.scope.outputs.records || 'false' }}
    permissions:
      contents: read
      issues: read # board.py check --repo reads the work-item issues
      pull-requests: read # and cross-checks them against PRs (D21)
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0 # base commit for the TRACE.md guard
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      # The harness tests build the broker.
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        if: env.RECORDS != 'true'
        with:
          go-version: "1.26.10" # = broker/go.mod's toolchain line; checked below
          cache: false
      - name: Go is the toolchain go.mod names
        if: env.RECORDS != 'true'
        run: |
          want=$(awk '$1 == "toolchain" {print $2}' "$GITHUB_WORKSPACE/broker/go.mod")
          got=$(go version | awk '{print $3}')
          [ -n "$want" ] && [ "$got" = "$want" ] || { echo "Go is $got; broker/go.mod names $want" >&2; exit 1; }
      - name: Unit tests
        if: env.RECORDS != 'true'
        # The differential tests (systemd-analyze, systemd-tmpfiles, modprobe) fail rather than skip
        # without them (#1531), and fail on any skip among them (#1543).
        # Each module runs in its own process tree under strace, which logs every file opened in it
        # for tests/records_audit.py (CI-PATHS). -buildvcs=false: go's VCS stamp reads the worktree.
        env:
          AGENTOS_REQUIRE_REFERENCE_TOOLS: "1"
          GOFLAGS: -buildvcs=false
        run: |
          command -v strace >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q strace; }
          mkdir -p "$RUNNER_TEMP/reads"; rc=0
          for f in tests/test*.py; do
            m=$(basename "$f" .py)
            strace -f --seccomp-bpf -q -y -e trace=open,openat,openat2 -e signal=none -o "$RUNNER_TEMP/reads/$m.trace" \
              python -m unittest discover -s tests -p "$m.py" -v || rc=1
          done
          exit $rc
      - name: The records-only step runs every test that reads a record (CI-PATHS)
        if: env.RECORDS != 'true'
        run: python tests/records_audit.py "$RUNNER_TEMP/reads"
      - name: Document tool tests (records-only change; CI-docs)
        # The tests of the tools the steps below run, and every test that reads a record file;
        # full CI's record-read audit fails when a test that reads one is missing here.
        if: env.RECORDS == 'true'
        run: python -m unittest tests.test_ci_scope tests.test_board tests.test_doclint tests.test_trace tests.test_metrics tests.test_risk_tier tests.test_product_name tests.test_specslice tests.test_stalequeued tests.test_g1_scope.CheckTest tests.test_g1_scope.ListTest tests.test_clk7_consent tests.test_krn2_trusted_base tests.test_workflows -v
      - name: Inbound rules on a stand-in home network (DEV-net-e 2a)
        if: env.RECORDS != 'true'
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q nftables iproute2
          sudo AGENTOS_REQUIRE_IPV6=1 python3 -m unittest tests.test_inbound_netns -v
      - name: Codex worker tool sandbox on a stub worker (S8-W1, CRED-5)
        if: env.RECORDS != 'true'
        run: |
          sudo apt-get install -y -q bubblewrap
          sudo AGENTOS_REQUIRE_BWRAP=1 python3 -m unittest tests.test_codex_worker -v
      - name: Codex worker rootfs from the pinned CLI (S8-W1, #807)
        if: env.RECORDS != 'true'
        # Downloads the pinned @openai/codex tarball, checks npm's integrity hash, builds the
        # rootfs and checks its contents, with codex doctor in a namespace (sudo: the runner may bar
        # unprivileged user namespaces). Nothing runs under runsc here (#809 measures that). The
        # build compiles the patched bwrap statically, so it needs libcap-dev (#1720).
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q libcap-dev
          sudo AGENTOS_CODEX_DOWNLOAD=1 python3 -m unittest tests.test_codex_rootfs -v
      - name: Traceability (markers cite known IDs; checked on a regenerated TRACE.md)
        run: python tools/trace.py && python tools/trace.py --check
      - name: Old core only shrinks (D-139 ratchet; markers, lines and imports against the base)
        if: github.event_name == 'pull_request'
        # HEAD^1 is the base side of the PR's test merge.
        run: python tools/trace.py --ratchet HEAD^1
      - name: Operating documents agree (BOARD states, README table, OPERATING refs, brief size)
        run: python tools/doclint.py
      - name: Brief acceptance baseline only shrinks (FIRST-PASS)
        if: github.event_name == 'pull_request'
        # HEAD^1 is the base side of the PR's test merge.
        run: |
          git show HEAD^1:tools/brief_acceptance_baseline.txt > "$RUNNER_TEMP/base-baseline.txt" 2>/dev/null || : > "$RUNNER_TEMP/base-baseline.txt"
          python tools/doclint.py --base-baseline "$RUNNER_TEMP/base-baseline.txt"
      - name: Every broker dialer is hooked into the home-network address guard (DEV-2)
        if: env.RECORDS != 'true'
        run: python tools/netguardcheck.py
      - name: BOARD.md round-trips through its work-item issues (SIM-repo-1)
        run: python tools/board.py check
      - name: BOARD.md rows equal the live work-item issues (SIM-repo-2)
        # Once BOARD.md carries board.GENERATED, its rows come only from issues: a PR that
        # changes BOARD.md, and board.yml's bot/board branch, must match the board rendered from
        # the live issues. Other PRs skip it, so an issue change between board.yml runs turns no
        # unrelated PR red. Before the migration this is the same round trip as the step above.
        # Generated-ness comes from the base (the PR's, or main for bot/board), so deleting the
        # line cannot switch the check off.
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/bot/board'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            if git diff --quiet HEAD^1...HEAD^2 -- BOARD.md; then
              echo "BOARD.md unchanged by this PR"; exit 0
            fi
            git show HEAD^1:BOARD.md > "$RUNNER_TEMP/base-BOARD.md"
          else
            git show origin/main:BOARD.md > "$RUNNER_TEMP/base-BOARD.md"
          fi
          python tools/board.py check --repo "$GITHUB_REPOSITORY" --base "$RUNNER_TEMP/base-BOARD.md"
      - name: Archived status files stay frozen (SIM-repo-2b, D23)
        # Once the base BOARD.md is generated, no PR edits docs/BOARD-HISTORY.md or
        # docs/LATER-HISTORY.md, or brings back LATER.md or docs/MARK-QUEUE.md.
        if: github.event_name == 'pull_request'
        run: |
          git show HEAD^1:BOARD.md > "$RUNNER_TEMP/base-BOARD.md"
          python tools/board.py archive --base "$RUNNER_TEMP/base-BOARD.md" \
            --changed $(git diff --no-renames --name-only HEAD^1 HEAD)
      - name: PR leaves TRACE.md to trace.yml
        if: github.event_name == 'pull_request'
        # HEAD is the PR's test merge (base^1, branch^2). Three dots compare the branch with
        # its merge base, so TRACE.md updates it pulled in from main don't count.
        # The one exception is trace.yml's own PR: head branch bot/trace in this repository
        # (not a fork) that changes nothing but TRACE.md (D-123). Human PRs still fail.
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          git diff --quiet HEAD^1...HEAD^2 -- TRACE.md && exit 0
          if [ "$HEAD_REF" = bot/trace ] && [ "$HEAD_REPO" = "$GITHUB_REPOSITORY" ] \
            && [ "$(git diff --name-only HEAD^1...HEAD^2)" = TRACE.md ]; then
            echo "bot/trace PR changes only TRACE.md: allowed"; exit 0
          fi
          echo '::error file=TRACE.md::PRs must not change TRACE.md; trace.yml regenerates it on main daily. Restore it with: git checkout $(git merge-base origin/main HEAD) -- TRACE.md'
          exit 1
      - name: Risk tier (docs/OPERATING.md §3)
        # Advisory summary only. The lane limit (docs/LANES.md) is enforced in lane-gate.yml,
        # which runs the base copy on pull_request_target so a PR cannot edit it away.
        if: github.event_name == 'pull_request'
        run: python tools/risk_tier.py --markdown --git HEAD^1 HEAD^2 >> "$GITHUB_STEP_SUMMARY"
  broker:
    # The required check (CI-SHARD, #1868): passes only when every race shard and the checks
    # job passed. Skipped with them on a records-only change, as before the split.
    needs: [scope, broker-race, broker-checks]
    if: ${{ !cancelled() && (github.event_name == 'push' || needs.scope.outputs.records != 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every race shard and the broker checks passed
        env:
          RACE: ${{ needs.broker-race.result }}
          CHECKS: ${{ needs.broker-checks.result }}
        run: |
          echo "broker-race: $RACE; broker-checks: $CHECKS"
          [ "$RACE" = success ] && [ "$CHECKS" = success ]
  broker-race:
    needs: scope
    if: ${{ !cancelled() && (github.event_name == 'push' || needs.scope.outputs.records != 'true') }}
    # The broker's race tests, split by package across the shards (tools/ci_split.py). Each
    # shard first checks the split covers `go list ./...` with no gap and no duplicate.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2] # = range of ci_split.py's --shards below
    defaults:
      run:
        working-directory: broker
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version: "1.26.10" # = broker/go.mod's toolchain line; checked below
          cache: false
      - name: Go is the toolchain go.mod names
        run: |
          want=$(awk '$1 == "toolchain" {print $2}' "$GITHUB_WORKSPACE/broker/go.mod")
          got=$(go version | awk '{print $3}')
          [ -n "$want" ] && [ "$got" = "$want" ] || { echo "Go is $got; broker/go.mod names $want" >&2; exit 1; }
      - name: Go build cache (CI-PATHS)
        # One cache per shard; until a shard's own exists, the pre-split broker cache seeds it.
        # Restore only here: the save step at the end of the job runs on a push to main alone (D29).
        uses: actions/cache/restore@d4323d4df104b026a6aa633fdb11d772146be0bf  # v4.2.2
        with:
          path: ~/.cache/go-build
          key: go-build-broker-race-${{ matrix.shard }}-${{ runner.os }}-${{ hashFiles('broker/go.mod', 'broker/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-build-broker-race-${{ matrix.shard }}-${{ runner.os }}-${{ hashFiles('broker/go.mod', 'broker/go.sum') }}-
            go-build-broker-${{ runner.os }}-${{ hashFiles('broker/go.mod', 'broker/go.sum') }}-
      - name: Software TPM for the trusted-host slot (P2-4b)
        run: sudo apt-get update -q && sudo apt-get install -yq swtpm
      # loops' canary-round test runs tools/canary.py, whose targets run as the
      # runner's first subordinate id in a user namespace (tools/ASSUMPTIONS.md D13).
      - name: Subordinate ids for the canary sandbox
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          command -v newuidmap && command -v newgidmap || sudo apt-get install -yq uidmap
          grep -qE "^($(id -un)|$(id -u)):" /etc/subuid || sudo usermod --add-subuids 100000-165535 "$(id -un)"
          grep -qE "^($(id -un)|$(id -u)):" /etc/subgid || sudo usermod --add-subgids 100000-165535 "$(id -un)"
      - name: This shard's packages (CI-SHARD)
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          go list ./... > "$RUNNER_TEMP/packages"
          python3 -I ../tools/ci_split.py check --shards 3 < "$RUNNER_TEMP/packages"
          python3 -I ../tools/ci_split.py shard --shards 3 --index "$SHARD" < "$RUNNER_TEMP/packages" > "$RUNNER_TEMP/shard"
          cat "$RUNNER_TEMP/shard"
      - name: Tests (race detector)
        # The TPM tests fail rather than skip if swtpm is missing. kernel/sim takes minutes
        # under -race, so go test's default 10-minute timeout flaked a slow runner (#2623);
        # the job's own timeout-minutes still bounds the step.
        env:
          AGENTOS_REQUIRE_SWTPM: "1"
        run: go test -race -count=1 -timeout 25m $(cat "$RUNNER_TEMP/shard")
      - name: Drop the fuzz corpus before the cache save (main only; CI-PATHS)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: rm -rf "$(go env GOCACHE)/fuzz"
      - name: Go build cache upload (main only; CI-PATHS)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@d4323d4df104b026a6aa633fdb11d772146be0bf  # v4.2.2
        with:
          path: ~/.cache/go-build
          key: go-build-broker-race-${{ matrix.shard }}-${{ runner.os }}-${{ hashFiles('broker/go.mod', 'broker/go.sum') }}-${{ github.sha }}
  broker-checks:
    needs: scope
    if: ${{ !cancelled() && (github.event_name == 'push' || needs.scope.outputs.records != 'true') }}
    # Format, vet, the OP-2 model at its full bounds and the decoder fuzz rounds, beside the
    # race shards.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: broker
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version: "1.26.10" # = broker/go.mod's toolchain line; checked below
          cache: false
      - name: Go is the toolchain go.mod names
        run: |
          want=$(awk '$1 == "toolchain" {print $2}' "$GITHUB_WORKSPACE/broker/go.mod")
          got=$(go version | awk '{print $3}')
          [ -n "$want" ] && [ "$got" = "$want" ] || { echo "Go is $got; broker/go.mod names $want" >&2; exit 1; }
      - name: Go build cache (CI-PATHS)
        # Keyed on the vendored module set; a restore-key hit from main seeds a PR run. Restore
        # only here: the save step at the end of the job runs on a push to main alone (D29).
        # Vendored modules need no module cache.
        uses: actions/cache/restore@d4323d4df104b026a6aa633fdb11d772146be0bf  # v4.2.2
        with:
          path: ~/.cache/go-build
          key: go-build-broker-${{ runner.os }}-${{ hashFiles('broker/go.mod', 'broker/go.sum') }}-${{ github.sha }}
          restore-keys: go-build-broker-${{ runner.os }}-${{ hashFiles('broker/go.mod', 'broker/go.sum') }}-
      - name: Format
        # Vendored third-party code keeps its upstream formatting.
        run: f=$(find . -name '*.go' -not -path './vendor/*' -print0 | xargs -0 gofmt -l); test -z "$f" || { echo "$f"; exit 1; }
      - name: Vet
        run: go vet ./...
      - name: OP-2 same-effect model at its full bounds, without -race (journal A19)
        # The search is sequential, so the race detector finds nothing in it and
        # the race step skips it; here it runs at the bounds A19 states. -parallel 2 holds the
        # five configurations to two searches at once: four (GOMAXPROCS) exhausted runner memory
        # and the step was killed with exit 143.
        run: go test -count=1 -timeout 20m -parallel 2 -run '^TestOP2(SameEffectModel|Model.*)$' -v ./journal
      - name: Fuzz the broker decoders and policy targets, 20s per target (LOOP-7, P3-4b-3, FUZZ-broker-ci)
        # Each target already ran its seeds and planted-decoder control in the race shards;
        # this fuzzes past the seeds. The long runs are in soak.yml. tools/fuzzrun.py
        # runs each target for the time budget as count-bound chunks sized from the
        # exec/s it measures (logged per chunk below). It never passes a duration to
        # -fuzztime: a time-bounded run can fail at its deadline with a bare "context
        # deadline exceeded" and no input (P1-4-flake), and a count has no deadline. A
        # chunk that hangs is killed at a cap proportional to its expected time.
        # Each entry is pkg:Target[:calibrate]; tests/test_ci_scope.py checks each names a Fuzz
        # func in that package. FuzzSlots writes sealed files per input (~100 execs/s), so its
        # first chunk is 2000 execs: fuzzrun's default 20000 overran the chunk's cap.
        run: |
          for t in sockets:FuzzRequest sockets:FuzzFrames browser:FuzzParse modemlink:FuzzInbound guest:FuzzMCP grants:FuzzApprovals localsrv:FuzzSessions netguard:FuzzSourcesRead netguard:FuzzGatewayPolicy netguard:FuzzCheck vault:FuzzSlots:2000 clerk/seal:FuzzParse; do
            IFS=: read -r pkg target cal <<< "$t"
            python3 ../tools/fuzzrun.py --pkg "./$pkg" --target "$target" ${cal:+--calibrate "$cal"} --budget 20s || exit 1
          done
      - name: Drop the fuzz corpus before the cache save (main only; CI-PATHS)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: rm -rf "$(go env GOCACHE)/fuzz"
      - name: Go build cache upload (main only; CI-PATHS)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@d4323d4df104b026a6aa633fdb11d772146be0bf  # v4.2.2
        with:
          path: ~/.cache/go-build
          key: go-build-broker-${{ runner.os }}-${{ hashFiles('broker/go.mod', 'broker/go.sum') }}-${{ github.sha }}

  machines:
    needs: scope
    if: ${{ !cancelled() && (github.event_name == 'push' || needs.scope.outputs.records != 'true') }}
    # Agent-machine lifecycle against the real kernel (P1-4): cgroup v2,
    # overlayfs, and gVisor. Needs root, so it runs the root-only tests too.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version: "1.26.10" # = broker/go.mod's toolchain line; checked below
          cache: false
      - name: Go is the toolchain go.mod names
        run: |
          want=$(awk '$1 == "toolchain" {print $2}' "$GITHUB_WORKSPACE/broker/go.mod")
          got=$(go version | awk '{print $3}')
          [ -n "$want" ] && [ "$got" = "$want" ] || { echo "Go is $got; broker/go.mod names $want" >&2; exit 1; }
      - name: Go build cache (CI-PATHS)
        # The root test runs below use GOCACHE=/tmp/gocache. Restore only; saved on main (D29).
        uses: actions/cache/restore@d4323d4df104b026a6aa633fdb11d772146be0bf  # v4.2.2
        with:
          path: /tmp/gocache
          key: go-build-machines-${{ runner.os }}-${{ hashFiles('broker/go.mod', 'broker/go.sum') }}-${{ github.sha }}
          restore-keys: go-build-machines-${{ runner.os }}-${{ hashFiles('broker/go.mod', 'broker/go.sum') }}-
      - name: Install gVisor release-20260928.0 (checksum pinned)
        run: |
          B=https://storage.googleapis.com/gvisor/releases/release/20260928.0/x86_64
          curl -fsSLo /tmp/gvisor.tar.bz2 "$B/gvisor.tar.bz2"
          echo "c8d3a9fd4d4c4f5b8ff213caa4517356be128d18659ec4cde37828fe797f61a9725a602a846c81a8ed19c057a996515d31c081eba343ed4613a89951ba32ed59  /tmp/gvisor.tar.bz2" | sha512sum -c
          mkdir /tmp/gv && tar -xjf /tmp/gvisor.tar.bz2 -C /tmp/gv
          sudo install -m 0755 /tmp/gv/runsc /usr/local/bin/runsc
          sudo mkdir -p /usr/local/bin/gvisor-bin
          sudo install -m 0755 /tmp/gv/gvisor-bin/* /usr/local/bin/gvisor-bin/
          runsc --version
      - name: Project quotas (SR2-3)
        # ext4 project quotas need the quota_v2 format module, which the
        # runner's kernel keeps in linux-modules-extra; XFS has its own.
        # The quota tests run on each that mounts and fail if neither does.
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq xfsprogs acl
          sudo modprobe quota_v2 2>/dev/null || {
            sudo apt-get install -yq "linux-modules-extra-$(uname -r)" && sudo modprobe quota_v2
          } || echo "::warning::no quota_v2 module: ext4 quota tests skip; XFS covers them"
      - name: Machine tests as root
        working-directory: broker
        run: |
          sudo mkdir /sys/fs/cgroup/agentos-ci
          # With no_new_privs, as agentosd.service runs runsc (NoNewPrivileges=yes; L7-6).
          sudo setpriv --no-new-privs env "PATH=$PATH" GOTOOLCHAIN=local HOME=/root GOCACHE=/tmp/gocache \
            AGENTOS_RUNSC=/usr/local/bin/runsc AGENTOS_CGROUP_PARENT=/sys/fs/cgroup/agentos-ci \
            AGENTOS_REQUIRE_QUOTA=1 \
            go test -count=1 -v ./cgroup ./quota/... ./vm/... ./recovery ./cleanroom
          # The inference service's jail, leaf and OOM (INFER-SVC INF-1, INF-6),
          # with no_new_privs as agentosd.service runs it. Its tests skip off
          # root or without the cgroup, so the step fails on any skip and
          # unless the leaf and OOM tests passed (INFER-CI-2).
          rc=0
          sudo setpriv --no-new-privs env "PATH=$PATH" GOTOOLCHAIN=local HOME=/root GOCACHE=/tmp/gocache \
            AGENTOS_CGROUP_PARENT=/sys/fs/cgroup/agentos-ci \
            go test -count=1 -json ./infer/... > /tmp/infer-test.json || rc=$?
          python3 -I ../tools/require_ran.py < /tmp/infer-test.json \
            github.com/ghbmrk/agentos/broker/infer/supervise.TestServiceRunsInInferenceLeaf \
            github.com/ghbmrk/agentos/broker/infer/supervise.TestServiceOOMStaysInLeaf || exit 1
          [ "$rc" -eq 0 ]
          # Per-machine disk quotas on a prjquota file system (RES-4, SR2-3).
          sudo env "PATH=$PATH" GOTOOLCHAIN=local HOME=/root GOCACHE=/tmp/gocache AGENTOS_REQUIRE_QUOTA=1 \
            go test -count=1 -v -run '^(TestMachinesGetTheStateFileSystemsQuota|TestMachineDiskWithQuotasAddsNoLine)$' ./cmd/agentosd
      - name: hostapd runs as its own user (#1426)
        # As agentos-ap.service runs: root with its bounding set (no CAP_CHOWN, no
        # CAP_DAC_OVERRIDE), no_new_privs, and hostapd's group as a supplementary
        # group. The stub hostapd must report uid 61426 with NET_ADMIN and NET_RAW only.
        working-directory: broker
        run: |
          go test -c -o /tmp/localui.test ./localui
          sudo setpriv --no-new-privs --groups 61426 --inh-caps=-all \
            --bounding-set=-all,+net_admin,+net_raw,+net_bind_service,+setuid,+setgid,+kill,+dac_read_search,+setpcap \
            env AGENTOS_REQUIRE_APUSER=1 /tmp/localui.test -test.count=1 -test.v \
            -test.run '^TestHostapdChildRunsAsItsOwnUser$'
      - name: OpenClaw guest under gVisor (P1-7)
        # Real OpenClaw, pinned by version and hash, as an agent machine with
        # only its broker socket; a scripted model stands in for a provider.
        run: |
          sh guest/openclaw/build-rootfs.sh /tmp/ocroot
          # With no_new_privs, as agentosd.service runs runsc (L7-6).
          cd broker && sudo setpriv --no-new-privs env "PATH=$PATH" GOTOOLCHAIN=local HOME=/root GOCACHE=/tmp/gocache \
            AGENTOS_RUNSC=/usr/local/bin/runsc AGENTOS_OPENCLAW_ROOTFS=/tmp/ocroot \
            go test -count=1 -v -run '^TestIntegrationOpenClawGuest$' ./e2e
      - name: Codex CLI containment under gVisor (S8-W1-contain, #1720)
        # The pinned CLI runs one tool call in a pw- machine from the built image, holding only a
        # synthetic placeholder login; the tool must not reach the forwarder, the route socket or
        # CODEX_HOME's auth.json, and must run under the CLI's bwrap and seccomp (CRED-5, C5).
        # Built as root, as the rootfs test builds it: inside the CLI's user namespace root keeps no override
        # on a workspace owned by an unmapped uid, and bwrap cannot create the .git mount point.
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q libcap-dev
          sudo env "PATH=$PATH" GOTOOLCHAIN=local HOME=/root GOCACHE=/tmp/gocache \
            sh guest/codex/build-rootfs.sh /tmp/cxroot
          cd broker && sudo env "PATH=$PATH" GOTOOLCHAIN=local HOME=/root GOCACHE=/tmp/gocache \
            AGENTOS_RUNSC=/usr/local/bin/runsc AGENTOS_CODEX_ROOTFS=/tmp/cxroot \
            go test -count=1 -v -run '^TestIntegrationCodexContainment$' ./e2e
      - name: Floor box admission and preemption (P2-5)
        # A 7680 MiB group stands in for the 8 GB N95 (HW-4); prints FLOOR-RESULT.
        working-directory: broker
        run: |
          sudo env "PATH=$PATH" GOTOOLCHAIN=local HOME=/root GOCACHE=/tmp/gocache \
            AGENTOS_RUNSC=/usr/local/bin/runsc AGENTOS_CGROUP_PARENT=/sys/fs/cgroup/agentos-ci \
            go test -count=1 -v -timeout 20m ./floor
      - name: Drop the fuzz corpus before the cache save (main only; CI-PATHS)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: sudo rm -rf /tmp/gocache/fuzz
      - name: Go build cache upload (main only; CI-PATHS)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@d4323d4df104b026a6aa633fdb11d772146be0bf  # v4.2.2
        with:
          path: /tmp/gocache
          key: go-build-machines-${{ runner.os }}-${{ hashFiles('broker/go.mod', 'broker/go.sum') }}-${{ github.sha }}

  hostcheck:
    needs: scope
    if: ${{ !cancelled() && (github.event_name == 'push' || needs.scope.outputs.records != 'true') }}
    # The host-untouched check (HOST-1e; A1, HW-8) on a QEMU/OVMF/swtpm host
    # with a Windows-like second disk, booting the stand-in guest until P2-1's
    # image boots here. Each QEMU process also has the harness's own timeout.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: QEMU, OVMF, swtpm, tpm2-tools, virt-firmware (all from Ubuntu's archive)
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq qemu-system-x86 qemu-utils ovmf swtpm swtpm-tools tpm2-tools \
            busybox-static ntfs-3g dosfstools cpio fdisk python3-virt-firmware
      - name: KVM for the runner user, if the runner has it
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
            sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          fi
      - name: Stand-in guest kernel (Ubuntu's virtual kernel)
        run: |
          pkg=$(apt-cache depends linux-image-virtual | awk '/Depends: linux-image-[0-9]/{print $2; exit}')
          cd "$RUNNER_TEMP" && apt-get download "$pkg" && dpkg-deb -x "$pkg"_*.deb k
          echo "HOSTCHECK_KERNEL=$(ls "$RUNNER_TEMP"/k/boot/vmlinuz-*)" >> "$GITHUB_ENV"
      - name: Host-untouched check, clean and with planted writes
        env:
          HOSTCHECK_QEMU: "1"
        run: python -m unittest tests.test_hostcheck -v
