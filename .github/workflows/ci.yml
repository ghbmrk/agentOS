name: ci
on:
  push:
    branches: [main]
  pull_request:
  # trace.yml and metrics.yml dispatch it on their bot branches: PRs opened with
  # GITHUB_TOKEN start no pull_request runs, and main requires these checks.
  workflow_dispatch:
permissions:
  contents: read
# A newer push to the same PR cancels the older run; pushes to main
# and scheduled runs always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# Builds never download a Go toolchain: setup-go installs the one go.mod's
# toolchain line names (setup-go's go-version-file reads only the go line),
# each job checks it, and an offline build fails rather than fetch one.
env:
  GOTOOLCHAIN: local
# Every job has a 30-minute timeout: a whole run takes about 4 minutes, and a
# hung job would otherwise hold one of the few runners for GitHub's 6h default.
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: read # board.py check --repo reads the work-item issues
      pull-requests: read # and cross-checks them against PRs (D21)
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0 # base commit for the TRACE.md guard
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      # The harness tests build the broker.
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version: "1.26.8" # = broker/go.mod's toolchain line; checked below
          cache: false
      - name: Go is the toolchain go.mod names
        run: |
          want=$(awk '$1 == "toolchain" {print $2}' "$GITHUB_WORKSPACE/broker/go.mod")
          got=$(go version | awk '{print $3}')
          [ -n "$want" ] && [ "$got" = "$want" ] || { echo "Go is $got; broker/go.mod names $want" >&2; exit 1; }
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Traceability (markers cite known IDs; checked on a regenerated TRACE.md)
        run: python tools/trace.py && python tools/trace.py --check
      - name: Operating documents agree (BOARD states, README table, OPERATING refs, brief size)
        run: python tools/doclint.py
      - name: BOARD.md round-trips through its work-item issues (SIM-repo-1)
        run: python tools/board.py check
      - name: BOARD.md rows equal the live work-item issues (SIM-repo-2)
        # Once BOARD.md carries board.GENERATED, its rows come only from issues: a PR that
        # changes BOARD.md, and board.yml's bot/board branch, must match the board rendered from
        # the live issues. Other PRs skip it, so an issue change between board.yml runs turns no
        # unrelated PR red. Before the migration this is the same round trip as the step above.
        # Generated-ness comes from the base (the PR's, or main for bot/board), so deleting the
        # line cannot switch the check off.
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/bot/board'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            if git diff --quiet HEAD^1...HEAD^2 -- BOARD.md; then
              echo "BOARD.md unchanged by this PR"; exit 0
            fi
            git show HEAD^1:BOARD.md > "$RUNNER_TEMP/base-BOARD.md"
          else
            git show origin/main:BOARD.md > "$RUNNER_TEMP/base-BOARD.md"
          fi
          python tools/board.py check --repo "$GITHUB_REPOSITORY" --base "$RUNNER_TEMP/base-BOARD.md"
      - name: PR leaves TRACE.md to trace.yml
        if: github.event_name == 'pull_request'
        # HEAD is the PR's test merge (base^1, branch^2). Three dots compare the branch with
        # its merge base, so TRACE.md updates it pulled in from main don't count.
        run: |
          git diff --quiet HEAD^1...HEAD^2 -- TRACE.md && exit 0
          echo '::error file=TRACE.md::PRs must not change TRACE.md; trace.yml regenerates it on main after merge. Restore it with: git checkout $(git merge-base origin/main HEAD) -- TRACE.md'
          exit 1
      - name: Risk tier (docs/OPERATING.md §3)
        if: github.event_name == 'pull_request'
        run: python tools/risk_tier.py --markdown --git HEAD^1 HEAD^2 >> "$GITHUB_STEP_SUMMARY"
  broker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: broker
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version: "1.26.8" # = broker/go.mod's toolchain line; checked below
          cache: false
      - name: Go is the toolchain go.mod names
        run: |
          want=$(awk '$1 == "toolchain" {print $2}' "$GITHUB_WORKSPACE/broker/go.mod")
          got=$(go version | awk '{print $3}')
          [ -n "$want" ] && [ "$got" = "$want" ] || { echo "Go is $got; broker/go.mod names $want" >&2; exit 1; }
      - name: Software TPM for the trusted-host slot (P2-4b)
        run: sudo apt-get update -q && sudo apt-get install -yq swtpm
      # loops' canary-round test runs tools/canary.py, whose targets run as the
      # runner's first subordinate id in a user namespace (tools/ASSUMPTIONS.md D13).
      - name: Subordinate ids for the canary sandbox
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          command -v newuidmap && command -v newgidmap || sudo apt-get install -yq uidmap
          grep -qE "^($(id -un)|$(id -u)):" /etc/subuid || sudo usermod --add-subuids 100000-165535 "$(id -un)"
          grep -qE "^($(id -un)|$(id -u)):" /etc/subgid || sudo usermod --add-subgids 100000-165535 "$(id -un)"
      - name: Format
        # Vendored third-party code keeps its upstream formatting.
        run: f=$(find . -name '*.go' -not -path './vendor/*' -print0 | xargs -0 gofmt -l); test -z "$f" || { echo "$f"; exit 1; }
      - name: Vet
        run: go vet ./...
      - name: Tests (race detector)
        # The TPM tests fail rather than skip if swtpm is missing.
        env:
          AGENTOS_REQUIRE_SWTPM: "1"
        run: go test -race -count=1 ./...
      - name: Fuzz the socket and action-protocol decoders, 20s per target (LOOP-7, P3-4b-3)
        # Each target already ran its seeds and planted-decoder control above;
        # this fuzzes past the seeds. The long runs are in soak.yml. tools/fuzzrun.py
        # runs each target for the time budget as count-bound chunks sized from the
        # exec/s it measures (logged per chunk below). It never passes a duration to
        # -fuzztime: a time-bounded run can fail at its deadline with a bare "context
        # deadline exceeded" and no input (P1-4-flake), and a count has no deadline. A
        # chunk that hangs is killed at a cap proportional to its expected time.
        run: |
          for t in sockets:FuzzRequest sockets:FuzzFrames browser:FuzzParse modemlink:FuzzInbound guest:FuzzMCP; do
            python3 ../tools/fuzzrun.py --pkg "./${t%%:*}" --target "${t#*:}" --budget 20s || exit 1
          done
  machines:
    # Agent-machine lifecycle against the real kernel (P1-4): cgroup v2,
    # overlayfs, and gVisor. Needs root, so it runs the root-only tests too.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version: "1.26.8" # = broker/go.mod's toolchain line; checked below
          cache: false
      - name: Go is the toolchain go.mod names
        run: |
          want=$(awk '$1 == "toolchain" {print $2}' "$GITHUB_WORKSPACE/broker/go.mod")
          got=$(go version | awk '{print $3}')
          [ -n "$want" ] && [ "$got" = "$want" ] || { echo "Go is $got; broker/go.mod names $want" >&2; exit 1; }
      - name: Install gVisor release-20260928.0 (checksum pinned)
        run: |
          B=https://storage.googleapis.com/gvisor/releases/release/20260928.0/x86_64
          curl -fsSLo /tmp/gvisor.tar.bz2 "$B/gvisor.tar.bz2"
          echo "c8d3a9fd4d4c4f5b8ff213caa4517356be128d18659ec4cde37828fe797f61a9725a602a846c81a8ed19c057a996515d31c081eba343ed4613a89951ba32ed59  /tmp/gvisor.tar.bz2" | sha512sum -c
          mkdir /tmp/gv && tar -xjf /tmp/gvisor.tar.bz2 -C /tmp/gv
          sudo install -m 0755 /tmp/gv/runsc /usr/local/bin/runsc
          sudo mkdir -p /usr/local/bin/gvisor-bin
          sudo install -m 0755 /tmp/gv/gvisor-bin/* /usr/local/bin/gvisor-bin/
          runsc --version
      - name: Project quotas (SR2-3)
        # ext4 project quotas need the quota_v2 format module, which the
        # runner's kernel keeps in linux-modules-extra; XFS has its own.
        # The quota tests run on each that mounts and fail if neither does.
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq xfsprogs acl
          sudo modprobe quota_v2 2>/dev/null || {
            sudo apt-get install -yq "linux-modules-extra-$(uname -r)" && sudo modprobe quota_v2
          } || echo "::warning::no quota_v2 module: ext4 quota tests skip; XFS covers them"
      - name: Machine tests as root
        working-directory: broker
        run: |
          sudo mkdir /sys/fs/cgroup/agentos-ci
          # With no_new_privs, as agentosd.service runs runsc (NoNewPrivileges=yes; L7-6).
          sudo setpriv --no-new-privs env "PATH=$PATH" GOTOOLCHAIN=local HOME=/root GOCACHE=/tmp/gocache \
            AGENTOS_RUNSC=/usr/local/bin/runsc AGENTOS_CGROUP_PARENT=/sys/fs/cgroup/agentos-ci \
            AGENTOS_REQUIRE_QUOTA=1 \
            go test -count=1 -v ./cgroup ./quota/... ./vm/... ./recovery ./cleanroom
          # Fuzz children's leaf, user, network and tree (P3-4b-3r-confine), as
          # root, in a run of their own.
          sudo env "PATH=$PATH" GOTOOLCHAIN=local HOME=/root GOCACHE=/tmp/gocache \
            AGENTOS_CGROUP_PARENT=/sys/fs/cgroup/agentos-ci \
            go test -count=1 -v ./loop7
          sudo env "PATH=$PATH" GOTOOLCHAIN=local HOME=/root GOCACHE=/tmp/gocache \
            AGENTOS_CGROUP_PARENT=/sys/fs/cgroup/agentos-ci AGENTOS_REQUIRE_QUOTA=1 \
            go test -count=1 -v -run '^(TestTheFuzzLeafSitsBesideTheBrokerAndConfinesARound|TestAFuzzChildReachesOnlyItsOwnBoundedTree)$' ./cmd/agentosd
          # Per-machine disk quotas on a prjquota file system (RES-4, SR2-3).
          sudo env "PATH=$PATH" GOTOOLCHAIN=local HOME=/root GOCACHE=/tmp/gocache AGENTOS_REQUIRE_QUOTA=1 \
            go test -count=1 -v -run '^(TestMachinesGetTheStateFileSystemsQuota|TestMachineDiskWithQuotasAddsNoLine)$' ./cmd/agentosd
      - name: Fuzz leaf memory peaks (P3-4b-3r-confine-r1)
        # Each target in the image's fuzz manifest, built as image/build.sh builds it, runs one
        # round as agentosd wires it in a fresh leaf; the table of memory.peak sets the leaf's
        # cap (agentosd L7-6) and goes to the step summary.
        working-directory: broker
        run: |
          sudo env "PATH=$PATH" GOTOOLCHAIN=local HOME=/root GOCACHE=/tmp/gocache \
            AGENTOS_CGROUP_PARENT=/sys/fs/cgroup/agentos-ci AGENTOS_FUZZ_PEAKS=/tmp/fuzz-peaks.md \
            go test -count=1 -v -timeout 40m -run '^TestFuzzLeafPeakPerTarget$' ./loop7
          { echo "### Fuzz leaf memory peaks"; cat /tmp/fuzz-peaks.md; } >> "$GITHUB_STEP_SUMMARY"
      - name: OpenClaw guest under gVisor (P1-7)
        # Real OpenClaw, pinned by version and hash, as an agent machine with
        # only its broker socket; a scripted model stands in for a provider.
        run: |
          sh guest/openclaw/build-rootfs.sh /tmp/ocroot
          # With no_new_privs, as agentosd.service runs runsc (L7-6).
          cd broker && sudo setpriv --no-new-privs env "PATH=$PATH" GOTOOLCHAIN=local HOME=/root GOCACHE=/tmp/gocache \
            AGENTOS_RUNSC=/usr/local/bin/runsc AGENTOS_OPENCLAW_ROOTFS=/tmp/ocroot \
            go test -count=1 -v -run '^TestIntegrationOpenClawGuest$' ./e2e
      - name: Loop 1 builder image under gVisor (W3-builder-image)
        # The minimal builder image (brief client only) runs a builder job in
        # a private lb- machine; a scripted model stands in for a provider.
        run: |
          sh guest/builder/build-rootfs.sh /tmp/lbroot
          cd broker && sudo env "PATH=$PATH" GOTOOLCHAIN=local HOME=/root GOCACHE=/tmp/gocache \
            AGENTOS_RUNSC=/usr/local/bin/runsc AGENTOS_BUILDER_ROOTFS=/tmp/lbroot \
            go test -count=1 -v -run '^TestIntegrationBuilderImage$' ./e2e
      - name: Floor box admission and preemption (P2-5)
        # A 7680 MiB group stands in for the 8 GB N95 (HW-4); prints FLOOR-RESULT.
        working-directory: broker
        run: |
          sudo env "PATH=$PATH" GOTOOLCHAIN=local HOME=/root GOCACHE=/tmp/gocache \
            AGENTOS_RUNSC=/usr/local/bin/runsc AGENTOS_CGROUP_PARENT=/sys/fs/cgroup/agentos-ci \
            go test -count=1 -v -timeout 20m ./floor
  hostcheck:
    # The host-untouched check (HOST-1e; A1, HW-8) on a QEMU/OVMF/swtpm host
    # with a Windows-like second disk, booting the stand-in guest until P2-1's
    # image boots here. Each QEMU process also has the harness's own timeout.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: QEMU, OVMF, swtpm, tpm2-tools, virt-firmware (all from Ubuntu's archive)
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq qemu-system-x86 qemu-utils ovmf swtpm swtpm-tools tpm2-tools \
            busybox-static ntfs-3g dosfstools cpio fdisk python3-virt-firmware
      - name: KVM for the runner user, if the runner has it
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
            sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          fi
      - name: Stand-in guest kernel (Ubuntu's virtual kernel)
        run: |
          pkg=$(apt-cache depends linux-image-virtual | awk '/Depends: linux-image-[0-9]/{print $2; exit}')
          cd "$RUNNER_TEMP" && apt-get download "$pkg" && dpkg-deb -x "$pkg"_*.deb k
          echo "HOSTCHECK_KERNEL=$(ls "$RUNNER_TEMP"/k/boot/vmlinuz-*)" >> "$GITHUB_ENV"
      - name: Host-untouched check, clean and with planted writes
        env:
          HOSTCHECK_QEMU: "1"
        run: python -m unittest tests.test_hostcheck -v
