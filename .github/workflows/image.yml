name: image
# Builds the AgentOS device image (image/, PLAN P2-1) on two runners, boots one build under
# Secure Boot in QEMU, and checks both builds give the same release (/usr verity root hash).
# Runs here because GitHub's runners reach the Debian mirrors; the cloud agent sessions cannot.
# Two builds and a boot cost about an hour of runner time, so only image changes and the broker
# packages the in-image setup run (broker/e2e/boxe2e) goes through trigger it; run it by hand
# (workflow_dispatch) to rebuild after other broker or guest changes. The path lists are kept by hand
# and miss packages the image's binaries import, so main is also built and booted nightly (#1740):
# a change the lists miss is caught within a day. Pull requests and main watch the same paths.
on:
  workflow_dispatch:
  schedule:
    - cron: "37 4 * * *"
  pull_request:
    paths:
      - "image/**"
      - ".github/workflows/image.yml"
      # The guest roots build.sh builds into the image (#5889): import_sweep.allow pins the codex
      # binaries by SHA-256, so a version bump in build-rootfs.sh must meet the sweep in its own PR.
      - "guest/codex/**"
      - "guest/openclaw/**"
      - "tools/hostcheck.py"
      - "tools/hostcheck_image/**"
      - "tests/test_hostcheck.py"
      # The setup path the in-image run drives (#1688): claim, SMS pairing, code generator,
      # Owner Card, recovery and the services behind them.
      - "broker/e2e/boxe2e/**"
      - "broker/localui/**"
      - "broker/claim/**"
      - "broker/firstboot/**"
      - "broker/card/**"
      - "broker/owner/**"
      - "broker/recovery/**"
      - "broker/modem/**"
      - "broker/modemlink/**"
      - "broker/smsapi/**"
      - "broker/change/**"
      - "broker/egress/**"
      - "broker/daemon/**"
      - "broker/cmd/agentosd/**"
      - "broker/cmd/agentos-localui/**"
      # The /usr slot activator's disk adapter, tested on a loop device below (UPD-b3 (c1)).
      - "broker/apply/bootab/**"
      - "broker/cmd/agentos-modem/**"
      - "broker/cmd/agentos-egress/**"
      # The local inference service and the pins of what the image ships with it (INFER-image).
      - "broker/cmd/agentos-infer/**"
      # A21 in QEMU (#3117): the slice boot runs on every change to the kernel, the clerks or the
      # eval set (PLAN: A21 runs on every change to the kernel or clerks).
      - "broker/kernel/**"
      - "broker/clerk/**"
      - "evals/slice-inbox/**"
      - "tests/test_slice_inbox_slice.py"
      # The image's vulnerability records: image-vulncheck applies them to each build, and fails
      # on one that accepts no finding, so a change to them alone is scanned here.
      - "assurance/vulncheck.json"
  push:
    branches: [main]
    paths:
      - "image/**"
      - ".github/workflows/image.yml"
      # The guest roots build.sh builds into the image (#5889): import_sweep.allow pins the codex
      # binaries by SHA-256, so a version bump in build-rootfs.sh must meet the sweep in its own PR.
      - "guest/codex/**"
      - "guest/openclaw/**"
      - "tools/hostcheck.py"
      - "tools/hostcheck_image/**"
      - "tests/test_hostcheck.py"
      # The setup path the in-image run drives (#1688): claim, SMS pairing, code generator,
      # Owner Card, recovery and the services behind them.
      - "broker/e2e/boxe2e/**"
      - "broker/localui/**"
      - "broker/claim/**"
      - "broker/firstboot/**"
      - "broker/card/**"
      - "broker/owner/**"
      - "broker/recovery/**"
      - "broker/modem/**"
      - "broker/modemlink/**"
      - "broker/smsapi/**"
      - "broker/change/**"
      - "broker/egress/**"
      - "broker/daemon/**"
      - "broker/cmd/agentosd/**"
      - "broker/cmd/agentos-localui/**"
      # The /usr slot activator's disk adapter, tested on a loop device below (UPD-b3 (c1)).
      - "broker/apply/bootab/**"
      - "broker/cmd/agentos-modem/**"
      - "broker/cmd/agentos-egress/**"
      # The local inference service and the pins of what the image ships with it (INFER-image).
      - "broker/cmd/agentos-infer/**"
      # A21 in QEMU (#3117): the slice boot runs on every change to the kernel, the clerks or the
      # eval set (PLAN: A21 runs on every change to the kernel or clerks).
      - "broker/kernel/**"
      - "broker/clerk/**"
      - "evals/slice-inbox/**"
      - "tests/test_slice_inbox_slice.py"
      # The image's vulnerability records: image-vulncheck applies them to each build, and fails
      # on one that accepts no finding, so a change to them alone is scanned here.
      - "assurance/vulncheck.json"
env:
  GOWORK: "off" # = ci.yml: a go.work cannot change what a Go command here loads
permissions:
  contents: read
# CI-cancel-superseded (#5345, #5348): a PR's first-attempt run cancels that PR's older first
# attempts, so a superseded head never holds the queue. A rerun (attempt 2 or later) and every push,
# merge-queue, schedule or dispatch run is a group of its own (run id), so it never cancels or
# replaces the current head's run.
concurrency:
  group: ${{ github.workflow }}-${{ startsWith(github.event_name, 'pull_request') && github.run_attempt == 1 && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ startsWith(github.event_name, 'pull_request') && github.run_attempt == 1 }}
jobs:
  # IMG-repro-security-pin (#5021): one debian-security snapshot for the whole run, chosen before
  # either build starts, so builds a and b (the image, its initrd and both guest roots) install the
  # same security packages, and the run still takes every security fix published before it.
  security-snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      snapshots: ${{ steps.resolve.outputs.snapshots }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - name: Resolve the debian-security snapshot
        id: resolve
        # The script prints only timestamps it has checked (YYYYMMDDTHHMMSSZ): the run's snapshot and the
        # fallback both builds take when it stops serving its index (#6198), or fails.
        run: |
          ts=$(sh image/security-snapshot.sh resolve)
          echo "snapshots=$ts" >> "$GITHUB_OUTPUT"
  # IMG-mkosi-run-bound (#4690, D-276): build.sh runs as root, so it could repoint mkosi's config, flags or
  # binary on its own runner. It runs only here: it stages the image tree into OUT/stage, and the job
  # uploads that tree (with the guests' and linked package lists) for the build job, which runs the pinned
  # mkosi on the committed config on a fresh runner and never runs build.sh. The root tests that need no
  # image run here too, so nothing from the repository runs as root before mkosi there.
  stage:
    needs: security-snapshot
    strategy:
      fail-fast: false
      matrix:
        run: [a, b]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      # IMG-disk (#4317): the runner's disk, not the image, ran out mid-build (systemd-repart ENOSPC).
      # Preinstalled toolchains the job never uses go first; the guard below then checks the result.
      - name: Free runner disk
        run: |
          gb() { echo $(( $(df -BM --output=avail / | tail -n 1 | tr -dc 0-9) / 1024 )); }
          echo "::notice title=disk budget::/ had $(gb) GB free before freeing the runner disk"
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift \
            /opt/hostedtoolcache/CodeQL /usr/local/share/powershell /usr/local/share/chromium
          sudo docker image prune -a -f >/dev/null 2>&1 || true
          echo "::notice title=disk budget::/ has $(gb) GB free after freeing the runner disk"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5.6.0
        with:
          go-version-file: broker/go.mod
          cache: false
      - name: Install staging tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends debian-archive-keyring erofs-utils dosfstools mtools \
            e2fsprogs cpio zstd kmod bubblewrap cryptsetup-bin mmdebstrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Disk adapter on a loop device (UPD-b3 (c1))
        # As root: a GPT on a loop device, the booted slot held by dm-verity (broker/apply/bootab).
        # A skipped test exits 0, so the step also requires the loop test's PASS line.
        shell: bash  # with pipefail, so tee keeps the test's exit status
        run: |
          (cd broker && go test -c -o "$RUNNER_TEMP/bootab.test" ./apply/bootab)
          sudo modprobe dm-verity
          sudo env AGENTOS_BOOTAB_LOOP=1 "$RUNNER_TEMP/bootab.test" -test.run '^TestLinux' -test.v -test.count=1 | tee "$RUNNER_TEMP/bootab.log"
          grep -q -- '^--- PASS: TestLinuxSlotsOnALoopDevice ' "$RUNNER_TEMP/bootab.log"
      # #4677: the unit rules' fixtures, each a loading rule a #4737 review found, run through the reader
      # CI runs on the built tree (image/unit_rules.py), with the runner's systemd deciding each unit's
      # files, and every refusal row of the unit rules again through it. They need root and systemd,
      # and AGENTOS_REQUIRE_SYSTEMD=1 makes a skip fail.
      - name: Unit-rule fixtures under systemd (image/unit_rules.py)
        if: matrix.run == 'a'
        shell: bash  # with pipefail, so tee keeps the test's exit status
        run: |
          (cd broker && go test -c -o "$RUNNER_TEMP/privfile.test" ./kernel/privfile)
          cd broker/kernel/privfile
          sudo env "PATH=$PATH" AGENTOS_REQUIRE_SYSTEMD=1 "$RUNNER_TEMP/privfile.test" -test.run '^(TestUnitRulesUnderSystemd|TestRootSideUnitPathsAndGrants)$' -test.v -test.count=1 | tee "$RUNNER_TEMP/unit-fixtures.log"
          grep -q -- '^--- PASS: TestUnitRulesUnderSystemd ' "$RUNNER_TEMP/unit-fixtures.log"
          grep -q -- '^--- PASS: TestRootSideUnitPathsAndGrants ' "$RUNNER_TEMP/unit-fixtures.log"
      - name: Stage the image tree (image/build.sh)
        shell: bash  # with pipefail, so tee keeps the build's exit status
        env:
          AGENTOS_SECURITY_SNAPSHOT: ${{ needs.security-snapshot.outputs.snapshots }}  # the same for a and b (#5021)
        run: sudo env "PATH=$PATH" "AGENTOS_SECURITY_SNAPSHOT=$AGENTOS_SECURITY_SNAPSHOT" HOME=/root GOCACHE=/tmp/gocache image/build.sh "$RUNNER_TEMP/out" 2>&1 | tee "$RUNNER_TEMP/stage.log"
      # A tar keeps the tree's owners, modes and links, which the artifact store does not. The stage is
      # /usr alone: the build job copies OUT/stage/usr to /usr and nowhere else.
      - name: Pack the stage
        run: |
          [ "$(sudo ls -A "$RUNNER_TEMP/out/stage")" = usr ] || { echo "::error::OUT/stage holds more than usr/"; exit 1; }
          sudo tar -C "$RUNNER_TEMP/out" --numeric-owner -cf "$RUNNER_TEMP/stage.tar" stage agentos.sources guest linked
          echo "::notice title=stage size::$(du -m "$RUNNER_TEMP/stage.tar" | cut -f1) MB"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: stage-${{ matrix.run }}
          path: ${{ runner.temp }}/stage.tar
          compression-level: 1
          retention-days: 1
          if-no-files-found: error
  # The pinned mkosi on the committed config (IMG-mkosi-run-bound, #4690, D-276): mkosi is installed before
  # anything from the repository runs, and the one line "Build image" runs reads the config directory from
  # this checkout and the extra tree from the stage job's upload; this job never runs image/build.sh.
  build:
    needs: [security-snapshot, stage]
    strategy:
      fail-fast: false
      matrix:
        run: [a, b]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      DISK_NEED_GB: "24" # IMG-disk (#4317): measured peak growth 15 GB (build a, boots included); see "Disk budget"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      # IMG-disk (#4317): the runner's disk, not the image, ran out mid-build (systemd-repart ENOSPC).
      # Preinstalled toolchains the job never uses go first; the guard below then checks the result.
      - name: Free runner disk
        run: |
          gb() { echo $(( $(df -BM --output=avail / | tail -n 1 | tr -dc 0-9) / 1024 )); }
          echo "::notice title=disk budget::/ had $(gb) GB free before freeing the runner disk"
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift \
            /opt/hostedtoolcache/CodeQL /usr/local/share/powershell /usr/local/share/chromium
          sudo docker image prune -a -f >/dev/null 2>&1 || true
          echo "::notice title=disk budget::/ has $(gb) GB free after freeing the runner disk"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5.6.0
        with:
          go-version-file: broker/go.mod
          cache: false
      - name: Install build and boot tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends debian-archive-keyring systemd-boot systemd-boot-efi \
            systemd-container erofs-utils dosfstools mtools e2fsprogs cpio zstd kmod bubblewrap cryptsetup-bin \
            qemu-system-x86 ovmf swtpm swtpm-tools mmdebstrap
          # Ubuntu 24.04 confines user namespaces via AppArmor, which breaks mkosi's bubblewrap sandbox.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo git clone -q https://github.com/systemd/mkosi /opt/mkosi
          sudo git -C /opt/mkosi -c advice.detachedHead=false checkout -q 26673f65e17ae099bb0cf65928fe70c93b8a6a37  # v24.3
      # IMG-disk (#4317, #4366): each file system the job writes to (output and boot copies in
      # RUNNER_TEMP, mkosi's workspace in /var/tmp, GOCACHE in /tmp, mkosi's cache under /root) must
      # have DISK_NEED_GB free, or the job stops here with both numbers and the runner's cloud (from
      # its firmware vendor: the runner pool mixes AWS and Azure machines). A sampler then records the
      # use of those file systems every second, and "Disk budget held" fails a job whose growth went
      # over it, so a change that grows the build turns its own PR red instead of a later one.
      - name: Disk budget
        shell: bash
        run: |
          vendor=$(cat "${DMI_ID:-/sys/class/dmi/id}/sys_vendor" 2>/dev/null || true)
          case "$vendor" in
            "Amazon EC2"*) cloud=AWS;; "Microsoft Corporation"*) cloud=Azure;; *) cloud="unknown-cloud (${vendor:-no DMI vendor})";;
          esac
          df -BM --output=target "$RUNNER_TEMP" /var/tmp /tmp /root | tail -n +2 | sort -u > "$RUNNER_TEMP/disk.mounts"
          fail=0
          while read -r m; do
            have=$(( $(df -BM --output=avail "$m" | tail -n 1 | tr -dc 0-9) / 1024 ))
            echo "::notice title=disk budget::$cloud runner: image build needs $DISK_NEED_GB GB free on $m, runner has $have GB"
            # "Free runner disk" frees space on / only; a short mount of its own needs the build's writes moved.
            if [ "$m" = / ]; then fix='free more in "Free runner disk"'
            else fix="$m is its own file system, which \"Free runner disk\" does not free: move what every step of this job writes under $m to a directory on /, and put that directory in place of $m in this step's df line"; fi
            [ "$have" -ge "$DISK_NEED_GB" ] || { echo "::error title=disk budget::$cloud runner: image build needs $DISK_NEED_GB GB free on $m, runner has $have GB; $fix"; fail=1; }
          done < "$RUNNER_TEMP/disk.mounts"
          [ "$fail" = 0 ]
          # Used MB summed over those file systems (awk reads "1234M" as 1234).
          printf '%s\n' '#!/bin/sh' 'xargs -d "\n" df -BM --output=used < "$RUNNER_TEMP/disk.mounts" | awk "NR > 1 {s += \$1} END {print s}"' > "$RUNNER_TEMP/disk-used"
          chmod +x "$RUNNER_TEMP/disk-used"
          "$RUNNER_TEMP/disk-used" > "$RUNNER_TEMP/disk.base"
          nohup sh -c 'while :; do "$RUNNER_TEMP/disk-used" >> "$RUNNER_TEMP/disk.samples"; sleep 1; done' >/dev/null 2>&1 &
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: stage-${{ matrix.run }}
          path: ${{ runner.temp }}/stage-in
      # The stage job runs the PR's build.sh as root, so its tar is held here (#6148 L3 B1): only stage/usr,
      # agentos.sources, guest/ and linked/ may be in it, with stage and stage/usr real directories and
      # agentos.sources a regular file; anything else (a pkgmngr/ above all) refuses the build.
      - name: Unpack the stage
        run: |
          t="$RUNNER_TEMP/stage-in/stage.tar"
          tar -tf "$t" > "$RUNNER_TEMP/stage.list"
          if grep -Evx 'stage/|stage/usr/|stage/usr/.+|agentos\.sources|guest/|guest/.+|linked/|linked/.+' "$RUNNER_TEMP/stage.list" \
            || grep -E '(^|/)\.\.(/|$)' "$RUNNER_TEMP/stage.list"; then
            echo "::error::the stage tar holds a member outside stage/usr, agentos.sources, guest/ and linked/ (above)"; exit 1
          fi
          sudo mkdir "$RUNNER_TEMP/out"
          sudo tar -C "$RUNNER_TEMP/out" --numeric-owner -xf "$t"
          rm -rf "$RUNNER_TEMP/stage-in"
          o="$RUNNER_TEMP/out"
          { [ -d "$o/stage" ] && [ ! -h "$o/stage" ] && [ -d "$o/stage/usr" ] && [ ! -h "$o/stage/usr" ] \
            && [ "$(sudo ls -A "$o/stage")" = usr ] && [ -f "$o/agentos.sources" ] && [ ! -h "$o/agentos.sources" ] \
            && [ ! -e "$o/pkgmngr" ]; } || { echo "::error::the stage is not stage/usr alone (directories, no links) and a regular agentos.sources"; exit 1; }
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
          echo "VERSION=$(TZ=UTC git log -1 --date=format-local:%Y%m%d.%H%M%S --format=%cd)" >> "$GITHUB_ENV"
      # The run's one debian-security snapshot (#5021) as mkosi's package manager tree, made here from the
      # committed sources; the guests' roots were installed from the same file (the stage's agentos.sources).
      - name: Build image
        shell: bash  # with pipefail, so tee keeps the build's exit status
        env:
          SNAPSHOTS: ${{ needs.security-snapshot.outputs.snapshots }}  # the run's snapshot, then its fallback (#6198)
          OUT: ${{ runner.temp }}/out
        run: |
          # The stage picked the run's snapshot or its fallback (#6198) and recorded it in agentos.sources. The
          # stage ran build.sh as root, so its pick counts only if it is one of this job's resolved dates.
          AGENTOS_SECURITY_SNAPSHOT=$(sed -n 's|^URIs: https://snapshot\.debian\.org/archive/debian-security/\([0-9]\{8\}T[0-9]\{6\}Z\)/$|\1|p' "$OUT/agentos.sources")
          case " $SNAPSHOTS " in
            *" $AGENTOS_SECURITY_SNAPSHOT "*) [ -n "$AGENTOS_SECURITY_SNAPSHOT" ] ;;
            *) echo "::error::the stage's debian-security snapshot '$AGENTOS_SECURITY_SNAPSHOT' is not one of this run's ($SNAPSHOTS)"; exit 1 ;;
          esac
          sh image/security-snapshot.sh sources "$AGENTOS_SECURITY_SNAPSHOT" > "$RUNNER_TEMP/mkosi.sources"  # refuses an empty or multi-line value
          cmp "$RUNNER_TEMP/mkosi.sources" "$OUT/agentos.sources"
          sudo rm -rf "$OUT/pkgmngr"
          sudo install -D -m 0644 "$RUNNER_TEMP/mkosi.sources" "$OUT/pkgmngr/etc/apt/sources.list.d/mkosi.sources"
          sudo env "PATH=$PATH" HOME=/root "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" /opt/mkosi/bin/mkosi -C image/mkosi -f --package-manager-tree="$OUT/pkgmngr" --image-version="$VERSION" --environment=AGENTOS_SECURITY_SNAPSHOT="$AGENTOS_SECURITY_SNAPSHOT" --extra-tree="$OUT/stage/usr:/usr" --output-dir "$OUT" build 2>&1 | tee "$RUNNER_TEMP/build.log"
      - name: Finish the image (image/finish.sh)
        run: sudo env "PATH=$PATH" "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" image/finish.sh "$RUNNER_TEMP/out" "$VERSION"
      - name: Show the tree check's refusals
        # The tree check's refusals as annotations, so a tmpfiles.d line missing from
        # image/mkosi/tmpfiles.allow can be reviewed (and its entry copied) without the full log (#1543).
        # An annotation holds 4096 characters and a step 10 of each level, so allowlist misses are
        # shown as their bare entries after the other refusals, packed into chunks that each start with
        # the heading. A line the guarded-path check also refuses is not offered as an entry: it must
        # not be added (mkosi.finalize gives it none either).
        if: failure()
        run: |
          python3 -I - "$RUNNER_TEMP/build.log" <<'PY'
          import re, sys
          lines = [l.split("image check: ", 1)[1].rstrip("\n") for l in open(sys.argv[1], errors="replace")
                   if "image check: " in l]
          guarded = {m.group(1, 2) for m in (re.match(r"(.+?): line (\d+): ", l) for l in lines) if m}
          others, entries = [], []
          for l in lines:
              m = re.match(r"(.+?) line (\d+): not on the tmpfiles.d allowlist .*?; entry: (.*)$", l)
              if not m:
                  others.append(l)
              elif m.group(1, 2) not in guarded:
                  entries.append(m.group(3))
          def pack(lines, head=""):
              # Chunks of at most about 3500 characters, each starting with HEAD.
              chunks, cur = [], head
              for l in lines:
                  if cur != head and len(cur) + len(l) + 1 > 3500:
                      chunks.append(cur)
                      cur = head
                  cur += l[:3500] + "\n"
              return chunks + ([cur] if cur != head else [])
          chunks = pack(others) + pack(entries, "review each line, then add it to image/mkosi/tmpfiles.allow:\n")
          for i, c in enumerate(chunks[:30]):
              level = ("error", "warning", "notice")[i // 10]
              msg = c.rstrip("\n").replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print("::%s title=image check %d/%d::%s" % (level, i + 1, len(chunks), msg))
          PY
      # #4677: every unit the built image's own systemd loads, with the files it applies in its order
      # after every mask, held to the root-side unit rules (broker/kernel/privfile TestBuiltUnits). A
      # file counts as a package's only when byte-identical to the one dpkg installed. The control
      # plants a drop-in of ours on a packaged root unit, which must be refused, or a pass means nothing.
      - name: Unit rules on the built tree (image/unit_rules.py)
        shell: bash  # with pipefail, so tee keeps the test's exit status
        run: |
          v=$(jq -r .version "$RUNNER_TEMP"/out/*.release.json)
          mkdir -p "$RUNNER_TEMP/units"
          sudo python3 -I image/unit_rules.py "$RUNNER_TEMP/out" "$v" > "$RUNNER_TEMP/units/tree.json"
          sudo python3 -I image/unit_rules.py --control "$RUNNER_TEMP/out" "$v" > "$RUNNER_TEMP/units/control.json"
          (cd broker && go test -c -o "$RUNNER_TEMP/privfile-built.test" ./kernel/privfile)
          cd broker/kernel/privfile
          AGENTOS_UNIT_RECORDS="$RUNNER_TEMP/units" "$RUNNER_TEMP/privfile-built.test" -test.run '^TestBuiltUnits$' -test.v -test.count=1 | tee "$RUNNER_TEMP/unit-rules.log"
          grep -q -- '^--- PASS: TestBuiltUnits ' "$RUNNER_TEMP/unit-rules.log"
      # #4667: what starting the unlock unit can start, from the built image's own systemd in test mode
      # (generators run, the boot entry's command line) rather than a model of how it reads units. The
      # control first: each path a #4696 review found must add a refusal, or a pass means nothing.
      - name: What the unlock step can start (image/unlock_graph.py)
        run: |
          v=$(jq -r .version "$RUNNER_TEMP"/out/*.release.json)
          sudo python3 -I image/unlock_graph.py --control "$RUNNER_TEMP/out" "$v"
          sudo python3 -I image/unlock_graph.py "$RUNNER_TEMP/out" "$v"
      # #5697: which files of this tree and its initrds import glibc's regex or wide scanf functions,
      # directly or through a library, as notices: the glibc records' reachability (assurance/vulncheck.json)
      # is read from here, not from another distribution's builds. #5341: and which can fetch an OpenSSL
      # cipher by name, with their call sites, for the AES-GCM-SIV records. Fails on an unreviewed change.
      - name: Glibc regex and wide scanf importers, OpenSSL by-name cipher fetches (image/import_sweep.py)
        if: matrix.run == 'a'
        run: |
          v=$(jq -r .version "$RUNNER_TEMP"/out/*.release.json)
          # The summary is printed even when the scan's control fails, so a failure shows what was read.
          s=0
          sudo python3 -I image/import_sweep.py "$RUNNER_TEMP/out" "$v" > "$RUNNER_TEMP/import-sweep.json" || s=1
          python3 -I image/import_sweep.py --summary "$RUNNER_TEMP/import-sweep.json" || s=1
          exit $s
      - name: Build the end-to-end driver
        if: matrix.run == 'a'
        run: cd broker && CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/e2e/box-e2e" ./e2e/boxe2e
      # The vault process the e2e boot runs in place of the image's (image/e2e/agentos-egress.conf):
      # the same package built as image/build.sh does, plus the agentos_e2e tag that points its
      # Codex plan route at the driver's stub (#1701; broker/e2e/boxe2e/ASSUMPTIONS.md E10).
      - name: Build the end-to-end vault process
        if: matrix.run == 'a'
        run: cd broker && CGO_ENABLED=0 go build -tags agentos_e2e -trimpath -ldflags=-buildid= -o "$RUNNER_TEMP/e2e/agentos-egress" ./cmd/agentos-egress
      # The inbox slice the slice boot runs inside the image (A21, #3117; image/slice_boot.py).
      - name: Build the inbox slice
        if: matrix.run == 'a'
        run: cd broker && CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/slice/slice" ./clerk/inbox/cmd/slice
      # The device-driver slot's boot probe: a fixture driver under the driver template (#3590).
      - name: Build the device-driver slot's boot probe
        if: matrix.run == 'a'
        run: cd broker && for b in bootdriver bootprobe; do CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/devslot/$b" ./clerk/devslot/proc/testdata/$b; done
      # The IMAP connection process's boot probe: a stand-in under its shipped sandbox (#3015).
      - name: Build the IMAP connection process's boot probe
        if: matrix.run == 'a'
        run: cd broker && for b in bootconn bootprobe; do CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/imapconn/$b" ./clerk/inbox/imapconn/testdata/$b; done
      # The local inference service's real test the inference boot runs on the installed llama-server
      # and model (INFER-image, #3655): static, so it runs in the image as built here.
      - name: Build the inference real test
        if: matrix.run == 'a'
        run: cd broker && CGO_ENABLED=0 go test -c -tags infer_real,infer_llamacpp -trimpath -o "$RUNNER_TEMP/infer/infer.test" ./cmd/agentos-infer
      - name: Boot test (Secure Boot on), inbox slice, driver slot, IMAP connection process, inference and end-to-end run
        if: matrix.run == 'a'
        run: sudo env E2E="$RUNNER_TEMP/e2e" SLICE="$RUNNER_TEMP/slice" DEVSLOT="$RUNNER_TEMP/devslot" IMAPCONN="$RUNNER_TEMP/imapconn" INFER="$RUNNER_TEMP/infer" image/ci_boot.sh "$RUNNER_TEMP/out/agentos_$(jq -r .version "$RUNNER_TEMP"/out/*.release.json).raw" "$RUNNER_TEMP/boot"
      - name: Keep the console logs
        if: always() && matrix.run == 'a'
        run: |
          for l in console console-reboot console-two-drives console-fallback console-slice console-imapconn console-infer console-e2e; do
            sudo cp "$RUNNER_TEMP/boot/$l.log" "$RUNNER_TEMP/out/qemu-$l.log" || true
          done
      - name: Release record
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/rec"
          cp "$RUNNER_TEMP"/out/*.release.json "$RUNNER_TEMP"/out/SHA256SUMS "$RUNNER_TEMP"/out/*.manifest "$RUNNER_TEMP/rec/" || true
          cp "$RUNNER_TEMP"/out/*.usr.list "$RUNNER_TEMP/rec/" || true
          cp "$RUNNER_TEMP"/out/agentos.dpkg-status "$RUNNER_TEMP"/out/agentos.os-release "$RUNNER_TEMP/rec/" || true
          # The apt sources the image and the guest roots installed from (#5021), compared by the reproduce job.
          cp "$RUNNER_TEMP"/out/agentos.sources "$RUNNER_TEMP/rec/" || true
          cp -R "$RUNNER_TEMP"/out/initrd "$RUNNER_TEMP/rec/" || true
          # The guests' Debian package list (image/guest-base.sh, #5570), compared by the reproduce job.
          cp -R "$RUNNER_TEMP"/out/guest "$RUNNER_TEMP/rec/" || true
          # The packages the main tree's static binaries link (image/llamaserver.sh, #5885), scanned as the main tree.
          cp -R "$RUNNER_TEMP"/out/linked "$RUNNER_TEMP/rec/" || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: release-${{ matrix.run }}
          path: ${{ runner.temp }}/rec
          if-no-files-found: warn
      # Compress, upload and the reproduce job still run after a failed boot or e2e step: an
      # end-to-end FAIL turns this job red, and must not also hide the image and the
      # reproducibility result (#1984). Only a cancelled run skips them.
      - name: Compress the image
        if: ${{ !cancelled() && matrix.run == 'a' }}
        run: sudo zstd -q -T0 -10 "$RUNNER_TEMP/out/agentos_$(jq -r .version "$RUNNER_TEMP"/out/*.release.json).raw" -o "$RUNNER_TEMP/out/agentos.raw.zst"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always() && matrix.run == 'a'
        with:
          name: agentos-image
          path: |
            ${{ runner.temp }}/out/agentos.raw.zst
            ${{ runner.temp }}/out/qemu-console*.log
          retention-days: 7
          if-no-files-found: warn
      # A peak that rose and fell between two samples is missed, so the check adds the largest rise
      # seen in one interval to the highest sample, and the job fails when that bound reaches
      # DISK_NEED_GB. The largest rise seen is only an estimate of such a peak: the budget's headroom
      # over the measured peak (24 GB over 15 GB in #4317) is the real cover, for a missed peak and
      # for the build's growth to come. Each part is rounded up to 0.1 GB and the bound is their sum,
      # so the printed numbers add up and never understate.
      - name: Disk budget held
        if: always()
        shell: bash
        run: |
          [ -s "$RUNNER_TEMP/disk.base" ] || { echo "disk budget: no baseline, the guard did not pass"; exit 0; }
          now=$("$RUNNER_TEMP/disk-used")
          [[ "$now" =~ ^[0-9]+$ ]] || { echo "::error title=disk budget::cannot read the disk use (got '$now'), so the budget is unchecked: df read none of the file systems the \"Disk budget\" notices list, or $RUNNER_TEMP/disk-used is gone; rerun the job, and if it fails again check that those mounts and that script still exist when the job ends"; exit 1; }
          echo "$now" >> "$RUNNER_TEMP/disk.samples"
          # Growth of the highest sample over the baseline, and the largest rise between two samples (MB).
          # An empty sample (one df that failed) is skipped; the final reading above always counts.
          read -r peak rise < <(awk -v b="$(cat "$RUNNER_TEMP/disk.base")" \
            'BEGIN {p = b; q = b} /^[0-9]+$/ {if ($1 > p) p = $1; if ($1 - q > r) r = $1 - q; q = $1} END {print p - b, r + 0}' "$RUNNER_TEMP/disk.samples")
          # In tenths of a GB, each rounded up.
          p=$(( (peak * 10 + 1023) / 1024 )); r=$(( (rise * 10 + 1023) / 1024 )); t=$(( p + r ))
          gb() { echo "$(( $1 / 10 )).$(( $1 % 10 ))"; }
          echo "::notice title=disk budget::the job grew its disk use by at most $(gb $t) GB of its $DISK_NEED_GB GB budget ($(gb $p) GB sampled, plus $(gb $r) GB, the largest rise in one sample interval, for a peak between samples)"
          [ "$t" -lt $(( DISK_NEED_GB * 10 )) ] || { echo "::error title=disk budget::image build may have used up to $(gb $t) GB, at or over its $DISK_NEED_GB GB budget; raise DISK_NEED_GB in .github/workflows/image.yml (the build job's env)"; exit 1; }
  reproduce:
    # Two runners, one commit: the release must match: the /usr root hash, every /usr file, the boot
    # entry, the kernel and both initrds (IMG-2). A differing initrd is listed member by member, and
    # a differing /usr file by path and field (#4059).
    # The whole-disk hash is reported too. Both package manifests must list packages.
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          path: rec
      - name: Compare
        # The script prints every name and value it reads from the two builds escaped (#4648);
        # this step echoes nothing from them itself.
        run: |
          ok=1
          # Fails on a missing, empty or truncated manifest (#1474); prints each side's package count.
          python3 image/compare_manifests.py rec/release-a rec/release-b || ok=0
          # The /usr files (#4059), root hash, boot entry, kernel and initrds (IMG-2).
          python3 image/compare_manifests.py --release rec/release-a rec/release-b || ok=0
          # The guests' packages (#5570): each build's Debian userland for the OpenClaw and Codex roots,
          # so a guest file that differs names the package version behind it.
          python3 image/compare_manifests.py rec/release-a/guest rec/release-b/guest || ok=0
          # One debian-security snapshot for both builds (#5021): the same apt sources, byte for byte.
          cmp rec/release-a/agentos.sources rec/release-b/agentos.sources || ok=0
          [ $ok = 1 ]
  hostcheck-image:
    # HOST-1e2 (HW-8): the host-untouched check on the image just built, booted from a USB drive on a
    # QEMU/OVMF/swtpm host with a Windows-like internal disk: boot, restart and a power cut, then the
    # image in shutdown, whose liveness answers must end before its MOR clear (HOST-1h). The responder
    # rides as SMBIOS credentials (tools/hostcheck_image/), so the image booted is the one built. The VM stack
    # comes from the image's Debian snapshot, by ci.yml's hostcheck job's step (CI-hostcheck-image-tools).
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: tpm2-tools, virt-firmware and the host disk's tools (from Ubuntu's archive)
        # They read the host's state and build the host disk; the stack the check boots is not here.
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq tpm2-tools busybox-static ntfs-3g dosfstools cpio fdisk zstd \
            python3-virt-firmware mmdebstrap debian-archive-keyring
          sh image/debian-archive-keyring.sh  # exactly the pinned keys (#5578)
      - name: QEMU, OVMF and swtpm, from the image's Debian snapshot
        run: |
          # ci.yml's hostcheck job's step, line for line (tests/test_hostcheck.py ROOT_STEP).
          src="$RUNNER_TEMP/snapshot.sources"
          awk -v RS= -v ORS='\n\n' '/\nURIs: https:\/\/snapshot\.debian\.org\//' \
            image/mkosi/mkosi.pkgmngr/etc/apt/sources.list.d/mkosi.sources > "$src"
          [ "$(grep -c '^URIs:' "$src")" = 1 ] || { echo "want one snapshot stanza, got:" >&2; cat "$src" >&2; exit 1; }
          cat "$src"
          sudo mmdebstrap --mode=root --variant=essential --include=qemu-system-x86,ovmf,swtpm,swtpm-tools trixie \
            "$RUNNER_TEMP/hostcheck-tools" "$src"
          sudo chroot "$RUNNER_TEMP/hostcheck-tools" dpkg-query -W qemu-system-x86 ovmf swtpm swtpm-tools
      - name: KVM for the runner user, if the runner has it
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
            sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: agentos-image
          path: ${{ runner.temp }}/image
      - name: Unpack the image
        run: zstd -q -d "$RUNNER_TEMP/image/agentos.raw.zst" -o "$RUNNER_TEMP/agentos.raw" && rm "$RUNNER_TEMP/image/agentos.raw.zst"
      - name: Host-untouched check on the image, and the image in shutdown
        env:
          HOSTCHECK_IMAGE: ${{ runner.temp }}/agentos.raw
          HOSTCHECK_WORK: ${{ runner.temp }}/hostcheck-work
          HOSTCHECK_TOOLS_ROOT: ${{ runner.temp }}/hostcheck-tools
        run: python -m unittest tests.test_hostcheck.ImageTest -v
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: hostcheck-image
          path: |
            ${{ runner.temp }}/hostcheck-work/*/console-*.log
            ${{ runner.temp }}/hostcheck-work/*/events-*.json
            ${{ runner.temp }}/hostcheck-work/*/report.json
          retention-days: 7
          if-no-files-found: warn
  # Not named vulncheck: that is vulncheck.yml's required check.
  image-vulncheck:
    # SPEC EVL-5 (#2886): a known vulnerability in a Debian package the image ships fails unless
    # an open issue named in assurance/vulncheck.json (a record whose where is "image") records
    # why it is accepted. Build a's package list (mkosi.postinst), which vulncheck.py checks
    # against build a's mkosi manifest; the reproduce job checks b's manifest lists the same. The
    # guests' packages are scanned as their own tree, "image/guest" (#5572): the status of the
    # packages whose files the guests carry (image/guest-shipped.sh), checked against the base
    # root's manifest the reproduce job compares. The scanners and their pins are vulncheck.yml's, and the control
    # runs first, so a clean scan counts only because the same scanners caught every plant.
    # vulncheck.yml rescans main's latest image daily, for advisories published after a build.
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      issues: read # --check-issues: each acceptance's issue must be open
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: release-a
          path: rec
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version: "1.26.11" # = broker/go.mod's toolchain line; checked below
          cache: false
      - name: Go is the toolchain go.mod names
        run: |
          want=$(awk '$1 == "toolchain" {print $2}' "$GITHUB_WORKSPACE/broker/go.mod")
          got=$(go version | awk '{print $3}')
          [ -n "$want" ] && [ "$got" = "$want" ] || { echo "Go is $got; broker/go.mod names $want" >&2; exit 1; }
      # Pinned versions, the same as vulncheck.yml's (tests/test_vulncheck.py checks).
      # Tried three times, as in vulncheck.yml (#3768).
      - name: Install govulncheck and osv-scanner
        run: |
          retry() {
            for t in 1 2 3; do
              "$@" && return
              echo "try $t of 3 failed: $*" >&2
              [ "$t" = 3 ] || sleep $((t * 15))
            done
            echo "::error::$* failed 3 times; the scan cannot run (#3768)"
            return 1
          }
          retry go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          retry go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.5.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Control (planted vulnerabilities, offline databases)
        run: python3 tools/vulncheck.py control
      - name: Known vulnerabilities in the image's, initrd's and guests' packages (EVL-5)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/vulncheck.py image rec --check-issues --report image-vulncheck-report.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: image-vulncheck-report
          path: image-vulncheck-report.json
          if-no-files-found: ignore
