name: image
# Builds the AgentOS device image (image/, PLAN P2-1) on two runners, boots one build under
# Secure Boot in QEMU, and checks both builds give the same release (/usr verity root hash).
# Runs here because GitHub's runners reach the Debian mirrors; the cloud agent sessions cannot.
# Two builds and a boot cost about an hour of runner time, so only image changes and the broker
# packages the in-image setup run (broker/e2e/boxe2e) goes through trigger it; run it by hand
# (workflow_dispatch) to rebuild after other broker or guest changes. The path lists are kept by hand
# and miss packages the image's binaries import, so main is also built and booted nightly (#1740):
# a change the lists miss is caught within a day. Pull requests and main watch the same paths.
on:
  workflow_dispatch:
  schedule:
    - cron: "37 4 * * *"
  pull_request:
    paths:
      - "image/**"
      - ".github/workflows/image.yml"
      # The setup path the in-image run drives (#1688): claim, SMS pairing, code generator,
      # Owner Card, recovery and the services behind them.
      - "broker/e2e/boxe2e/**"
      - "broker/localui/**"
      - "broker/claim/**"
      - "broker/firstboot/**"
      - "broker/card/**"
      - "broker/owner/**"
      - "broker/recovery/**"
      - "broker/modem/**"
      - "broker/modemlink/**"
      - "broker/smsapi/**"
      - "broker/change/**"
      - "broker/egress/**"
      - "broker/daemon/**"
      - "broker/cmd/agentosd/**"
      - "broker/cmd/agentos-localui/**"
      # The /usr slot activator's disk adapter, tested on a loop device below (UPD-b3 (c1)).
      - "broker/apply/bootab/**"
      - "broker/cmd/agentos-modem/**"
      - "broker/cmd/agentos-egress/**"
      # The local inference service and the pins of what the image ships with it (INFER-image).
      - "broker/cmd/agentos-infer/**"
      # A21 in QEMU (#3117): the slice boot runs on every change to the kernel, the clerks or the
      # eval set (PLAN: A21 runs on every change to the kernel or clerks).
      - "broker/kernel/**"
      - "broker/clerk/**"
      - "evals/slice-inbox/**"
      - "tests/test_slice_inbox_slice.py"
  push:
    branches: [main]
    paths:
      - "image/**"
      - ".github/workflows/image.yml"
      # The setup path the in-image run drives (#1688): claim, SMS pairing, code generator,
      # Owner Card, recovery and the services behind them.
      - "broker/e2e/boxe2e/**"
      - "broker/localui/**"
      - "broker/claim/**"
      - "broker/firstboot/**"
      - "broker/card/**"
      - "broker/owner/**"
      - "broker/recovery/**"
      - "broker/modem/**"
      - "broker/modemlink/**"
      - "broker/smsapi/**"
      - "broker/change/**"
      - "broker/egress/**"
      - "broker/daemon/**"
      - "broker/cmd/agentosd/**"
      - "broker/cmd/agentos-localui/**"
      # The /usr slot activator's disk adapter, tested on a loop device below (UPD-b3 (c1)).
      - "broker/apply/bootab/**"
      - "broker/cmd/agentos-modem/**"
      - "broker/cmd/agentos-egress/**"
      # The local inference service and the pins of what the image ships with it (INFER-image).
      - "broker/cmd/agentos-infer/**"
      # A21 in QEMU (#3117): the slice boot runs on every change to the kernel, the clerks or the
      # eval set (PLAN: A21 runs on every change to the kernel or clerks).
      - "broker/kernel/**"
      - "broker/clerk/**"
      - "evals/slice-inbox/**"
      - "tests/test_slice_inbox_slice.py"
env:
  GOWORK: "off" # = ci.yml: a go.work cannot change what a Go command here loads
permissions:
  contents: read
# A newer push to the same PR cancels that PR's older run, both builds and every check after them,
# so only the latest revision spends runner time. Pushes to main and manual runs each get a group of
# their own (the run id), so they never cancel or displace one another and always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        run: [a, b]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      DISK_NEED_GB: "24" # IMG-disk (#4317): measured peak growth 15 GB (build a, boots included); see "Disk budget"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      # IMG-disk (#4317): the runner's disk, not the image, ran out mid-build (systemd-repart ENOSPC).
      # Preinstalled toolchains the job never uses go first; the guard below then checks the result.
      - name: Free runner disk
        run: |
          gb() { echo $(( $(df -BM --output=avail / | tail -n 1 | tr -dc 0-9) / 1024 )); }
          echo "::notice title=disk budget::/ had $(gb) GB free before freeing the runner disk"
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift \
            /opt/hostedtoolcache/CodeQL /usr/local/share/powershell /usr/local/share/chromium
          sudo docker image prune -a -f >/dev/null 2>&1 || true
          echo "::notice title=disk budget::/ has $(gb) GB free after freeing the runner disk"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5.6.0
        with:
          go-version-file: broker/go.mod
          cache: false
      - name: Install build and boot tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends debian-archive-keyring systemd-boot systemd-boot-efi \
            systemd-container erofs-utils dosfstools mtools e2fsprogs cpio zstd kmod bubblewrap cryptsetup-bin libcap-dev \
            qemu-system-x86 ovmf swtpm swtpm-tools
          # Ubuntu 24.04 confines user namespaces via AppArmor, which breaks mkosi's bubblewrap sandbox.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo git clone -q https://github.com/systemd/mkosi /opt/mkosi
          sudo git -C /opt/mkosi -c advice.detachedHead=false checkout -q 26673f65e17ae099bb0cf65928fe70c93b8a6a37  # v24.3
      - name: Disk adapter on a loop device (UPD-b3 (c1))
        # As root: a GPT on a loop device, the booted slot held by dm-verity (broker/apply/bootab).
        # A skipped test exits 0, so the step also requires the loop test's PASS line.
        shell: bash  # with pipefail, so tee keeps the test's exit status
        run: |
          (cd broker && go test -c -o "$RUNNER_TEMP/bootab.test" ./apply/bootab)
          sudo modprobe dm-verity
          sudo env AGENTOS_BOOTAB_LOOP=1 "$RUNNER_TEMP/bootab.test" -test.run '^TestLinux' -test.v -test.count=1 | tee "$RUNNER_TEMP/bootab.log"
          grep -q -- '^--- PASS: TestLinuxSlotsOnALoopDevice ' "$RUNNER_TEMP/bootab.log"
      # IMG-disk (#4317, #4366): each file system the job writes to (output and boot copies in
      # RUNNER_TEMP, mkosi's workspace in /var/tmp, GOCACHE in /tmp, mkosi's cache under /root) must
      # have DISK_NEED_GB free, or the job stops here with both numbers and the runner's cloud (from
      # its firmware vendor: the runner pool mixes AWS and Azure machines). A sampler then records the
      # use of those file systems every second, and "Disk budget held" fails a job whose growth went
      # over it, so a change that grows the build turns its own PR red instead of a later one.
      - name: Disk budget
        shell: bash
        run: |
          vendor=$(cat "${DMI_ID:-/sys/class/dmi/id}/sys_vendor" 2>/dev/null || true)
          case "$vendor" in
            "Amazon EC2"*) cloud=AWS;; "Microsoft Corporation"*) cloud=Azure;; *) cloud="unknown-cloud (${vendor:-no DMI vendor})";;
          esac
          df -BM --output=target "$RUNNER_TEMP" /var/tmp /tmp /root | tail -n +2 | sort -u > "$RUNNER_TEMP/disk.mounts"
          fail=0
          while read -r m; do
            have=$(( $(df -BM --output=avail "$m" | tail -n 1 | tr -dc 0-9) / 1024 ))
            echo "::notice title=disk budget::$cloud runner: image build needs $DISK_NEED_GB GB free on $m, runner has $have GB"
            # "Free runner disk" frees space on / only; a short mount of its own needs the build's writes moved.
            if [ "$m" = / ]; then fix='free more in "Free runner disk"'
            else fix="$m is its own file system, which \"Free runner disk\" does not free: move what every step of this job writes under $m to a directory on /, and put that directory in place of $m in this step's df line"; fi
            [ "$have" -ge "$DISK_NEED_GB" ] || { echo "::error title=disk budget::$cloud runner: image build needs $DISK_NEED_GB GB free on $m, runner has $have GB; $fix"; fail=1; }
          done < "$RUNNER_TEMP/disk.mounts"
          [ "$fail" = 0 ]
          # Used MB summed over those file systems (awk reads "1234M" as 1234).
          printf '%s\n' '#!/bin/sh' 'xargs -d "\n" df -BM --output=used < "$RUNNER_TEMP/disk.mounts" | awk "NR > 1 {s += \$1} END {print s}"' > "$RUNNER_TEMP/disk-used"
          chmod +x "$RUNNER_TEMP/disk-used"
          "$RUNNER_TEMP/disk-used" > "$RUNNER_TEMP/disk.base"
          nohup sh -c 'while :; do "$RUNNER_TEMP/disk-used" >> "$RUNNER_TEMP/disk.samples"; sleep 1; done' >/dev/null 2>&1 &
      - name: Build image
        shell: bash  # with pipefail, so tee keeps the build's exit status
        run: sudo env "PATH=$PATH" HOME=/root GOCACHE=/tmp/gocache MKOSI=/opt/mkosi/bin/mkosi image/build.sh "$RUNNER_TEMP/out" 2>&1 | tee "$RUNNER_TEMP/build.log"
      - name: Show the tree check's refusals
        # The tree check's refusals as annotations, so a tmpfiles.d line missing from
        # image/mkosi/tmpfiles.allow can be reviewed (and its entry copied) without the full log (#1543).
        # An annotation holds 4096 characters and a step 10 of each level, so allowlist misses are
        # shown as their bare entries after the other refusals, packed into chunks that each start with
        # the heading. A line the guarded-path check also refuses is not offered as an entry: it must
        # not be added (mkosi.finalize gives it none either).
        if: failure()
        run: |
          python3 -I - "$RUNNER_TEMP/build.log" <<'PY'
          import re, sys
          lines = [l.split("image check: ", 1)[1].rstrip("\n") for l in open(sys.argv[1], errors="replace")
                   if "image check: " in l]
          guarded = {m.group(1, 2) for m in (re.match(r"(.+?): line (\d+): ", l) for l in lines) if m}
          others, entries = [], []
          for l in lines:
              m = re.match(r"(.+?) line (\d+): not on the tmpfiles.d allowlist .*?; entry: (.*)$", l)
              if not m:
                  others.append(l)
              elif m.group(1, 2) not in guarded:
                  entries.append(m.group(3))
          def pack(lines, head=""):
              # Chunks of at most about 3500 characters, each starting with HEAD.
              chunks, cur = [], head
              for l in lines:
                  if cur != head and len(cur) + len(l) + 1 > 3500:
                      chunks.append(cur)
                      cur = head
                  cur += l[:3500] + "\n"
              return chunks + ([cur] if cur != head else [])
          chunks = pack(others) + pack(entries, "review each line, then add it to image/mkosi/tmpfiles.allow:\n")
          for i, c in enumerate(chunks[:30]):
              level = ("error", "warning", "notice")[i // 10]
              msg = c.rstrip("\n").replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print("::%s title=image check %d/%d::%s" % (level, i + 1, len(chunks), msg))
          PY
      - name: Build the end-to-end driver
        if: matrix.run == 'a'
        run: cd broker && CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/e2e/box-e2e" ./e2e/boxe2e
      # The vault process the e2e boot runs in place of the image's (image/e2e/agentos-egress.conf):
      # the same package built as image/build.sh does, plus the agentos_e2e tag that points its
      # Codex plan route at the driver's stub (#1701; broker/e2e/boxe2e/ASSUMPTIONS.md E10).
      - name: Build the end-to-end vault process
        if: matrix.run == 'a'
        run: cd broker && CGO_ENABLED=0 go build -tags agentos_e2e -trimpath -ldflags=-buildid= -o "$RUNNER_TEMP/e2e/agentos-egress" ./cmd/agentos-egress
      # The inbox slice the slice boot runs inside the image (A21, #3117; image/slice_boot.py).
      - name: Build the inbox slice
        if: matrix.run == 'a'
        run: cd broker && CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/slice/slice" ./clerk/inbox/cmd/slice
      # The device-driver slot's boot probe: a fixture driver under the driver template (#3590).
      - name: Build the device-driver slot's boot probe
        if: matrix.run == 'a'
        run: cd broker && for b in bootdriver bootprobe; do CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/devslot/$b" ./clerk/devslot/proc/testdata/$b; done
      # The IMAP connection process's boot probe: a stand-in under its shipped sandbox (#3015).
      - name: Build the IMAP connection process's boot probe
        if: matrix.run == 'a'
        run: cd broker && for b in bootconn bootprobe; do CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/imapconn/$b" ./clerk/inbox/imapconn/testdata/$b; done
      # The local inference service's real test the inference boot runs on the installed llama-server
      # and model (INFER-image, #3655): static, so it runs in the image as built here.
      - name: Build the inference real test
        if: matrix.run == 'a'
        run: cd broker && CGO_ENABLED=0 go test -c -tags infer_real,infer_llamacpp -trimpath -o "$RUNNER_TEMP/infer/infer.test" ./cmd/agentos-infer
      - name: Boot test (Secure Boot on), inbox slice, driver slot, IMAP connection process, inference and end-to-end run
        if: matrix.run == 'a'
        run: sudo env E2E="$RUNNER_TEMP/e2e" SLICE="$RUNNER_TEMP/slice" DEVSLOT="$RUNNER_TEMP/devslot" IMAPCONN="$RUNNER_TEMP/imapconn" INFER="$RUNNER_TEMP/infer" image/ci_boot.sh "$RUNNER_TEMP/out/agentos_$(jq -r .version "$RUNNER_TEMP"/out/*.release.json).raw" "$RUNNER_TEMP/boot"
      - name: Keep the console logs
        if: always() && matrix.run == 'a'
        run: |
          for l in console console-reboot console-two-drives console-fallback console-slice console-imapconn console-infer console-e2e; do
            sudo cp "$RUNNER_TEMP/boot/$l.log" "$RUNNER_TEMP/out/qemu-$l.log" || true
          done
      - name: Release record
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/rec"
          cp "$RUNNER_TEMP"/out/*.release.json "$RUNNER_TEMP"/out/SHA256SUMS "$RUNNER_TEMP"/out/*.manifest "$RUNNER_TEMP/rec/" || true
          cp "$RUNNER_TEMP"/out/*.usr.list "$RUNNER_TEMP/rec/" || true
          cp "$RUNNER_TEMP"/out/agentos.dpkg-status "$RUNNER_TEMP"/out/agentos.os-release "$RUNNER_TEMP/rec/" || true
          cp -R "$RUNNER_TEMP"/out/initrd "$RUNNER_TEMP/rec/" || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: release-${{ matrix.run }}
          path: ${{ runner.temp }}/rec
          if-no-files-found: warn
      # Compress, upload and the reproduce job still run after a failed boot or e2e step: an
      # end-to-end FAIL turns this job red, and must not also hide the image and the
      # reproducibility result (#1984). Only a cancelled run skips them.
      - name: Compress the image
        if: ${{ !cancelled() && matrix.run == 'a' }}
        run: sudo zstd -q -T0 -10 "$RUNNER_TEMP/out/agentos_$(jq -r .version "$RUNNER_TEMP"/out/*.release.json).raw" -o "$RUNNER_TEMP/out/agentos.raw.zst"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always() && matrix.run == 'a'
        with:
          name: agentos-image
          path: |
            ${{ runner.temp }}/out/agentos.raw.zst
            ${{ runner.temp }}/out/qemu-console*.log
          retention-days: 7
          if-no-files-found: warn
      # A peak that rose and fell between two samples is missed, so the check adds the largest rise
      # seen in one interval to the highest sample, and the job fails when that bound reaches
      # DISK_NEED_GB. The largest rise seen is only an estimate of such a peak: the budget's headroom
      # over the measured peak (24 GB over 15 GB in #4317) is the real cover, for a missed peak and
      # for the build's growth to come. Each part is rounded up to 0.1 GB and the bound is their sum,
      # so the printed numbers add up and never understate.
      - name: Disk budget held
        if: always()
        shell: bash
        run: |
          [ -s "$RUNNER_TEMP/disk.base" ] || { echo "disk budget: no baseline, the guard did not pass"; exit 0; }
          now=$("$RUNNER_TEMP/disk-used")
          [[ "$now" =~ ^[0-9]+$ ]] || { echo "::error title=disk budget::cannot read the disk use (got '$now'), so the budget is unchecked: df read none of the file systems the \"Disk budget\" notices list, or $RUNNER_TEMP/disk-used is gone; rerun the job, and if it fails again check that those mounts and that script still exist when the job ends"; exit 1; }
          echo "$now" >> "$RUNNER_TEMP/disk.samples"
          # Growth of the highest sample over the baseline, and the largest rise between two samples (MB).
          # An empty sample (one df that failed) is skipped; the final reading above always counts.
          read -r peak rise < <(awk -v b="$(cat "$RUNNER_TEMP/disk.base")" \
            'BEGIN {p = b; q = b} /^[0-9]+$/ {if ($1 > p) p = $1; if ($1 - q > r) r = $1 - q; q = $1} END {print p - b, r + 0}' "$RUNNER_TEMP/disk.samples")
          # In tenths of a GB, each rounded up.
          p=$(( (peak * 10 + 1023) / 1024 )); r=$(( (rise * 10 + 1023) / 1024 )); t=$(( p + r ))
          gb() { echo "$(( $1 / 10 )).$(( $1 % 10 ))"; }
          echo "::notice title=disk budget::the job grew its disk use by at most $(gb $t) GB of its $DISK_NEED_GB GB budget ($(gb $p) GB sampled, plus $(gb $r) GB, the largest rise in one sample interval, for a peak between samples)"
          [ "$t" -lt $(( DISK_NEED_GB * 10 )) ] || { echo "::error title=disk budget::image build may have used up to $(gb $t) GB, at or over its $DISK_NEED_GB GB budget; raise DISK_NEED_GB in .github/workflows/image.yml (the build job's env)"; exit 1; }
  reproduce:
    # Two runners, one commit: the release must match: the /usr root hash, every /usr file, the boot
    # entry, the kernel and both initrds (IMG-2). A differing initrd is listed member by member, and
    # a differing /usr file by path and field (#4059).
    # The whole-disk hash is reported too. Both package manifests must list packages.
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          path: rec
      - name: Compare
        run: |
          a=$(jq -r .usrhash rec/release-a/*.release.json); b=$(jq -r .usrhash rec/release-b/*.release.json)
          echo "usrhash a=$a"; echo "usrhash b=$b"
          diff rec/release-a/SHA256SUMS rec/release-b/SHA256SUMS && echo "every output identical" || true
          A=$(ls rec/release-a/*.release.json); B=$(ls rec/release-b/*.release.json)
          ok=1
          # Fails on a missing, empty or truncated manifest (#1474); prints each side's package count.
          python3 image/compare_manifests.py rec/release-a rec/release-b || ok=0
          # Every /usr file's hash and metadata (#4059): a differing file is named here.
          usrfiles=1; python3 image/compare_manifests.py --usr rec/release-a/*.usr.list rec/release-b/*.usr.list || { usrfiles=0; ok=0; }
          [ -n "$a" ] && [ "$a" = "$b" ] || { echo "MISMATCH /usr root hash"; ok=0
            [ $usrfiles = 0 ] || echo "  every /usr file alike: the erofs layout or an extended attribute differs, not a file's content or metadata"; }
          [ "$(jq -r .boot_entry.sha256 "$A")" = "$(jq -r .boot_entry.sha256 "$B")" ] \
            && echo "same boot entry" || { echo "MISMATCH boot entry"; ok=0; }
          for f in $(jq -r '.boot | keys[]' "$A"); do
            ha=$(jq -r --arg f "$f" '.boot[$f]' "$A"); hb=$(jq -r --arg f "$f" '.boot[$f] // ""' "$B")
            if [ -n "$ha" ] && [ "$ha" = "$hb" ]; then echo "same $f"
            else echo "MISMATCH $f"; ok=0
              case "$f" in *initrd) python3 image/compare_manifests.py --initrd "rec/release-a/initrd/$f" "rec/release-b/initrd/$f" || true;; esac
            fi
          done
          [ "$(jq '.boot | length' "$A")" -ge 2 ] || { echo "MISMATCH release.json lists no kernel and initrd"; ok=0; }
          [ $ok = 1 ]
  # Not named vulncheck: that is vulncheck.yml's required check.
  image-vulncheck:
    # SPEC EVL-5 (#2886): a known vulnerability in a Debian package the image ships fails unless
    # an open issue named in assurance/vulncheck.json (a record whose where is "image") records
    # why it is accepted. Build a's package list (mkosi.postinst), which vulncheck.py checks
    # against build a's mkosi manifest; the reproduce job checks b's manifest lists the same. The scanners and their pins are vulncheck.yml's, and the control
    # runs first, so a clean scan counts only because the same scanners caught every plant.
    # vulncheck.yml rescans main's latest image daily, for advisories published after a build.
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: read # --check-issues: each acceptance's issue must be open
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: release-a
          path: rec
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version: "1.26.10" # = broker/go.mod's toolchain line; checked below
          cache: false
      - name: Go is the toolchain go.mod names
        run: |
          want=$(awk '$1 == "toolchain" {print $2}' "$GITHUB_WORKSPACE/broker/go.mod")
          got=$(go version | awk '{print $3}')
          [ -n "$want" ] && [ "$got" = "$want" ] || { echo "Go is $got; broker/go.mod names $want" >&2; exit 1; }
      # Pinned versions, the same as vulncheck.yml's (tests/test_vulncheck.py checks).
      # Tried three times, as in vulncheck.yml (#3768).
      - name: Install govulncheck and osv-scanner
        run: |
          retry() {
            for t in 1 2 3; do
              "$@" && return
              echo "try $t of 3 failed: $*" >&2
              [ "$t" = 3 ] || sleep $((t * 15))
            done
            echo "::error::$* failed 3 times; the scan cannot run (#3768)"
            return 1
          }
          retry go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          retry go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.5.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Control (planted vulnerabilities, offline databases)
        run: python3 tools/vulncheck.py control
      - name: Known vulnerabilities in the image's packages (EVL-5)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/vulncheck.py image rec --check-issues --report image-vulncheck-report.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
