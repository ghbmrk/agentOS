name: trace
# Only this workflow writes TRACE.md (README.md Documents table). Package PRs never
# commit it, so it stops conflicting on every merge; ci.yml checks markers on a tree it
# regenerates itself, and once a day this workflow proposes the regenerated file as a PR
# (one PR for the day's merges instead of one per merge, which was ~18% of merged PRs).
# Same split as metrics.yml: generation runs with a read-only token; only the commit
# job can write, it runs no repository code, and it changes only TRACE.md.
# main requires status checks, so the commit job pushes the bot/trace branch and opens (or
# updates) its PR, which auto-merges once green.
on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: trace
  cancel-in-progress: false
jobs:
  generate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      trace: ${{ steps.gen.outputs.trace }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - name: Regenerate TRACE.md
        id: gen
        run: |
          python3 tools/trace.py
          echo "trace=$(base64 -w0 TRACE.md)" >> "$GITHUB_OUTPUT"
  commit:
    needs: generate
    runs-on: ubuntu-latest
    # BOT_PR_TOKEN lives in this environment, whose deployment-branch policy admits main
    # only, so branch workflows cannot read it (decision #1769).
    environment: bot
    permissions:
      contents: write # push the bot/trace branch (never main)
      pull-requests: write # open, auto-merge or close its PR
      actions: write # dispatch ci.yml on the branch
    env:
      # BOT_PR_TOKEN (optional; decision #1769): a token whose pushes start
      # pull_request workflows normally. Without it the job uses GITHUB_TOKEN as before.
      GH_TOKEN: ${{ secrets.BOT_PR_TOKEN || github.token }}
      BOT_TOKEN_SET: ${{ secrets.BOT_PR_TOKEN != '' }}
      BRANCH: bot/trace
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: main
          token: ${{ secrets.BOT_PR_TOKEN || github.token }}
      - name: Open or update the TRACE.md PR if changed
        env:
          TRACE_B64: ${{ needs.generate.outputs.trace }}
        run: |
          test -n "$TRACE_B64"
          printf '%s' "$TRACE_B64" | base64 -d > TRACE.md
          if git diff --quiet -- TRACE.md; then
            echo "TRACE.md unchanged"
            # main already matches: an open PR from an earlier run is obsolete.
            gh pr close "$BRANCH" --delete-branch 2>/dev/null || true
            exit 0
          fi
          test -z "$(git status --porcelain | grep -v ' TRACE.md$')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -qC "$BRANCH"
          git commit -qm "trace: regenerate TRACE.md for ${GITHUB_SHA::7}" -- TRACE.md
          # Rebuilt from main each run, so the PR stays up to date with main.
          git push -qf origin "HEAD:refs/heads/$BRANCH"
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create --base main --head "$BRANCH" --title "trace: regenerate TRACE.md" \
              --body "Regenerated by .github/workflows/trace.yml; changes only TRACE.md. ci.yml runs on it for the required checks."
          fi
          # Mark, 2026-10-10 (Decisions): bot PRs merge themselves once required checks pass.
          gh pr merge "$BRANCH" --auto --squash \
            || echo "::warning::auto-merge unavailable (repo setting 'Allow auto-merge'); merge the $BRANCH PR by hand"
          # A BOT_PR_TOKEN push already starts ci.yml's pull_request run. Only GITHUB_TOKEN
          # pushes start none, so only then dispatch it: its check runs land on the branch
          # head, where required checks look for them.
          if [ "$BOT_TOKEN_SET" != true ]; then gh workflow run ci.yml --ref "$BRANCH"; fi
