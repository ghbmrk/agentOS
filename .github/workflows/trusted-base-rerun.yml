name: trusted-base-rerun
# CI-ceiling-fall (#5174, D-310 rule 2): a trusted-base check passed against an older main goes
# stale when main changes. N open PRs that each fit the headroom would all stay green and land
# main up to (N-1) times it over a ceiling (tools/ceilings.txt), as happened at 58,895. On every
# push to main this reruns the newest trusted-base run on every open PR into main;
# trusted-base.yml checks out the base branch's live tip, so the rerun measures the PR merged
# onto the new main, and `trusted-base` is a required check. It reruns on every push rather than
# only when main's measure grows: a push that shrinks main can still raise another PR's merged
# measure (an identical cut both make, or a package one drops that the other links; L3 on #5179).
# A run whose job started before this push may have read the old main, so it is rerun once it
# completes. One whose job started later and passed checked out the new main and stands:
# rerunning it too kept armed PRs pending while the queue outlasted the gap between pushes
# (CI-rerun-fresh, #5222; #5203, attempts 1 to 11). A later one that failed, timed out or was
# cancelled is rerun as well. When no path matching `measured` (every path the check reads)
# changed since the newest successful run of this workflow (not the push's `before`: a later
# push's run can replace a pending one), nothing is rerun: no PR's measure can change, and a
# conflict such a push causes fails the check, which GitHub's merge refuses anyway. A compare
# that fails, lists 300 files or more, or is not `ahead` or `identical` (main was reset) reruns
# as before; grep reads the list without a pipe, so only its "no match" skips (#5224). An empty
# or malformed push time, a rerun or a listing that fails marks this job red, so a stale green
# is visible on main. With bursts of pushes GitHub cancels a
# pending run of this group; the run that replaces it reruns everything against a later main,
# so no push is lost. It checks out nothing and runs no repository or PR code; its token may
# rerun or cancel workflow runs and read PRs, nothing else. PRs that merge within one rerun's latency can
# still land together; main is then over the ceiling and the check stops further growth.
# CI-rerun-touch: a PR whose own files (its PR file list, renames' old names too) match no
# `measured` path, and none of whose files main has removed or renamed since the PR's merge base,
# is not rerun once its newest run passed. A clean merge then differs from main only in the PR's
# files (a path main moved could carry the PR's edit into a measured path, so it reruns; L3 on
# #5960), every path the check reads is main's on both sides, base and merged head measure the
# same, so no growth check (parsers, core lines, ceilings) can fire, and a check on the head alone
# reads main's own state, which the PR neither adds to nor fixes. A run that failed, timed out or
# was cancelled is rerun as before. A conflict fails the check, as above, and GitHub's merge
# refuses that anyway. A listing that fails, a PR list of 3000 lines or more, or a compare that
# fails or lists 300 files or more reruns as before. 8 of 18 open PRs on 2026-11-16 changed no
# measured path.
# CI-cancel-stale-sha (#6529): a rerun this workflow starts on a PR's head goes stale when the PR moves on before a
# runner picks it up; it has its own `run-<id>` group (CI-cancel-superseded), so the new head's run never cancels it.
# Before rerunning, the first step cancels, by run id, each queued or pending trusted-base `pull_request_target` run
# whose PRs are all open and whose sha is no open PR's head (any base), re-reading the run just before. The runs are
# listed before the heads, so a head is never older than the run it is compared with. A failed listing or an
# unreadable head cancels nothing and only warns, so the reruns go ahead; only ids, shas and PR numbers that passed
# their pattern are printed. The attempt number does not matter: a waiting run of any attempt on a stale sha is
# cancelled, and a run on an open PR's current head, whatever its attempt or state, never is. The step is
# continue-on-error (CI-cancel-stale-sha-fu, #6531): a failed cancel step never fails the job or skips the reruns.
# tests/test_trusted_base.py pins every line below and runs the script.
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: trusted-base-rerun
  cancel-in-progress: false
jobs:
  rerun:
    name: trusted-base-rerun
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: write # rerun or cancel trusted-base runs, nothing else
      contents: read # compare main's commits
      pull-requests: read
    steps:
      - name: Cancel waiting trusted-base attempts on no open PR's head
        shell: bash
        continue-on-error: true # a failed cancel never fails the job or skips the reruns below
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          waiting=""
          for s in queued pending; do
            w=$(gh api --paginate "repos/$REPO/actions/workflows/trusted-base.yml/runs?event=pull_request_target&status=$s&per_page=100" --jq '.workflow_runs[] | "\(.id) \(.head_sha) \([.pull_requests[].number] | join(","))"') || { echo "::warning::cannot list $s trusted-base runs; nothing cancelled"; exit 0; }
            waiting="$waiting$w"$'\n'
          done
          heads=$(gh api --paginate "repos/$REPO/pulls?state=open&per_page=100" --jq '.[] | "\(.number) \(.head.sha)"') || { echo "::warning::cannot list open PRs; nothing cancelled"; exit 0; }
          if grep -Evq '^[1-9][0-9]* [0-9a-f]{40}$' <<< "$heads"; then echo "::warning::an open PR's head is unreadable; nothing cancelled"; exit 0; fi
          cancelled=0
          while read -r id sha nums; do
            [[ $id =~ ^[1-9][0-9]*$ && $sha =~ ^[0-9a-f]{40}$ && $nums =~ ^[1-9][0-9]*(,[1-9][0-9]*)*$ ]] || continue
            ! grep -q " $sha\$" <<< "$heads" || continue
            open=1
            for n in ${nums//,/ }; do grep -q "^$n " <<< "$heads" || open=0; done
            [ "$open" = 1 ] || continue
            now=$(gh api "repos/$REPO/actions/runs/$id" --jq 'select(.status == "queued" or .status == "pending") | "\(.head_sha) \([.pull_requests[].number] | join(","))"') || { echo "::warning::run $id not re-read; left alone"; continue; }
            [ "$now" = "$sha $nums" ] || continue
            if gh api -X POST "repos/$REPO/actions/runs/$id/cancel" > /dev/null; then echo "cancelled run $id ($sha, PR $nums): no open PR's head"; cancelled=$((cancelled + 1)); else echo "::warning::cancel of run $id refused"; fi
          done <<< "$waiting"
          printf '\n%s\n' "Cancelled $cancelled waiting trusted-base attempt(s) on no open PR's head." | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Rerun every open PR's newest trusted-base run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ROUNDS: 50
          WAIT: 30
        run: |
          prs=$(gh api --paginate "repos/$REPO/pulls?state=open&base=main&per_page=100" --jq '.[] | "\(.number) \(.head.sha)"') || { echo "::error::cannot list open PRs"; exit 1; }
          since=$(gh api "repos/$REPO/actions/runs/$GITHUB_RUN_ID" --jq .created_at) && [[ $since =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]] || { echo "::error::cannot read this run's start"; exit 1; }
          measured='^(broker/|decisions/|(SPEC|DECISIONS)\.md$|\.gitattributes$|\.github/workflows/trusted-base\.yml$|tools/(trusted_base\.py|trusted_base_parsers\.txt|trusted_base_reasons\.txt|trusted_core\.txt|ceilings\.txt|old_core\.txt)$)'
          last=$(gh api "repos/$REPO/actions/workflows/trusted-base-rerun.yml/runs?branch=main&event=push&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // ""') || { echo "::error::cannot list this workflow's runs"; exit 1; }
          if [[ $last =~ ^[0-9a-f]{40}$ ]] && changed=$(gh api "repos/$REPO/compare/$last...$GITHUB_SHA" --jq 'if (.status == "ahead" or .status == "identical") and (.files | length) < 300 then (.files[] | .filename, (.previous_filename // empty)) else "broker/" end') && { grep -Eq "$measured" <<< "$changed"; [ $? = 1 ]; }; then
            printf '\n%s\n' "No path the check reads changed since $last; nothing rerun." | tee -a "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          failed=0 reran=0 missed=""
          pending="$prs" quiet=" " skipped=0
          while read -r pr sha; do
            [ -n "$pr" ] || continue
            if files=$(gh api --paginate "repos/$REPO/pulls/$pr/files?per_page=100" --jq '.[] | .filename, (.previous_filename // empty)') && [ "$(grep -c . <<< "$files")" -lt 3000 ] && { grep -Eq "$measured" <<< "$files"; [ $? = 1 ]; } && moved=$(gh api "repos/$REPO/compare/$sha...$GITHUB_SHA" --jq 'if (.files | length) < 300 then (.files[] | if .status == "removed" then .filename else (.previous_filename // empty) end) else error("300 files or more") end') && { [ -z "$moved" ] || { grep -Fxq -f <(printf '%s\n' "$moved") <<< "$files"; [ $? = 1 ]; }; }; then
              quiet="$quiet$pr "
            else
              echo "#$pr: its files may reach a path the check reads (or could not be listed); rerun as usual"
            fi
          done <<< "$prs"
          for round in $(seq 1 "$ROUNDS"); do
            [ -n "$pending" ] || break
            left=""
            while read -r pr sha; do
              [ -n "$pr" ] || continue
              run=$(gh api "repos/$REPO/actions/workflows/trusted-base.yml/runs?head_sha=$sha&event=pull_request_target&per_page=1" --jq '.workflow_runs[0] | select(. != null) | "\(.id) \(.status)"') || { echo "::warning::#$pr: cannot list runs"; failed=1; missed="$missed #$pr"; continue; }
              if [ -z "$run" ]; then
                echo "#$pr: no trusted-base run yet; its first run reads the new main"
              elif [ "${run#* }" = completed ]; then
                fresh=$(gh api "repos/$REPO/actions/runs/${run% *}/jobs" --jq "if ([.jobs[] | if .conclusion == \"success\" then .started_at else null end] | min) > \"$since\" then \"fresh\" else \"\" end") || { echo "::warning::#$pr: cannot list the jobs of ${run% *}"; failed=1; missed="$missed #$pr"; continue; }
                if [ -n "$fresh" ]; then echo "#$pr: ${run% *} started after this push and passed, so it measured the new main"
                elif [[ $quiet == *" $pr "* ]] && passed=$(gh api "repos/$REPO/actions/runs/${run% *}/jobs" --jq 'if (.jobs | length) > 0 and all(.jobs[]; .conclusion == "success") then "passed" else "" end') && [ -n "$passed" ]; then echo "#$pr: changes no path the check reads and ${run% *} passed, so its merged measure is main's; not rerun"; skipped=$((skipped + 1))
                elif gh api -X POST "repos/$REPO/actions/runs/${run% *}/rerun" > /dev/null; then echo "#$pr: reran ${run% *}"; reran=$((reran + 1)); else echo "::warning::#$pr: rerun of ${run% *} refused"; failed=1; missed="$missed #$pr"; fi
              else
                left="$left$pr $sha"$'\n'
              fi
            done <<< "$pending"
            pending="$left"
            [ -z "$pending" ] || sleep "$WAIT"
          done
          while read -r pr sha; do
            [ -n "$pr" ] || continue
            echo "::warning::#$pr ($sha): still running after the last round, not rerun"; failed=1; missed="$missed #$pr"
          done <<< "$pending"
          total=$(printf '%s' "$prs" | grep -c . || true)
          msg="Reran $reran of $total open PRs' trusted-base runs."
          [ "$skipped" = 0 ] || msg="$msg $skipped change no path the check reads and passed, so they were not rerun."
          [ -z "$missed" ] || msg="$msg Not rerun:$missed (rerun their trusted-base check by hand; tools/ASSUMPTIONS.md CI-ceiling-fall)."
          printf '\n%s\n' "$msg" | tee -a "$GITHUB_STEP_SUMMARY"
          exit "$failed"
