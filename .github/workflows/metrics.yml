name: metrics
# L4 inputs (PLAN.md §2, §5): regenerate METRICS.md weekly, just before the Sunday 06:00
# (UTC-4) plan-week reset, and on demand. Only this workflow writes METRICS.md.
# Runs only from main (schedule and dispatch never run PR code), with no third-party
# action beyond the pinned checkout; the write token is scoped to this one job.
on:
  schedule:
    - cron: "30 9 * * 0" # Sunday 09:30 UTC = 05:30 UTC-4
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: metrics
  cancel-in-progress: false
jobs:
  metrics:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit METRICS.md
      pull-requests: read # L3 verdicts and Defect lines
      actions: read # run attempts for the flake rate
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0 # TRACE.md and BOARD.md history
      - name: Regenerate METRICS.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/metrics.py --ref origin/main
      - name: Commit if changed
        run: |
          git diff --quiet -- METRICS.md && { echo "METRICS.md unchanged"; exit 0; }
          test "$(git status --porcelain | grep -v ' METRICS.md$' | wc -l)" = 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qm "metrics: weekly METRICS.md" -- METRICS.md
          git pull -q --rebase origin main && git push origin HEAD:main
