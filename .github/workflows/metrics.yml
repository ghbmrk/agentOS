name: metrics
# L4 inputs (PLAN.md §2, §5): regenerate METRICS.md daily (D-085 convergence measures; the
# plan week resets Sunday 06:00 UTC-4, so the 05:30 run on Sunday closes the week), and
# on demand. Only this workflow writes METRICS.md.
# Runs only from main (schedule and dispatch never run PR code), with no third-party
# action beyond the pinned checkout. Collection runs with a read-only token; only the
# commit job can write, and it runs no repository code.
on:
  schedule:
    - cron: "30 9 * * *" # daily 09:30 UTC = 05:30 UTC-4
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: metrics
  cancel-in-progress: false
jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # L3 verdicts and Defect lines
      actions: read # run attempts for the flake rate
    outputs:
      metrics: ${{ steps.gen.outputs.metrics }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0 # TRACE.md and BOARD.md history
          persist-credentials: false
      - name: Regenerate METRICS.md
        id: gen
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 tools/metrics.py --ref HEAD
          echo "metrics=$(base64 -w0 METRICS.md)" >> "$GITHUB_OUTPUT"
  commit:
    needs: collect
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit METRICS.md
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Commit METRICS.md if changed
        env:
          METRICS_B64: ${{ needs.collect.outputs.metrics }}
        run: |
          test -n "$METRICS_B64"
          printf '%s' "$METRICS_B64" | base64 -d > METRICS.md
          git diff --quiet -- METRICS.md && { echo "METRICS.md unchanged"; exit 0; }
          test -z "$(git status --porcelain | grep -v ' METRICS.md$')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qm "metrics: daily METRICS.md" -- METRICS.md
          git pull -q --rebase origin main && git push origin HEAD:main
