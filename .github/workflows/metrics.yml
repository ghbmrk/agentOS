name: metrics
# L4 inputs (PLAN.md §2, §5): regenerate METRICS.md daily (D-085 convergence measures; the
# plan week resets Sunday 06:00 UTC-4, so the 05:30 run on Sunday closes the week), and
# on demand. Only this workflow writes METRICS.md.
# Runs only from main (schedule and dispatch never run PR code), with no third-party
# action beyond the pinned checkout and artifact actions. Collection runs with a read-only token; only the
# commit job can write, and it runs no repository code. main requires status checks, so
# it pushes the bot/metrics branch, opens (or updates) its PR and dispatches ci.yml
# there; the PR auto-merges once green.
on:
  schedule:
    - cron: "30 9 * * *" # daily 09:30 UTC = 05:30 UTC-4
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: metrics
  cancel-in-progress: false
jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # L3 verdicts and Defect lines
      actions: read # run attempts for the flake rate
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0 # TRACE.md and BOARD.md history
          persist-credentials: false
      - name: Regenerate METRICS.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 tools/metrics.py --ref HEAD
      # The artifact is also the proof premerge --bot checks the PR against (MAIN-PROT-3, #757):
      # only this run's jobs can upload it, so it carries what main's code generated.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: metrics
          path: METRICS.md
          retention-days: 2
          if-no-files-found: error
  commit:
    needs: collect
    runs-on: ubuntu-latest
    # BOT_PR_TOKEN lives in this environment, whose deployment-branch policy admits main
    # only, so branch workflows cannot read it (decision #1769).
    environment: bot
    permissions:
      contents: write # push the bot/metrics branch (never main)
      pull-requests: write # open, auto-merge or close its PR
      actions: write # dispatch ci.yml on the branch
    env:
      # BOT_PR_TOKEN (optional; decision #1769): a token whose pushes start
      # pull_request workflows normally. Without it the job uses GITHUB_TOKEN as before.
      GH_TOKEN: ${{ secrets.BOT_PR_TOKEN || github.token }}
      BOT_TOKEN_SET: ${{ secrets.BOT_PR_TOKEN != '' }}
      BRANCH: bot/metrics
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: main
          token: ${{ secrets.BOT_PR_TOKEN || github.token }}
      # Outside the checkout, so the artifact can place nothing but the copied METRICS.md in it.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: metrics
          path: ${{ runner.temp }}/metrics
      - name: Open or update the METRICS.md PR if changed
        run: |
          cp "$RUNNER_TEMP/metrics/METRICS.md" METRICS.md
          if git diff --quiet -- METRICS.md; then
            echo "METRICS.md unchanged"
            # main already matches: an open PR from an earlier run is obsolete.
            gh pr close "$BRANCH" --delete-branch 2>/dev/null || true
            exit 0
          fi
          test -z "$(git status --porcelain | grep -v ' METRICS.md$')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -qC "$BRANCH"
          # Bot-Run names this run, whose artifact premerge --bot compares the PR with (MAIN-PROT-3, #757).
          git commit -qm "metrics: daily METRICS.md" -m "Bot-Run: $GITHUB_RUN_ID" -- METRICS.md
          # Rebuilt from main each run, so the PR stays up to date with main.
          git push -qf origin "HEAD:refs/heads/$BRANCH"
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create --base main --head "$BRANCH" --title "metrics: daily METRICS.md" \
              --body "Regenerated by .github/workflows/metrics.yml; changes only METRICS.md. ci.yml is dispatched on this branch for the required checks."
          fi
          # Mark, 2026-10-10 (Decisions): bot PRs merge themselves once required checks pass.
          gh pr merge "$BRANCH" --auto --squash \
            || echo "::warning::auto-merge unavailable (repo setting 'Allow auto-merge'); merge the $BRANCH PR by hand"
          # A BOT_PR_TOKEN push already starts ci.yml's pull_request run. Only GITHUB_TOKEN
          # pushes start none, so only then dispatch it: its check runs land on the branch
          # head, where required checks look for them.
          if [ "$BOT_TOKEN_SET" != true ]; then gh workflow run ci.yml --ref "$BRANCH"; fi
