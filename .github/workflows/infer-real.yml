name: infer-real
# INFER-llama (G4, #3654): the llama.cpp adapter against the real llama-server and real model
# files. The pins are in broker/cmd/agentos-infer/llama.pins. Each file is downloaded, checked
# against its pin and refused on a mismatch before anything runs; llama-server is built from the
# pinned source by image/llamaserver.sh, the build the image ships (INFER-image, #3655); the test
# then runs the adapter under the tags infer_real and infer_llamacpp. It runs only when the adapter, the
# service, the protocol or the pins change, or on demand. ci.yml compiles the same tests on
# every change (go vet -tags infer_real,infer_llamacpp), so a break to them shows there first.
on:
  pull_request:
    paths:
      - broker/cmd/agentos-infer/**
      - broker/infer/**
      - broker/childproc/**
      - image/llamaserver.sh
      - .github/workflows/infer-real.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  GOTOOLCHAIN: local
jobs:
  real:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version: "1.26.10" # = broker/go.mod's toolchain line; checked below
          cache: false
      - name: Go is the toolchain go.mod names
        run: |
          want=$(awk '$1 == "toolchain" {print $2}' "$GITHUB_WORKSPACE/broker/go.mod")
          got=$(go version | awk '{print $3}')
          [ -n "$want" ] && [ "$got" = "$want" ] || { echo "Go is $got; broker/go.mod names $want" >&2; exit 1; }
      - name: Build llama-server from the pinned source
        run: sh image/llamaserver.sh "$RUNNER_TEMP/llama/server" "$RUNNER_TEMP/llama/build"
      - name: The release tag and the pinned source are the pinned commit
        run: |
          # The archive's pax header is inside the download it vouches for, so a substituted archive
          # could keep it. Instead rebuild the archive from the pinned commit fetched over git, as
          # GitHub makes it (git archive, gzip -n), and require the hash llamaserver.sh checked.
          pins=broker/cmd/agentos-infer/llama.pins
          pin() { sed -n "s/^$1=//p" "$pins"; }
          url=$(pin llama_src_url); want=$(pin llama_src_sha256); commit=$(pin llama_src_commit)
          echo "$url" | grep -Eqx 'https://github\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+/archive/refs/tags/[A-Za-z0-9_.-]+\.tar\.gz' ||
            { echo "::error file=$pins::llama_src_url is not a GitHub tag archive: $url"; exit 1; }
          repo=${url%/archive/refs/tags/*}; tag=${url##*/archive/refs/tags/}; tag=${tag%.tar.gz}
          # An annotated tag's peeled line (^{}) is the commit; a lightweight tag has only the one line.
          refs=$(git ls-remote "$repo" "refs/tags/$tag" "refs/tags/$tag^{}")
          got=$(echo "$refs" | awk -v r="refs/tags/$tag^{}" '$2 == r {print $1}')
          [ -n "$got" ] || got=$(echo "$refs" | awk -v r="refs/tags/$tag" '$2 == r {print $1}')
          echo "tag $tag: commit $got (pinned: $commit)"
          [ -n "$got" ] && [ "$got" = "$commit" ] || { echo "::error file=$pins::llama_src_commit is '$commit'; the tag $tag names $got"; exit 1; }
          g="$RUNNER_TEMP/llama-git"
          git init -q "$g"
          git -C "$g" fetch -q --depth 1 "$repo" "$commit"
          [ "$(git -C "$g" rev-parse FETCH_HEAD)" = "$commit" ] || { echo "the fetch is not $commit" >&2; exit 1; }
          got=$(git -C "$g" archive --format=tar --prefix="${repo##*/}-$tag/" FETCH_HEAD | gzip -cn | sha256sum | cut -d' ' -f1)
          echo "commit $commit rebuilt as an archive: sha256 $got (pinned: $want)"
          [ "$got" = "$want" ] || { echo "::error file=$pins::llama_src_sha256 is '$want'; commit $commit's tree archives to $got"; exit 1; }
      - name: Download the pinned model, check its hash
        run: |
          pins=broker/cmd/agentos-infer/llama.pins
          pin() { sed -n "s/^$1=//p" "$pins"; }
          d="$RUNNER_TEMP/llama"
          url=$(pin embed_url); want=$(pin embed_sha256)
          curl -fsSL --retry 3 --retry-delay 5 -o "$d/embed.gguf" "$url"
          got=$(sha256sum "$d/embed.gguf" | cut -d' ' -f1)
          echo "embed: $url"
          echo "embed: sha256 $got (pinned: $want)"
          if [ "$got" != "$want" ]; then
            echo "::error file=$pins::embed_sha256 pin is '$want'; the download hashes to $got"
            exit 1
          fi
          {
            echo "AGENTOS_LLAMA_SERVER=$d/server/llama-server"
            echo "AGENTOS_LLAMA_EMBED_MODEL=$d/embed.gguf"
            echo "AGENTOS_LLAMA_EMBED_SHA256=$want"
          } >> "$GITHUB_ENV"
      - name: llama-server runs here
        run: '"$AGENTOS_LLAMA_SERVER" --version'
      - name: The real runtime (embed)
        working-directory: broker
        run: |
          go test -count=1 -timeout 30m -tags infer_real,infer_llamacpp -run 'TestRealRuntime' -v ./cmd/agentos-infer | tee "$RUNNER_TEMP/real.log"
          # A renamed test or an unset variable must not pass by running nothing.
          grep -q -- '^--- PASS: TestRealRuntimeEmbed ' "$RUNNER_TEMP/real.log" || { echo "TestRealRuntimeEmbed did not pass" >&2; exit 1; }
