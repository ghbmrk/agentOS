name: drone-sitl
# The drone key-holder against ArduPilot Copter SITL (DRONE-sim, #3516, brief
# decision 3): nightly, and on a pull request that touches the drone package,
# its main, its pin or this file. SITL is built at the commit
# broker/drone/sitl/ardupilot.pin names, with the signed-only patch, and cached
# by the hash of the pin, the patch and the build script. The tests carry the
# `sitl` build tag and fail, never skip, without the binary. Normal CI runs the
# package's unit tests without SITL.
on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "broker/drone/**"
      - "broker/cmd/agentos-drone/**"
      - ".github/workflows/drone-sitl.yml"
permissions:
  contents: read
concurrency:
  group: drone-sitl-${{ github.ref }}
  cancel-in-progress: true
env:
  GOTOOLCHAIN: local
jobs:
  sitl:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
        working-directory: broker
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version: "1.26.10" # = broker/go.mod's toolchain line; checked below
          cache: false
      - name: Go is the toolchain go.mod names
        run: |
          want=$(awk '$1 == "toolchain" {print $2}' go.mod)
          got=$(go version | awk '{print $3}')
          [ -n "$want" ] && [ "$got" = "$want" ] || { echo "Go is $got; go.mod names $want" >&2; exit 1; }
      - name: SITL cache key
        id: key
        run: |
          h=$(cat drone/sitl/ardupilot.pin drone/sitl/ardupilot-signed-only.patch drone/sitl/build.sh | sha256sum | cut -c1-32)
          echo "key=arducopter-sitl-$h" >> "$GITHUB_OUTPUT"
      - name: Restore SITL
        id: cache
        uses: actions/cache/restore@d4323d4df104b026a6aa633fdb11d772146be0bf  # v4.2.2
        with:
          path: ~/sitl
          key: ${{ steps.key.outputs.key }}
      - name: Build SITL at the pin
        if: steps.cache.outputs.cache-hit != 'true'
        run: drone/sitl/build.sh "$HOME/sitl"
      - name: Save SITL
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@d4323d4df104b026a6aa633fdb11d772146be0bf  # v4.2.2
        with:
          path: ~/sitl
          key: ${{ steps.key.outputs.key }}
      - name: What was built
        run: cat "$HOME/sitl/BUILD"
      - name: SITL tests
        run: |
          export AGENTOS_SITL_BIN="$HOME/sitl/arducopter" AGENTOS_SITL_DEFAULTS="$HOME/sitl/copter.parm"
          go test -tags sitl -count=1 -p 1 -timeout 60m -v ./drone/...
