name: g1-freeze
# Gate freeze (G1-freeze #1687, D-128): a PR that touches paths outside a gate list whose
# freeze is on fails (G1: tools/g1_scope.txt, off since G1 passed; G2: tools/g1_scope_g2.txt,
# until A4, A5, A9 and A14 pass on a VM), unless it was opened before that list's `since`
# time (and its timeline shows no reopen, force-push or retarget since then, #1717), is an
# `exempt-pr` line, or changes only records. It runs on pull_request_target, so
# the workflow file, tools/g1_scope.py and the lists are the BASE commit's: a PR cannot widen
# a list, flip the switch, move `since` or exempt itself, and no PR code runs in this job.
# A plain Re-run replays the old event (old base); a push or title/body edit re-reads it. The PR head is only fetched
# as git objects for `git diff --name-only`; it is never checked out, imported or executed.
# The PR's timeline is read with a read-only token and handed to the script as event/time data.
# A base without tools/g1_scope.py (before #1687 merges) passes: there is no freeze yet.
# Main must require the `g1-freeze` check for a failure to block a merge (a ruleset change).
# A freeze lifts through `freeze off` in its list, not by editing this file.
# MQ-wire (merge queue, 2026-10-17): on a merge-queue commit the gate is not rerun; the queue
# step passes only when the queued PR's head is unchanged and its own `g1-freeze` run there passed.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
  merge_group:
permissions:
  contents: read
jobs:
  g1-freeze:
    name: g1-freeze
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read # the PR's timeline (#1717)
      pull-requests: read
      checks: read # merge queue: the queued PR's own g1-freeze run
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        if: github.event_name == 'pull_request_target'
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0 # the merge base with the PR head
          persist-credentials: false
      - name: G1 freeze (base copy of tools/g1_scope.py)
        if: github.event_name == 'pull_request_target'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_CREATED: ${{ github.event.pull_request.created_at }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f tools/g1_scope.py ]; then echo "g1 freeze: not active on this base"; exit 0; fi
          # The base copy decides: one older than #1717 takes no timeline and keeps its own rules.
          timeline=()
          if grep -q -- "--timeline" tools/g1_scope.py; then
            gh api --paginate "repos/$REPO/issues/$PR_NUMBER/timeline" \
              --jq '.[] | [(.event // ""), (.created_at // "")] | @tsv' > "$RUNNER_TEMP/timeline.tsv"
            timeline=(--timeline "$RUNNER_TEMP/timeline.tsv")
          fi
          git fetch --no-tags origin "+refs/pull/$PR_NUMBER/head:refs/remotes/pr/head"
          git cat-file -e "$HEAD_SHA^{commit}"
          python3 -I tools/g1_scope.py --git "$BASE_SHA" "$HEAD_SHA" --pr "$PR_NUMBER" --pr-created "$PR_CREATED" \
            "${timeline[@]}"
      - name: Merge queue (the queued PR's own g1-freeze run)
        if: github.event_name == 'merge_group'
        env:
          QUEUE_REF: ${{ github.event.merge_group.head_ref }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # gh-readonly-queue/<base>/pr-<number>-<the PR head the queue merged>
          [[ "$QUEUE_REF" =~ ^refs/heads/gh-readonly-queue/.+/pr-([0-9]+)-([0-9a-f]{40})$ ]]
          n=${BASH_REMATCH[1]}
          sha=${BASH_REMATCH[2]}
          head=$(gh api "repos/$REPO/pulls/$n" --jq .head.sha)
          got=$(gh api "repos/$REPO/commits/$sha/check-runs?check_name=g1-freeze&per_page=100" \
            --jq '[.check_runs[] | select(.app.slug == "github-actions")] | sort_by(.started_at) | last | .conclusion // "missing"')
          echo "g1-freeze queue: PR #$n head $sha (now $head) g1-freeze $got"
          [ "$head" = "$sha" ] && [ "$got" = success ]
