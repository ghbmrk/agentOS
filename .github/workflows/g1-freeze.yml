name: g1-freeze
# G1-freeze (#1687): until G1-e2e (#1688) passes in QEMU, a PR that touches paths outside
# the G1 list (tools/g1_scope.txt) fails, unless tools/g1_scope_exempt.txt exempts it or it
# changes only records. It runs on pull_request_target, so the workflow file,
# tools/g1_scope.py and both lists are the BASE commit's: a PR cannot widen the list, flip
# the switch or exempt itself, and no PR code runs in this job. The PR head is only fetched
# as git objects for `git diff --name-only`; it is never checked out, imported or executed.
# A base without tools/g1_scope.py (before #1687 merges) passes: there is no freeze yet.
# Main must require the `g1-freeze` check for a failure to block a merge (a ruleset change).
# The freeze lifts through `freeze off` in tools/g1_scope.txt, not by editing this file.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
permissions:
  contents: read
jobs:
  g1-freeze:
    name: g1-freeze
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0 # the merge base with the PR head
          persist-credentials: false
      - name: G1 freeze (base copy of tools/g1_scope.py)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BRANCH: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [ ! -f tools/g1_scope.py ]; then echo "g1 freeze: not active on this base"; exit 0; fi
          git fetch --no-tags origin "+refs/pull/$PR_NUMBER/head:refs/remotes/pr/head"
          git cat-file -e "$HEAD_SHA^{commit}"
          python3 -I tools/g1_scope.py --git "$BASE_SHA" "$HEAD_SHA" --pr "$PR_NUMBER" --pr-branch "$PR_BRANCH" --pr-title "$PR_TITLE"
