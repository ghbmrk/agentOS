name: keycheck
# KEY-diff (#2933, SPEC §19 risk 32): assurance/keycheck/ is a second key check, in Rust, written from
# SPEC KEY-1..KEY-8 rather than from broker/kernel/key. broker/test/keydiff builds keys, steps and
# log views with the Go library and fails on any verdict the two disagree on. A PR runs a
# fixed sweep plus a sweep from a seed no earlier run used; the daily run sweeps further.
on:
  pull_request:
    paths:
      - "assurance/keycheck/**"
      - "broker/test/keydiff/**"
      - "broker/kernel/key/**"
      - "broker/go.mod"
      - ".github/workflows/keycheck.yml"
  push:
    branches: [main]
    paths:
      - "assurance/keycheck/**"
      - "broker/test/keydiff/**"
      - "broker/kernel/key/**"
      - "broker/go.mod"
      - ".github/workflows/keycheck.yml"
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
permissions:
  contents: read
env:
  GOWORK: "off" # = ci.yml: a go.work cannot change what a Go command here loads
jobs:
  keycheck:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version: "1.26.10" # = broker/go.mod's toolchain line, as in ci.yml
          cache: false
      - name: keycheck builds, lints and passes its own tests
        working-directory: assurance/keycheck
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
          cargo build --locked --release
      - name: The Go library and keycheck agree
        working-directory: broker
        env:
          KEYCHECK: ${{ github.workspace }}/assurance/keycheck/target/release/keycheck
          CASES: ${{ github.event_name == 'schedule' && '400000' || '60000' }}
          RUN: ${{ github.run_id }}
        run: |
          KEYDIFF_CASES=20000 go test -count=1 -run '^TestKeyDiff$' ./test/keydiff/
          KEYDIFF_FROM=$(( (RUN % 100000) * 1000000 )) KEYDIFF_CASES=$CASES go test -count=1 -timeout 25m -run '^TestKeyDiff$' ./test/keydiff/
      - name: The sweep reaches every predicate the library checks
        # #2989: each library mutant drops one predicate of broker/kernel/key
        # and must be caught by a disagreement with keycheck.
        working-directory: broker
        env:
          KEYCHECK: ${{ github.workspace }}/assurance/keycheck/target/release/keycheck
          KEYDIFF_REACH: "1"
        run: go test -count=1 -timeout 20m -run '^TestPredicateReach$' ./test/keydiff/
