name: lane-gate
# CTRL-lane-gate (docs/LANES.md): a PR in a lane with a tier limit (codex: tier C) fails when
# its change is rated above that limit. It runs on pull_request_target, so the workflow file
# and tools/risk_tier.py (with broker/core/core.txt) are the BASE commit's: a PR cannot delete,
# skip or loosen the gate, and no PR code runs in this job. The PR head is only fetched as git
# objects for `git diff --name-only`; it is never checked out, imported or executed. A base
# without the gate's flags fails the job (fail closed). Main must require the `lane-gate`
# check for a failure to block a merge (a ruleset change, Mark's or a coordinator worker's).
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
# CI-cancel-superseded (#5345, #5348): a PR's first-attempt run cancels that PR's older first
# attempts, so a superseded head never holds the queue. A rerun (attempt 2 or later) and every push,
# merge-queue, schedule or dispatch run is a group of its own (run id), so it never cancels or
# replaces the current head's run.
concurrency:
  group: ${{ github.workflow }}-${{ startsWith(github.event_name, 'pull_request') && github.run_attempt == 1 && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ startsWith(github.event_name, 'pull_request') && github.run_attempt == 1 }}
permissions:
  contents: read
jobs:
  lane-gate:
    name: lane-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0 # the merge base with the PR head
          persist-credentials: false
      - name: Lane gate (base copy of tools/risk_tier.py)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BRANCH: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          git fetch --no-tags origin "+refs/pull/$PR_NUMBER/head:refs/remotes/pr/head"
          git cat-file -e "$HEAD_SHA^{commit}"
          python3 -I tools/risk_tier.py --git "$BASE_SHA" "$HEAD_SHA" --pr-branch "$PR_BRANCH" --pr-title "$PR_TITLE"
