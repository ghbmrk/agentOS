name: mutgate
# REV-CHK-mut (#3899, briefs/REV-CHK.md) and REV-PROOF-mut (#4908): the mutation gate (tools/mutgate.py,
# #1814) on every pull request. A PR fails when a mutant lives on one of a tier-A or tier-B broker
# package's target lines: the lines it adds or changes in the package's non-test .go files, or, when
# it changes only the package's tests, the lines its changed test functions run. The tests run that
# line but do not check it. The one exception is a `Mutant-equivalent: <path>:<line> <reason>` line
# in the PR body for that site, which the reviewer checks; the body reaches the gate through env as
# text, read by the base's tool. Gremlins runs only on those packages (`mutgate.py claimed`), and
# only on their target lines (`run --git`), split into K shards a package, one job each (#4961): the
# `plan` job counts each package's targets, times its suite (#5069) and picks K, so no job runs past its timeout, and measures a
# test-only package's covered lines once for every shard to read (#4970). Every mutant
# runs alone with the whole suite, so a shard gives each of its mutants the verdict one job would. Gremlins has no mutator that deletes a
# statement, so `delete` deletes each statement holding one of those lines alone, on parallel
# workers, and adds its verdict to gremlins' JSON (#4573, #4603, #4633). A PR that changes no such
# package runs no gremlins and passes. The `mutgate` job is the one result to read, and its step
# summary holds one table of every mutant on a target line and its verdict.
# The `plan` and `mutants` jobs run the PR's own Go tests, which can write anything in that job (the
# JSON, tools/, $GITHUB_ENV), so they only hand on data: plan the matrix, mutants gremlins' JSON as an
# artifact. K is only a schedule: `verify` refuses a package whose shards are missing or overlap. No job that decides
# runs PR code or the PR's copy of the gate: `claimed` and `mutgate` replace tools/ and
# broker/core/core.txt (the tier list risk_tier reads) with the base commit's before running
# them, and `mutgate` reruns `run`'s checks on the artifact with `verify` (#4106), which builds the
# base's statement lister (standard library only) to recount the deletion sites (#4602).
# The body is the event's: a waiver added to the body later counts from the next push.
on:
  pull_request:
permissions:
  contents: read
# CI-cancel-superseded (#5345, #5348, #5361): a PR's first-attempt run cancels that PR's older first
# attempts, so a superseded head never holds the queue. A rerun (attempt 2 or later) and every push,
# merge-queue, schedule or dispatch run is a group of its own (run id), so it never cancels or
# replaces the current head's run.
concurrency:
  group: ${{ github.workflow }}-${{ startsWith(github.event_name, 'pull_request') && github.run_attempt == 1 && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ startsWith(github.event_name, 'pull_request') && github.run_attempt == 1 }}
env:
  GOTOOLCHAIN: local
  GOWORK: "off"
jobs:
  # CI-mutgate-head-guard (#5409): a rerun keeps its event, so it can test a head the PR has left.
  # This job reads the PR's head from the API and, when the run's head is older, ends with a notice
  # and skips `claimed`; the `mutgate` job then fails, so a run that gated nothing never passes.
  head:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      current: ${{ steps.head.outputs.current }}
    steps:
      - name: This run's head is the PR's current head
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          now=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq .head.sha) || { echo "::error::cannot read the PR's head"; exit 1; }
          [[ "$now" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::the PR's head is not a sha: $now"; exit 1; }
          if [ "$now" = "$RUN_HEAD" ]; then echo "current=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "::notice::this run's head $RUN_HEAD is not the PR's current head $now: no gate runs; the current head's own run decides"
          echo "current=false" >> "$GITHUB_OUTPUT"
  claimed:
    needs: head
    if: ${{ needs.head.outputs.current == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      packages: ${{ steps.claimed.outputs.packages }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0 # the diff reads the base commit
      # The merge commit's first parent is the base it was built on; the event's base sha can be
      # older, and then main's own later lines would count as this PR's (#3948).
      - name: The base this merge commit was built on
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          [ "$(git rev-parse HEAD^2)" = "$PR_HEAD" ] || { echo "::error::HEAD is not the merge of this PR's head"; exit 1; }
          echo "BASE=$(git rev-parse HEAD^1)" >> "$GITHUB_ENV"
      # The gate's code and the tier list it reads are the base's: removed first, so a file the PR
      # adds under tools/ (a module risk_tier would import) does not survive, and written by
      # git archive, which reads the base tree's attributes, not the PR's .gitattributes (#4106).
      - name: The base copy of the gate
        run: |
          rm -rf tools broker/core/core.txt
          git archive "$BASE" tools broker/core/core.txt | tar -x
      - name: Tier-A and tier-B packages this PR changes
        id: claimed
        run: |
          pkgs=$(python3 -I tools/mutgate.py claimed --git "$BASE" --json)
          echo "$pkgs"
          echo "packages=$pkgs" >> "$GITHUB_OUTPUT"
  plan:
    needs: claimed
    if: ${{ needs.claimed.outputs.packages != '[]' }}
    runs-on: ubuntu-24.04
    # A test-only diff's targets are the lines its changed tests cover, so the plan runs them (#4961).
    timeout-minutes: 15
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version: "1.26.11" # = broker/go.mod's toolchain line; checked below
          cache: false
      - name: Go is the toolchain go.mod names
        run: |
          want=$(awk '$1 == "toolchain" {print $2}' "$GITHUB_WORKSPACE/broker/go.mod")
          got=$(go version | awk '{print $3}')
          [ -n "$want" ] && [ "$got" = "$want" ] || { echo "Go is $got; broker/go.mod names $want" >&2; exit 1; }
      # The merge commit's first parent is the base it was built on; the event's base sha can be
      # older, and then main's own later lines would count as this PR's (#3948).
      - name: The base this merge commit was built on
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          [ "$(git rev-parse HEAD^2)" = "$PR_HEAD" ] || { echo "::error::HEAD is not the merge of this PR's head"; exit 1; }
          echo "BASE=$(git rev-parse HEAD^1)" >> "$GITHUB_ENV"
      # loops' canary-round test runs tools/canary.py, whose targets run as the runner's first
      # subordinate id in a user namespace (tools/ASSUMPTIONS.md D13); gremlins' coverage run
      # needs it as broker-race does. Kept equal to ci.yml's step by tests/test_workflows.py.
      - name: Subordinate ids for the canary sandbox
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          command -v newuidmap && command -v newgidmap || sudo apt-get install -yq uidmap
          grep -qE "^($(id -un)|$(id -u)):" /etc/subuid || sudo usermod --add-subuids 100000-165535 "$(id -un)"
          grep -qE "^($(id -un)|$(id -u)):" /etc/subgid || sudo usermod --add-subgids 100000-165535 "$(id -un)"
      - name: dnsmasq for the enforcer's resolver tests (ENF-f, #3664)
        run: sudo apt-get update -q && sudo apt-get install -yq dnsmasq-base
      - name: Shards for each package (#4961)
        id: plan
        run: |
          shards=$(python3 -I tools/mutgate.py plan --git "$BASE" --targets-out "$RUNNER_TEMP/targets.json")
          echo "$shards"
          echo "shards=$shards" >> "$GITHUB_OUTPUT"
      # A test-only package's target lines, from the plan's one coverage run, for every shard to read:
      # coverage can differ from run to run, and shards that each measured it disagreed on #4970.
      # Data like the shards' JSON: the deciding job still refuses shards whose records differ.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: mutgate-plan
          path: ${{ runner.temp }}/targets.json
          if-no-files-found: error
          retention-days: 7
  mutants:
    # Names the failed shard in the checks list (#4983), counted from 0 as the gate's messages count shards.
    name: mutants ${{ matrix.pkg }} shard ${{ matrix.shard }} of ${{ matrix.of }}
    needs: [claimed, plan]
    if: ${{ needs.claimed.outputs.packages != '[]' }}
    runs-on: ubuntu-24.04
    # One shard of one package per job (#4961), so a slow package does not hold the others.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version: "1.26.11" # = broker/go.mod's toolchain line; checked below
          cache: false
      - name: Go is the toolchain go.mod names
        run: |
          want=$(awk '$1 == "toolchain" {print $2}' "$GITHUB_WORKSPACE/broker/go.mod")
          got=$(go version | awk '{print $3}')
          [ -n "$want" ] && [ "$got" = "$want" ] || { echo "Go is $got; broker/go.mod names $want" >&2; exit 1; }
      # Pinned as tools/mutgate.py's docstring says; the Go checksum database verifies the fetch.
      # A proxy read can fail mid-stream (#3768), so it is tried three times, then the job fails.
      - name: Install gremlins
        run: |
          for t in 1 2 3; do
            go install github.com/go-gremlins/gremlins/cmd/gremlins@v0.6.0 && break
            echo "try $t of 3 failed" >&2
            [ "$t" = 3 ] && { echo "::error::gremlins install failed 3 times; the gate cannot run"; exit 1; }
            sleep $((t * 15))
          done
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      # The merge commit's first parent is the base it was built on; the event's base sha can be
      # older, and then main's own later lines would count as this PR's (#3948).
      - name: The base this merge commit was built on
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          [ "$(git rev-parse HEAD^2)" = "$PR_HEAD" ] || { echo "::error::HEAD is not the merge of this PR's head"; exit 1; }
          echo "BASE=$(git rev-parse HEAD^1)" >> "$GITHUB_ENV"
      # loops' canary-round test runs tools/canary.py, whose targets run as the runner's first
      # subordinate id in a user namespace (tools/ASSUMPTIONS.md D13); gremlins' coverage run
      # needs it as broker-race does. Kept equal to ci.yml's step by tests/test_workflows.py.
      - name: Subordinate ids for the canary sandbox
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          command -v newuidmap && command -v newgidmap || sudo apt-get install -yq uidmap
          grep -qE "^($(id -un)|$(id -u)):" /etc/subuid || sudo usermod --add-subuids 100000-165535 "$(id -un)"
          grep -qE "^($(id -un)|$(id -u)):" /etc/subgid || sudo usermod --add-subgids 100000-165535 "$(id -un)"
      - name: dnsmasq for the enforcer's resolver tests (ENF-f, #3664)
        run: sudo apt-get update -q && sudo apt-get install -yq dnsmasq-base
      # Outside the workspace, so the result directory and the PR tree hold no copy (#4970).
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: mutgate-plan
          path: ${{ runner.temp }}/plan
      - name: Gremlins on the package
        env:
          PKG: ${{ matrix.pkg }}
          SHARD: ${{ matrix.shard }}
          OF: ${{ matrix.of }}
        run: >-
          python3 -I tools/mutgate.py run "$PKG" --out mutants --git "$BASE" --shard "$SHARD" --of "$OF"
          --targets "$RUNNER_TEMP/plan/targets.json"
      - name: Statement deletions on the package (#4573)
        env:
          PKG: ${{ matrix.pkg }}
        run: python3 -I tools/mutgate.py delete "$PKG" --out mutants --git "$BASE"
      - name: Survivors
        run: python3 -I tools/mutgate.py report mutants
      # Data for the `mutgate` job, which decides; nothing here after the gremlins step is trusted.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: mutants-${{ strategy.job-index }}
          path: mutants/
          if-no-files-found: error
          retention-days: 7
  mutgate:
    needs: [claimed, plan, mutants]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: The claim ran and every claimed package passed
        env:
          CLAIMED: ${{ needs.claimed.result }}
          PLAN: ${{ needs.plan.result }}
          MUTANTS: ${{ needs.mutants.result }}
          PACKAGES: ${{ needs.claimed.outputs.packages }}
        run: |
          echo "claimed: $CLAIMED ($PACKAGES); plan: $PLAN; mutants: $MUTANTS"
          [ "$CLAIMED" = success ] || exit 1
          # This job does not run in a cancelled run, so a cancelled shard is one GitHub stopped at its
          # timeout-minutes: no verdict, not a survivor (#5069).
          if [ "$MUTANTS" = cancelled ]; then
            echo "::error::a mutants shard timed out at its 60-minute limit (the cancelled job in the checks list), so it gave no verdict; no mutant was shown to survive. Rerun the failed jobs; if the same shard times out again, the plan's per-shard budgets in tools/mutgate.py are too large for that package."
            exit 1
          fi
          if [ "$PACKAGES" = "[]" ]; then [ "$PLAN$MUTANTS" = skippedskipped ]; else [ "$PLAN$MUTANTS" = successsuccess ]; fi
      # A fresh runner where no PR code has run. The PR tree is read only as data: its diff and file names.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        if: ${{ needs.claimed.outputs.packages != '[]' }}
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: The base this merge commit was built on
        if: ${{ needs.claimed.outputs.packages != '[]' }}
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          [ "$(git rev-parse HEAD^2)" = "$PR_HEAD" ] || { echo "::error::HEAD is not the merge of this PR's head"; exit 1; }
          echo "BASE=$(git rev-parse HEAD^1)" >> "$GITHUB_ENV"
      # Go builds the base's statement lister, which reads the PR's files as data, so verify can
      # list the deletion sites itself (#4602). Before the download, so no artifact stands in for it.
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        if: ${{ needs.claimed.outputs.packages != '[]' }}
        with:
          go-version: "1.26.11" # = the mutants job's, so both list the same sites
          cache: false
      # Before the base copy is written, so nothing an artifact unpacks can stand in for it.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        if: ${{ needs.claimed.outputs.packages != '[]' }}
        with:
          pattern: mutants-*
          path: ${{ runner.temp }}/mutants
      - name: The base copy of the gate
        if: ${{ needs.claimed.outputs.packages != '[]' }}
        run: |
          rm -rf tools broker/core/core.txt
          git archive "$BASE" tools broker/core/core.txt | tar -x
      # Each artifact lands in its own directory. verify recomputes the claim from the diff, needs
      # exactly one readable result for each shard of each claimed package across them, rechecks each
      # as `run` does, needs one deletion verdict per site it lists, joins the shards, then gates: the
      # JSON is data, never a verdict.
      # The PR body is data: it reaches the tool through env and a file, never the script's text.
      - name: Gate (MUT-tierA)
        if: ${{ needs.claimed.outputs.packages != '[]' }}
        env:
          RESULTS: ${{ runner.temp }}/mutants
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"
          python3 -I tools/mutgate.py verify "$RESULTS" --git "$BASE" --body "$RUNNER_TEMP/pr-body.md" --summary "$GITHUB_STEP_SUMMARY"
