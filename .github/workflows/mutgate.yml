name: mutgate
# REV-CHK-mut (#3899, briefs/REV-CHK.md) and REV-PROOF-mut (#4908): the mutation gate (tools/mutgate.py,
# #1814) on every pull request. A PR fails when a mutant lives on one of a tier-A or tier-B broker
# package's target lines: the lines it adds or changes in the package's non-test .go files, or, when
# it changes only the package's tests, the lines its changed test functions run. The tests run that
# line but do not check it. The one exception is an entry for that mutant in its package's
# MUTANTS-EQUIVALENT record (#5776, #5792, #5828), which the reviewer checks; the PR body waives nothing
# (#6379), since it can change after a review without changing the head. Gremlins runs only on those packages (`mutgate.py claimed`), and
# only on their target lines (`run --git`), split into K shards a package, one job each (#4961): the
# `plan` job counts each package's targets, times its suite (#5069) and picks K, so no job runs past its timeout, and measures a
# test-only package's covered lines once for every shard to read (#4970). Every mutant
# runs alone with the whole suite, so a shard gives each of its mutants the verdict one job would. Gremlins has no mutator that deletes a
# statement, so `delete` deletes each statement holding one of those lines alone, on parallel
# workers, and adds its verdict to gremlins' JSON (#4573, #4603, #4633). A package is also claimed
# when the PR changes its MUTANTS-EQUIVALENT record, which `verify` resolves and whose new entries the
# summary lists for review (#5786, #5812). A PR that changes no such package passes from the `claimed` job alone (#6401). The `mutgate` job is the one result to read, and its step
# summary holds one table of every mutant on a target line and its verdict.
# The `plan` and `mutants` jobs run the PR's own Go tests, which can write anything in that job (the
# JSON, tools/, $GITHUB_ENV), so they only hand on data: plan the matrix, mutants gremlins' JSON as an
# artifact. K is only a schedule: `verify` refuses a package whose shards are missing or overlap. No job that decides
# runs PR code or the PR's copy of the gate: `claimed` and `mutgate` replace tools/ and
# broker/core/core.txt (the tier list risk_tier reads) with the base commit's before running
# them, and `mutgate` reruns `run`'s checks on the artifact with `verify` (#4106), which builds the
# base's statement lister (standard library only) to recount the deletion sites (#4602).
# CI-mutgate-after-ci (#6569): ci.yml's `mutgate` job calls this workflow on a pull request once every other
# ci job passed on the head, so a head whose ci fails spends no mutgate runner. Its jobs run inside ci's run
# (named `mutgate / <job>`) under ci's per-PR concurrency group, which cancels a superseded head's run; a
# group here would share ci's name and wait on it. Main's ruleset does not require these jobs, so
# tools/premerge.py holds the merge until `mutgate / claimed` succeeded in ci's run and no `mutgate / ` job
# failed: a mutgate skipped because ci failed never reads as a pass.
on:
  workflow_call:
permissions:
  contents: read
env:
  GOTOOLCHAIN: local
  GOWORK: "off"
  # Every apt-get call passes $APT_OPTS, so a stalled mirror fails in minutes, not at the job
  # timeout (CI-apt-timeout, #6581; tests/test_workflows.py checks each call).
  APT_OPTS: "-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
  # MUT-swtpm-runner (#5896): the TPM tests fail rather than skip if swtpm is missing, as in
  # broker-race, so a mutant only they kill (seal.Unlock's TPM paths) cannot live in the gate.
  AGENTOS_REQUIRE_SWTPM: "1"
jobs:
  # CI-mutgate-zero-target-fast (#6401): the first job reads the PR's head, then claims, so a PR that
  # claims no package passes from one runner slot: `plan`, `mutants` and the `mutgate` job all skip, and
  # a skipped job does not fail the run. The `mutgate` job skips only when this job succeeded and printed
  # a literal `[]`; a claim that failed, timed out or printed anything else runs it, and it fails. A run
  # of a head the PR has left (a rerun keeps its event, #5409) fails here, so it never passes.
  claimed:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      packages: ${{ steps.claimed.outputs.packages }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      # #5409 (L3): "Re-run failed jobs" copies a succeeded job's result from attempt 1, so each job
      # that runs PR tests or decides reads the PR's head itself, first, and fails on an older one.
      - name: This run's head is still the PR's current head
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          now=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq .head.sha) || { echo "::error::cannot read the PR's head"; exit 1; }
          [[ "$now" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::the PR's head is not a sha: $now"; exit 1; }
          [ "$now" = "$RUN_HEAD" ] || { echo "::error::this run's head $RUN_HEAD is not the PR's current head $now: a rerun of an old head gates nothing; the current head's own run decides"; exit 1; }
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0 # the diff reads the base commit
      # The merge commit's first parent is the base it was built on; the event's base sha can be
      # older, and then main's own later lines would count as this PR's (#3948).
      - name: The base this merge commit was built on
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          [ "$(git rev-parse HEAD^2)" = "$PR_HEAD" ] || { echo "::error::HEAD is not the merge of this PR's head"; exit 1; }
          echo "BASE=$(git rev-parse HEAD^1)" >> "$GITHUB_ENV"
      # The gate's code and the tier list it reads are the base's: removed first, so a file the PR
      # adds under tools/ (a module risk_tier would import) does not survive, and written by
      # git archive, which reads the base tree's attributes, not the PR's .gitattributes (#4106).
      - name: The base copy of the gate
        run: |
          rm -rf tools broker/core/core.txt
          git archive "$BASE" tools broker/core/core.txt | tar -x
      - name: Tier-A and tier-B packages this PR changes
        id: claimed
        run: |
          pkgs=$(python3 -I tools/mutgate.py claimed --git "$BASE" --json)
          echo "$pkgs"
          [[ "$pkgs" =~ ^\[[^$'\n']*\]$ ]] || { echo "::error::the claim printed no one-line list"; exit 1; }
          echo "packages=$pkgs" >> "$GITHUB_OUTPUT"
          if [ "$pkgs" = "[]" ]; then echo "No tier-A or tier-B package changed: mutgate passes with no plan and no shards." >> "$GITHUB_STEP_SUMMARY"; fi
  plan:
    needs: claimed
    if: ${{ needs.claimed.outputs.packages != '[]' }}
    runs-on: ubuntu-24.04
    # A test-only diff's targets are the lines its changed tests cover, so the plan runs them (#4961):
    # at most three whole-suite coverage runs of each such package, one after another. enforcer/nft's took
    # 374 s each on #6144, about 19 minutes alone; 35 holds that with headroom (#6155).
    timeout-minutes: 35
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      # #5409 (L3): "Re-run failed jobs" copies a succeeded job's result from attempt 1, so each job
      # that runs PR tests or decides reads the PR's head itself, first, and fails on an older one.
      - name: This run's head is still the PR's current head
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          now=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq .head.sha) || { echo "::error::cannot read the PR's head"; exit 1; }
          [[ "$now" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::the PR's head is not a sha: $now"; exit 1; }
          [ "$now" = "$RUN_HEAD" ] || { echo "::error::this run's head $RUN_HEAD is not the PR's current head $now: a rerun of an old head gates nothing; the current head's own run decides"; exit 1; }
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version: "1.26.11" # = broker/go.mod's toolchain line; checked below
          cache: false
      - name: Go is the toolchain go.mod names
        run: |
          want=$(awk '$1 == "toolchain" {print $2}' "$GITHUB_WORKSPACE/broker/go.mod")
          got=$(go version | awk '{print $3}')
          [ -n "$want" ] && [ "$got" = "$want" ] || { echo "Go is $got; broker/go.mod names $want" >&2; exit 1; }
      # The merge commit's first parent is the base it was built on; the event's base sha can be
      # older, and then main's own later lines would count as this PR's (#3948).
      - name: The base this merge commit was built on
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          [ "$(git rev-parse HEAD^2)" = "$PR_HEAD" ] || { echo "::error::HEAD is not the merge of this PR's head"; exit 1; }
          echo "BASE=$(git rev-parse HEAD^1)" >> "$GITHUB_ENV"
      # loops' canary-round test runs tools/canary.py, whose targets run as the runner's first
      # subordinate id in a user namespace (tools/ASSUMPTIONS.md D13); gremlins' coverage run
      # needs it as broker-race does. Kept equal to ci.yml's step by tests/test_workflows.py.
      - name: Subordinate ids for the canary sandbox
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          command -v newuidmap && command -v newgidmap || sudo apt-get $APT_OPTS install -yq uidmap
          grep -qE "^($(id -un)|$(id -u)):" /etc/subuid || sudo usermod --add-subuids 100000-165535 "$(id -un)"
          grep -qE "^($(id -un)|$(id -u)):" /etc/subgid || sudo usermod --add-subgids 100000-165535 "$(id -un)"
      - name: dnsmasq for the enforcer's resolver tests (ENF-f, #3664)
        run: sudo apt-get $APT_OPTS update -q && sudo apt-get $APT_OPTS install -yq dnsmasq-base
      # The seal TPM tests run on swtpm; broker-race's step, kept equal by tests/test_workflows.py.
      - name: Software TPM for the trusted-host slot (P2-4b)
        run: sudo apt-get $APT_OPTS update -q && sudo apt-get $APT_OPTS install -yq swtpm
      # MUT-memcap-cgroup (#6392): every mutant's and baseline's test run goes in a cgroup v2 leaf of this
      # delegated directory (memory.max, no swap, a group OOM kill, memory.peak); mutgate fails in CI
      # without it. The steps that run mutgate move their shell into main/ first, which takes root.
      - name: A delegated cgroup for the mutation runs (#6392)
        run: |
          sudo mkdir /sys/fs/cgroup/mutgate /sys/fs/cgroup/mutgate/main
          echo +memory | sudo tee /sys/fs/cgroup/mutgate/cgroup.subtree_control > /dev/null
          sudo chown -R "$(id -u):$(id -g)" /sys/fs/cgroup/mutgate
          echo "AGENTOS_MUTGATE_CGROUP=/sys/fs/cgroup/mutgate" >> "$GITHUB_ENV"
      - name: Shards for each package (#4961)
        id: plan
        run: |
          echo $$ | sudo tee /sys/fs/cgroup/mutgate/main/cgroup.procs > /dev/null
          shards=$(python3 -I tools/mutgate.py plan --git "$BASE" --targets-out "$RUNNER_TEMP/targets.json")
          echo "$shards"
          echo "shards=$shards" >> "$GITHUB_OUTPUT"
      # A test-only package's target lines, from the plan's one coverage run, for every shard to read:
      # coverage can differ from run to run, and shards that each measured it disagreed on #4970.
      # Data like the shards' JSON: the deciding job still refuses shards whose records differ.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: mutgate-plan
          path: ${{ runner.temp }}/targets.json
          if-no-files-found: error
          retention-days: 7
  mutants:
    # Names the failed shard in the checks list (#4983), counted from 0 as the gate's messages count shards.
    # Past 256 shards a job runs several (#6170): "shard 3, 151 of 296".
    name: mutants ${{ matrix.pkg }} shard ${{ matrix.shards }} of ${{ matrix.of }}
    needs: [claimed, plan]
    if: ${{ needs.claimed.outputs.packages != '[]' }}
    runs-on: ubuntu-24.04
    # One shard of one package per job (#4961), so a slow package does not hold the others; past GitHub's
    # 256 jobs a matrix, up to 5 shards of one package a job (#6170, tools/mutgate.py pack). Each shard stops at its
    # own 60 minutes (the step below); the job's limit is 60 a shard plus 15 for setup, a backstop.
    timeout-minutes: ${{ matrix.minutes }}
    strategy:
      fail-fast: false
      # CI-mutgate-cap: the runner pool ran 6 to 9 jobs at once while jobs stayed queued
      # (2026-11-15, 13:40-14:27Z), and one plan can ask for 32 shards (#5817). 3 is half the
      # floor of 6, so one run's shards leave the other half to the rest of CI. A held shard is
      # queued only when another ends, so later runs' short jobs reach runners in between.
      max-parallel: 3
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.shards) }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      # #5409 (L3): "Re-run failed jobs" copies a succeeded job's result from attempt 1, so each job
      # that runs PR tests or decides reads the PR's head itself, first, and fails on an older one.
      - name: This run's head is still the PR's current head
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          now=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq .head.sha) || { echo "::error::cannot read the PR's head"; exit 1; }
          [[ "$now" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::the PR's head is not a sha: $now"; exit 1; }
          [ "$now" = "$RUN_HEAD" ] || { echo "::error::this run's head $RUN_HEAD is not the PR's current head $now: a rerun of an old head gates nothing; the current head's own run decides"; exit 1; }
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version: "1.26.11" # = broker/go.mod's toolchain line; checked below
          cache: false
      - name: Go is the toolchain go.mod names
        run: |
          want=$(awk '$1 == "toolchain" {print $2}' "$GITHUB_WORKSPACE/broker/go.mod")
          got=$(go version | awk '{print $3}')
          [ -n "$want" ] && [ "$got" = "$want" ] || { echo "Go is $got; broker/go.mod names $want" >&2; exit 1; }
      # Pinned as tools/mutgate.py's docstring says; the Go checksum database verifies the fetch.
      # A proxy read can fail mid-stream (#3768), so it is tried three times, then the job fails.
      - name: Install gremlins
        run: |
          for t in 1 2 3; do
            go install github.com/go-gremlins/gremlins/cmd/gremlins@v0.6.0 && break
            echo "try $t of 3 failed" >&2
            [ "$t" = 3 ] && { echo "::error::gremlins install failed 3 times; the gate cannot run"; exit 1; }
            sleep $((t * 15))
          done
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      # The merge commit's first parent is the base it was built on; the event's base sha can be
      # older, and then main's own later lines would count as this PR's (#3948).
      - name: The base this merge commit was built on
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          [ "$(git rev-parse HEAD^2)" = "$PR_HEAD" ] || { echo "::error::HEAD is not the merge of this PR's head"; exit 1; }
          echo "BASE=$(git rev-parse HEAD^1)" >> "$GITHUB_ENV"
      # loops' canary-round test runs tools/canary.py, whose targets run as the runner's first
      # subordinate id in a user namespace (tools/ASSUMPTIONS.md D13); gremlins' coverage run
      # needs it as broker-race does. Kept equal to ci.yml's step by tests/test_workflows.py.
      - name: Subordinate ids for the canary sandbox
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          command -v newuidmap && command -v newgidmap || sudo apt-get $APT_OPTS install -yq uidmap
          grep -qE "^($(id -un)|$(id -u)):" /etc/subuid || sudo usermod --add-subuids 100000-165535 "$(id -un)"
          grep -qE "^($(id -un)|$(id -u)):" /etc/subgid || sudo usermod --add-subgids 100000-165535 "$(id -un)"
      - name: dnsmasq for the enforcer's resolver tests (ENF-f, #3664)
        run: sudo apt-get $APT_OPTS update -q && sudo apt-get $APT_OPTS install -yq dnsmasq-base
      # The seal TPM tests run on swtpm; broker-race's step, kept equal by tests/test_workflows.py.
      - name: Software TPM for the trusted-host slot (P2-4b)
        run: sudo apt-get $APT_OPTS update -q && sudo apt-get $APT_OPTS install -yq swtpm
      # MUT-memcap-cgroup (#6392): every mutant's and baseline's test run goes in a cgroup v2 leaf of this
      # delegated directory (memory.max, no swap, a group OOM kill, memory.peak); mutgate fails in CI
      # without it. The steps that run mutgate move their shell into main/ first, which takes root.
      - name: A delegated cgroup for the mutation runs (#6392)
        run: |
          sudo mkdir /sys/fs/cgroup/mutgate /sys/fs/cgroup/mutgate/main
          echo +memory | sudo tee /sys/fs/cgroup/mutgate/cgroup.subtree_control > /dev/null
          sudo chown -R "$(id -u):$(id -g)" /sys/fs/cgroup/mutgate
          echo "AGENTOS_MUTGATE_CGROUP=/sys/fs/cgroup/mutgate" >> "$GITHUB_ENV"
      # Outside the workspace, so the result directory and the PR tree hold no copy (#4970).
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: mutgate-plan
          path: ${{ runner.temp }}/plan
      - name: Gremlins and statement deletions on the package (#4573)
        # A shard at a time, each into its own directory, mutants/<index>/, which the deciding job reads,
        # and each stopped at its own 60 minutes for gremlins and its deletions together (#6170).
        env:
          PKG: ${{ matrix.pkg }}
          SHARDS: ${{ matrix.shards }}
          OF: ${{ matrix.of }}
        run: |
          for s in ${SHARDS//,/ }; do
            [[ "$s" =~ ^[0-9]+$ ]] || { echo "::error::shard $s is not an index"; exit 1; }
            echo $$ | sudo tee /sys/fs/cgroup/mutgate/main/cgroup.procs > /dev/null
            end=$((SECONDS + 3600)) rc=0
            timeout -k 30 3600 python3 -I tools/mutgate.py run "$PKG" --out "mutants/$s" --git "$BASE" --shard "$s" --of "$OF" \
              --targets "$RUNNER_TEMP/plan/targets.json" || rc=$?
            if [ "$rc" = 0 ]; then
              left=$((end - SECONDS))
              if [ "$left" -gt 0 ]; then
                timeout -k 30 "$left" python3 -I tools/mutgate.py delete "$PKG" --out "mutants/$s" --git "$BASE" || rc=$?
              else
                rc=124
              fi
            fi
            if [ "$rc" = 124 ] || [ "$rc" = 137 ]; then
              echo "::error::shard $s of $OF of $PKG passed its 60-minute limit, so it gave no verdict; no mutant was shown to survive. Rerun the failed jobs; if shard $s times out again, the plan's per-shard budgets in tools/mutgate.py are too large for $PKG."
            fi
            [ "$rc" = 0 ] || exit "$rc"
          done
      - name: Survivors
        env:
          SHARDS: ${{ matrix.shards }}
        run: |
          for s in ${SHARDS//,/ }; do
            python3 -I tools/mutgate.py report "mutants/$s"
          done
      # Data for the `mutgate` job, which decides; nothing here after the gremlins step is trusted.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: mutants-${{ strategy.job-index }}
          path: mutants/
          if-no-files-found: error
          retention-days: 7
  mutgate:
    needs: [claimed, plan, mutants]
    if: ${{ !cancelled() && (needs.claimed.result != 'success' || needs.claimed.outputs.packages != '[]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      # #5409 (L3): "Re-run failed jobs" copies a succeeded job's result from attempt 1, so each job
      # that runs PR tests or decides reads the PR's head itself, first, and fails on an older one.
      - name: This run's head is still the PR's current head
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          now=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq .head.sha) || { echo "::error::cannot read the PR's head"; exit 1; }
          [[ "$now" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::the PR's head is not a sha: $now"; exit 1; }
          [ "$now" = "$RUN_HEAD" ] || { echo "::error::this run's head $RUN_HEAD is not the PR's current head $now: a rerun of an old head gates nothing; the current head's own run decides"; exit 1; }
      - name: The claim ran and every claimed package passed
        env:
          CLAIMED: ${{ needs.claimed.result }}
          PLAN: ${{ needs.plan.result }}
          MUTANTS: ${{ needs.mutants.result }}
          PACKAGES: ${{ needs.claimed.outputs.packages }}
        run: |
          echo "claimed: $CLAIMED ($PACKAGES); plan: $PLAN; mutants: $MUTANTS"
          [ "$CLAIMED" = success ] || exit 1
          # This job does not run in a cancelled run, so a cancelled plan or shard is one GitHub stopped at its
          # timeout-minutes: no verdict, not a survivor (#5069, #6155).
          if [ "$PLAN" = cancelled ]; then
            echo "::error::the plan job timed out at its 35-minute limit, so no package was planned and no mutant ran; nothing was shown to survive. Rerun the failed jobs; if the rerun times out again, raise the plan job's timeout-minutes in .github/workflows/mutgate.yml (a test-only change to a slow package runs its suite at most three times there, #6155)."
            exit 1
          fi
          if [ "$MUTANTS" = cancelled ]; then
            echo "::error::a mutants job timed out at its job limit (60 minutes for each shard it runs, plus 15 for setup; the cancelled job in the checks list), so it gave no verdict; no mutant was shown to survive. A shard past its own 60 minutes fails instead, with an error naming it, so this was the job's setup or the limit's slack. Rerun the failed jobs; if the same job times out again, raise SETUP_MINUTES in tools/mutgate.py."
            exit 1
          fi
          [ "$PLAN$MUTANTS" = successsuccess ]
      # A fresh runner where no PR code has run. The PR tree is read only as data: its diff and file names.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: The base this merge commit was built on
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          [ "$(git rev-parse HEAD^2)" = "$PR_HEAD" ] || { echo "::error::HEAD is not the merge of this PR's head"; exit 1; }
          echo "BASE=$(git rev-parse HEAD^1)" >> "$GITHUB_ENV"
      # Go builds the base's statement lister, which reads the PR's files as data, so verify can
      # list the deletion sites itself (#4602). Before the download, so no artifact stands in for it.
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version: "1.26.11" # = the mutants job's, so both list the same sites
          cache: false
      # Before the base copy is written, so nothing an artifact unpacks can stand in for it.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          pattern: mutants-*
          path: ${{ runner.temp }}/mutants
      - name: The base copy of the gate
        run: |
          rm -rf tools broker/core/core.txt
          git archive "$BASE" tools broker/core/core.txt | tar -x
      # Each artifact lands in its own directory. verify recomputes the claim from the diff, needs
      # exactly one readable result for each shard of each claimed package across them, rechecks each
      # as `run` does, needs one deletion verdict per site it lists, joins the shards, then gates: the
      # JSON is data, never a verdict.
      - name: Gate (MUT-tierA)
        env:
          RESULTS: ${{ runner.temp }}/mutants
        run: |
          python3 -I tools/mutgate.py verify "$RESULTS" --git "$BASE" --summary "$GITHUB_STEP_SUMMARY"
