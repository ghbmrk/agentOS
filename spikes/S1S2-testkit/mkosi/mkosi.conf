# S1/S2 test kit image: the S7 recommendation on real parts.
# Debian 13 packages, /usr on dm-verity, booted Microsoft-signed shim -> Debian-signed systemd-boot
# -> Debian-signed kernel, with systemd boot counting. Built in CI (.github/workflows/testkit.yml).
[Distribution]
Distribution=debian
Release=trixie
Repositories=main

[Output]
Format=disk
ImageId=agentos-tk
ImageVersion=1
SplitArtifacts=yes
RepartDirectories=mkosi.repart

[Content]
Bootable=yes
Bootloader=systemd-boot
BiosBootloader=none
ShimBootloader=signed
UnifiedKernelImages=no
# No root=: systemd-boot sets LoaderDevicePartUUID, so gpt-auto finds root and /usr on the boot disk only (S7 surprise 3).
KernelCommandLine=console=tty0 console=ttyS0 rw quiet
Hostname=agentos-tk
Packages=
        linux-image-amd64
        shim-signed
        systemd-boot
        systemd-boot-efi-amd64-signed
        systemd
        systemd-sysv
        systemd-resolved
        udev
        dbus
        cryptsetup-bin
        dosfstools
        util-linux
        pciutils
        usbutils
        tpm2-tools
        mokutil
        python3
        modemmanager
        libqmi-utils
        libmbim-utils
        alsa-utils
        sox
        espeak-ng

# Preset first-boot answers so nothing ever waits for a keyboard. Root is locked: the kit needs no login.
Locale=C.UTF-8
Keymap=us
Timezone=UTC
RootPassword=hashed:!
