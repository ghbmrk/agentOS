# S7 option A: Ubuntu 24.04 packages, image-based (systemd A/B /usr + dm-verity),
# booted through the Microsoft-signed shim -> Canonical-signed GRUB -> Canonical-signed kernel.
[Distribution]
Distribution=ubuntu
Release=noble
Repositories=main,universe
Mirror=http://archive.ubuntu.com/ubuntu

[Output]
Format=disk
ImageId=agentos
ImageVersion=1
SplitArtifacts=yes
RepartDirectories=mkosi.repart

[Content]
Bootable=yes
Bootloader=grub
BiosBootloader=none
ShimBootloader=signed
KernelCommandLine=root=PARTLABEL=root-x86-64 console=ttyS0 systemd.journald.forward_to_console=1 rw
Packages=
        linux-image-generic
        shim-signed
        grub-efi-amd64-signed
        systemd
        systemd-sysv
        systemd-container
        systemd-resolved
        udev
        dbus
        tpm2-tools
        mokutil
        modemmanager
        network-manager
        wpasupplicant
        iproute2
        cryptsetup-bin
