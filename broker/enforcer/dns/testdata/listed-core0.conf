no-resolv
no-hosts
no-poll
stop-dns-rebind
bind-dynamic
except-interface=lo
interface=core0
cache-size=0
max-ttl=300
server=/core.example/198.51.100.53#53
local=/*.core.example/
nftset=/core.example/4#inet#enforcer#core_4,6#inet#enforcer#core_6
server=/updates.core.example/198.51.100.53#53
local=/*.updates.core.example/
nftset=/updates.core.example/4#inet#enforcer#core_4,6#inet#enforcer#core_6
