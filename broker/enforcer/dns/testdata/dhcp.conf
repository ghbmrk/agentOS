port=0
no-resolv
no-hosts
no-poll
stop-dns-rebind
bind-dynamic
except-interface=lo
interface=own0
interface=hh0
interface=gst0
interface=adm0
interface=core0
interface=ap0.101
interface=ap0.102
dhcp-leasefile=/var/lib/agentos-enforcer/dhcp.leases
dhcp-authoritative
dhcp-option=option:dns-server,0.0.0.0
dhcp-range=10.10.0.10,10.10.0.254,12h
dhcp-range=fd00:10::1000,fd00:10::ffff,64,12h
dhcp-range=10.20.0.10,10.20.0.254,12h
dhcp-range=10.30.0.10,10.30.0.254,12h
dhcp-range=10.40.0.10,10.40.0.254,12h
dhcp-range=10.50.0.10,10.50.0.254,12h
dhcp-range=10.101.0.10,10.101.0.254,12h
dhcp-range=10.102.0.10,10.102.0.254,12h
enable-ra
dhcp-option=option6:dns-server,[::]
