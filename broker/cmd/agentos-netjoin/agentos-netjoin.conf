<?xml version="1.0" encoding="UTF-8"?>
<!--
  AgentOS home Wi-Fi helper's system bus policy (P2-2w c3 r1; Security L8
  on the P2-2w plan, "What a compromised helper reaches"). Installed by the
  image to /usr/share/dbus-1/system.d/. The bus applies user policies after
  NetworkManager's default one, and within a policy the last matching rule
  wins: the helper's user may send NetworkManager only the calls nmBus
  makes (main.go). That takes away GetSecrets, Delete, ListConnections,
  activation, device methods and property writes; polkit's
  settings.modify.system still lets Update2 rewrite any connection.
-->
<busconfig>
  <policy user="agentos-netjoin">
    <deny send_destination="org.freedesktop.NetworkManager"/>
    <!-- The join (L8.4). -->
    <allow send_destination="org.freedesktop.NetworkManager" send_type="method_call"
           send_interface="org.freedesktop.NetworkManager.Settings" send_member="GetConnectionByUuid"/>
    <allow send_destination="org.freedesktop.NetworkManager" send_type="method_call"
           send_interface="org.freedesktop.NetworkManager.Settings" send_member="AddConnection2"/>
    <allow send_destination="org.freedesktop.NetworkManager" send_type="method_call"
           send_interface="org.freedesktop.NetworkManager.Settings.Connection" send_member="Update2"/>
    <!-- The scan (P2-2w c4b, netjoin N10). -->
    <allow send_destination="org.freedesktop.NetworkManager" send_type="method_call"
           send_interface="org.freedesktop.NetworkManager.Device.Wireless" send_member="GetAllAccessPoints"/>
    <!-- Both outcomes' property reads; no Set or GetAll. -->
    <allow send_destination="org.freedesktop.NetworkManager" send_type="method_call"
           send_interface="org.freedesktop.DBus.Properties" send_member="Get"/>
  </policy>
</busconfig>
