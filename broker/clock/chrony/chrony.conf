# AgentOS time sources (TIM-1, HW-8; HOST-1b). Installed by the image (P2-1) as
# /etc/chrony/chrony.conf, replacing Debian's, with systemd-timesyncd masked.
#
# No rtcsync, rtcfile, hwclockfile or rtconutc: chronyd never writes the host's
# hardware clock, and without rtcsync it keeps the kernel's STA_UNSYNC flag set,
# so the kernel's 11-minute mode never copies the clock into it either. Windows
# keeps that clock in local time; writing it would change the PC's time (HW-8).
#
# NTS-authenticated servers first (security T4), the Debian pool as fallback.
# The broker counts a sync as verified only from an NTS-authenticated selected
# source or three combined sources (clock.Synced). No sourcedir: servers handed
# out by DHCP on whatever Wi-Fi the box joins are not used.
server time.cloudflare.com iburst nts
server nts.netnod.se iburst nts
server ptbtime1.ptb.de iburst nts
pool 2.debian.pool.ntp.org iburst maxsources 4

ntsdumpdir /var/lib/chrony
driftfile /var/lib/chrony/chrony.drift
# Step the clock at start-up if it is more than a second out (the hardware
# clock may be hours off), slew afterwards.
makestep 1 3
